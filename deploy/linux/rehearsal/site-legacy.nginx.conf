# 彩排用的站点文件快照：plant3d-web 的 deploy/nginx_remote.conf，2026-08-03 那次前端部署
# 写到服务器 /etc/nginx/sites-available/plant3d-web 的就是这一份（还没有校审分流的 include）。
# 放在这里不是给谁去部署的，是让 rehearse-backend-stack.yml 能在 runner 上复现出
# 「install_backend.sh 往一份真站点文件里插 include」这件事——自己现编一份的话，
# /api → :3100 与 ^~ /files/ 这两条压不压得住新分流就验不出来了。
# 前端那边改了模板，这一份要跟着更新。
# Plant3D-Web Nginx 配置 (Remote Server 123.57.182.243)
# 部署路径: /etc/nginx/sites-available/plant3d-web 或 /etc/nginx/conf.d/plant3d-web.conf

server {
    listen 80;
    server_name 123.57.182.243;

    # 静态文件根目录
    root /var/www/plant3d-web;
    index index.html;

    # Vite 的入口 HTML 必须每次向服务器 revalidate，避免旧 index.html 继续引用旧 hash bundle。
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 前端应用 / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # hash 命名的静态资源可以长期缓存；文件内容变更时 Vite 会生成新文件名。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # API 反向代理 (后端服务)
    location /api {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文件服务反向代理
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DuckDB-WASM 读取 Parquet 依赖 Range 请求；跨域嵌入 PMS 时必须暴露这些响应头。
        # 后端也会写 CORS 头；这里先隐藏上游同名头，避免浏览器因重复 CORS 头拒绝请求。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, Content-Type, ETag, Last-Modified" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # 大文件支持
        client_max_body_size 100M;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;
}
