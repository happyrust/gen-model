# ─────────────────────────────────────────────────────────────────────────────
# Rust 房间夹具 live 批次专用配置（scripts/live-batches/room-fixture-8071.json）
#
# 从 DbOption-roomtest.toml 拷贝（2026-08-12），唯一差异是 room_key_word 扩成
# ["ZZ-R-", "-RM"]：parity 系用例在进程内 clone 覆盖成 ZZ-R-，不看本键；但两条
# 结构触发用例（live_room_structural_triggers_* / live_room_rename_into_*）
# 断言的是**全局** DbOption 关键字命中 `-RM`（room_fixture.rs:708 自述），
# pytest 那份只有 ZZ-R- 会让它们必红。加列表项对其余用例无影响——8071 是
# 一次性空库，除夹具外没有任何可被 -RM 误圈的房间。
#
# 其余与 roomtest 相同：v_port=8071 一次性内存实例；meshes 在 tests/.meshes；
# room_incremental=true；project_path 沿用 testbed 项目副本（单实例锁）。
# 跑法见 room-fixture-8071.json 的 comment（起 8071、护住仓库根树快照）。
# ─────────────────────────────────────────────────────────────────────────────

#同步文件配置
