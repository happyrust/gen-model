# aios-py：aios-database 的 Python 调试绑定（maturin 构建，产物模块名 aios_db）。
#
# 三个自研 git 依赖必须与主 crate 的声明逐字一致（同 URL + 同 rev），根 Cargo.toml
# 的 [patch]（vendor 本地重定向）才能把整张图收敛到同一份源码。
[package]
name = "aios-py"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# 内部扩展模块名；对外的 Python 包是 pysrc/aios_db（先注册原生 DLL 目录再导入本模块）。
name = "_aios_db"
crate-type = ["cdylib"]

[features]
default = []
# 只有直读 / 对拍入口用 old-pdms-io + old-parse-pdms-db，默认依赖图里没有它们
# （`docs/plans/2026-09-03-old-pdms-io-retirement-inventory.md`）。aios-database 的
# 逐会话回放入口（`IncrementPipeline::collect_changes`）也只在它的 `legacy_session_replay`
# 后面，所以那个 feature 挂在这道门上——挂到无条件依赖上会把 pdms_io 拖进整个工作区的默认图。
legacy_pdms_io = [
    "dep:pdms_io",
    "dep:parse_pdms_db",
    "aios-database/legacy_session_replay",
]

[dependencies]
aios-database = { path = ".." }
aios_core = { git = "https://github.com/happyrust/old-aios-core.git", rev = "4a7a00f93f3afa4069922ea52fab174cbbbddcde", default-features = false }
pdms_io = { git = "https://github.com/happyrust/old-pdms-io.git", rev = "14e2836cbad5949f3e09365ab75c01328b1eab2e", optional = true }
parse_pdms_db = { git = "https://github.com/happyrust/old-parse-pdms-db.git", rev = "005936a6767bd92f733aa4a7d113a07391487eef", optional = true }

anyhow = "1.0.57"
serde_json = "1.0.81"
tokio = { version = "1.37.0", features = ["rt-multi-thread"] }
# 只为了 db.query 直通里的 surrealdb::Value 类型；与主 crate 同源（Cargo.lock 锁同一 rev）。
surrealdb = { git = "https://gitee.com/happydpc/surrealdb.git", default-features = false }
pyo3 = { version = "0.29.2", features = ["abi3-py310", "anyhow"] }
pythonize = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
indexmap = "2.14.0"
# fixture.move_body 的 min/max 参数要拼 glam::Vec3（与主 crate 同版本，Cargo.lock 已锁）。
glam = "0.29.3"
