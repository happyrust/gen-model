# ─────────────────────────────────────────────────────────────────────────────
# ams8000 空间树启动初始化 + 增量回放测试专用配置（python/testbed/spatial_tree_8000.py）
#
# 从 DbOption-pytest.toml 拷贝（2026-08-12），差异：
#   1. v_port=8072：驱动脚本自起的一次性内存 SurrealDB（bin/surreal.exe），
#      驱动退出即全部丢弃——8009 正式库、8019 testbed 库、8071 pytest 房间档
#      一概不碰；
#   2. meshes_path 指向 testbed/meshes-spatial8000（.gitignore 排除），
#      生成产物不混入 testbed/meshes；
#   3. room_incremental=false：本驱动只测空间树链路。开着的话，增量窗口的
#      staged 提交会发布 room_recalc 目标，而 8000 库里没有房间面板几何
#      （AMS 房间在 7997/1112），房间轮只会空转出噪音日志。空间意图
#      （spatial_reconcile）与 epoch 不受本键影响。
#
# project_path 沿用 testbed 项目副本：full_init 的单实例锁与 manager 目录解析
# 需要完整项目结构。驱动会临时把 ams000/ams8000_0001 换成 sesno-24 基线快照
# （结束后逐字节还原），因此**测试期间勿并行跑 run_full_loop.py 或 pytest 房间档**。
# ─────────────────────────────────────────────────────────────────────────────

