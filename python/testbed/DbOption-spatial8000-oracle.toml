# ─────────────────────────────────────────────────────────────────────────────
# spatial_tree_8000.py 双库对拍的 B 侧（对照库）配置。
#
# 与 DbOption-spatial8000.toml 只差两处：v_port=8073（第二个一次性内存实例）、
# meshes_path 指向 testbed/meshes-spatial8000-oracle（生成产物与 A 侧分账）。
# 用途：驱动把项目文件换成 issue-019 的 final-26 后，在这个库上直接
# baseline@26 + 全量出清生成，与 A 侧「baseline@24 + 增量回放 25/26」的产物
# 做 (refno, aabb哈希) 集合与树内容的逐条对拍。其余键面与 A 侧保持一致，
# 改 A 侧配置时这里要跟着改。
# ─────────────────────────────────────────────────────────────────────────────

