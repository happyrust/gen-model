# rumqttd 配置文件

id = 0

# Router 配置
[router]
id = 0
instant_ack = true
max_segment_size = 104857600
max_segment_count = 10
max_connections = 10010
max_outgoing_packet_count = 200

# 控制台配置
[console]
enable = true
listen = "0.0.0.0:3030"

# MQTT v4 服务器配置
[[servers]]
listen = "0.0.0.0:1883"
next_connection_delay_ms = 1

[servers.connections]
connection_timeout_ms = 60000
max_payload_size = 20480
max_inflight_count = 100
dynamic_filters = false

# MQTT v5 服务器配置（可选）
[[servers]]
listen = "0.0.0.0:1884"
next_connection_delay_ms = 1
protocol = "v5"

[servers.connections]
connection_timeout_ms = 60000
max_payload_size = 20480
max_inflight_count = 100
dynamic_filters = true

# WebSocket 配置（可选）
[[servers]]
listen = "0.0.0.0:8080"
next_connection_delay_ms = 1
protocol = "websocket"

[servers.connections]
connection_timeout_ms = 60000
max_payload_size = 20480
max_inflight_count = 100