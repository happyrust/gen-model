[package]
name = "mqtt-server"
version = "0.1.0"
edition = "2021"

[dependencies]
rumqttd = "0.19"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }