#【新增 2026-09-04】store_mode —— 持久层介质与「谁把它拉起来」。
# 这一份夹具 / 现场配置连的是外面那台已经在跑的 SurrealDB（上面 v_ip:v_port），
# 所以显式写 external。默认值翻过两次（2026-09-04 翻成 spawned-mem，2026-09-07 翻回 external），
# 自带存储那一档从此要显式写 spawned-mem。翻过的默认不能被依赖——漏写这一行的配置每翻一次
# 就静默换一回介质，护栏因此逼着每一份夹具 / 现场配置都把它写出来。
# 取值：external / spawned-mem / embedded-mem；环境变量 AIOS_STORE_MODE 压过本键。
# 计划：docs/plans/2026-09-04-spawned-memory-store-out-of-box.md
#【变更 2026-10 / ADR-083 二次修订】store_mode 在本文件**生效**：介质按 环境变量 AIOS_STORE_MODE
# > 本键 > 默认 rocksdb 三层裁决——所以仓内夹具一律不许带它（预置 = 替所有用这份配置跑的进程
# 静默定介质，护栏 no_db_option_fixture_still_carries_a_store_mode_key 钉死）。退役别名写了仍认但会被点名。
# 这份配置此前写的是 store_mode = "rocksdb"——配套脚本启动服务时要带 AIOS_STORE_MODE=rocksdb。
# 上面关于「环境变量压过本键」的老话随之作废，留作决策史。
#【新增 2026-09-05；2026-09-07 订正】data_face —— 数据面形态。这一份配置是摄入部署（整库基线
# + 稳态增量窗口、推进 applied_sesno），所以写 ingest。
# 它**不自己做主**：生效值由 store_mode 派生（data_face_for_store——只有 external 回 ingest，
# 两档内存回 read-through：不做基线、不开数据窗口，pe / ATT_* 行随模型生成与按需请求写进库）。
# 本键与环境变量 AIOS_DATA_FACE 都**不压过**它，只在与介质给出的那一档不符时由 data_face_notice
# 报一行警——写它是为了让配置自己说清要哪个数据面，说错了当场被点名，而不是静默按介质走。
# 取值：read-through / ingest。护栏要求每一份夹具 / 现场配置都写出来。
# 计划：docs/plans/2026-09-05-kv-mem-zero-ingest-read-through-plan.md
