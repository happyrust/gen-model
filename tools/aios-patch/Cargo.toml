[package]
name = "aios-patch"
version = "1.4.0"
edition = "2024"
description = "Create and apply self-contained binary patches for aios-database.exe"

[[bin]]
name = "aios-database-patch"
path = "src/main.rs"

[[bin]]
name = "aios-patch-maker-gui"
path = "src/bin/maker_gui.rs"

[dependencies]
anyhow = "1.0.57"
clap = { version = "4.3.5", features = ["derive"] }
hex = "0.4.3"
memmap2 = "0.9.5"
qbsdiff = "1.4.4"
serde = { version = "1.0.137", features = ["derive"] }
serde_json = "1.0.81"
sha2 = "0.10.9"
tempfile = "3.27.0"
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }

