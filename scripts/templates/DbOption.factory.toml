# ============================================================================
# AMS 本地发布包 · 出厂配置模板（DbOption.factory.toml）
#
# 这份是「还没配置」的形态：project_path 留空，因此服务会进「设置模式」——
# 只起 HTTP 供 http://127.0.0.1:9099/setup.html 配置向导，配好保存并重启后进入正常服务。
# 不想用向导的，直接改本文件再重启也一样：真值永远是这份文件。
# runtime 与带 workspace 两档共用这一份、原样进包：出厂都是 mem（库在后端进程里，零依赖，
# 解压即跑）。介质在向导第②步选（ADR-083 修订，2026-10）：外部库 external / 内存库 memory，
# 选中档写进下面的 store_mode；要数据活过重启的现场选 external，并把 v_ip:v_port 指到一台
# 已在跑的 SurrealDB 2.x。命令行覆盖仍以 AIOS_STORE_MODE 优先。
# ============================================================================

#同步文件配置（缺省形态，向导不管这几项）
total_sync = false
incr_sync = false
sync_history = false
enable_log = false
sync_graph_db = false
sync_versioned = false
sync_tidb = false
sync_localdb = false
sync_live = true
replace_dbs = false
sync_chunk_size = 100_0000

#项目设置 —— 向导第①步填这里
# 手动指定模板版本后跳过自动识别，优先于 AIOS_E3D_TEMPLATE_DIR。
# 支持 e3d31 / e3d210；本 AMS 发布模板使用 E3D 3.1，部署 2.10 时显式改为 e3d210。
# 删除此项后仍优先采用 AIOS_E3D_TEMPLATE_DIR，环境目录也未设置时使用产品默认
# e3d210（不是从数据库二进制自动识别）。
e3d_version = "e3d31"
# E3D 项目根目录（装着各项目子目录的那一层），如 "D:/AVEVA/Projects/E3D3.1"。这是第一个搜索根。
project_path = ""
# 其它搜索根（本地或 UNC，如 "//server/share/Projects"），顺序即优先级：MDB 声明的外部项目
# 按项目码在各搜索根里找 <code>000 库目录（ADR-078）。远程项目填这里。
project_search_paths = []
# 已退役（ADR-078）：项目集合由 MDB 派生，这一项不再参与解析，非空时启动只打一句提示。
included_projects = []
catalogue_project_priority = []
mdb_name = "ALL"
project_name = ""
project_code = 0
surreal_ns = 0
module = "DESI"

#是否生成模型数据 —— 向导第④步「初始化档位」写这两项（只导数据=false / 一步到位=true）
gen_model = false
gen_mesh = false
gen_history_model = false
save_db = true
mesh_tol_ratio = 3.0
apply_boolean_operation = true
#是否生成房间树
gen_spatial_tree = false
load_spatial_tree = false
save_spatial_tree_to_db = true
gen_model_batch_size = 100
pe_chunk = 500
att_chunk = 200

#arangodb 配置（未使用的旧集成，保留缺省）
arangodb_database = "ams"
multi_threads = false
only_sync_sys = false
arangodb_url = "http://127.0.0.1:8529"
rebuild_ssc_tree = false
arangodb_user = "root"
arangodb_password = ""

#tidb 配置（未使用的旧集成，保留缺省）
ip = "127.0.0.1"
user = "root"
password = "root"
port = "3306"
sql_threads_number = 50
batch_insert_sql_cnt = 100

#版本服务配置（SurrealDB）—— 向导第②步可改地址。只有两档：mem（库在进程里）/ rocksdb（连下面这台）
v_ip = "127.0.0.1"
v_user = "root"
v_password = "root"
# rocksdb 档要连的那台 SurrealDB 的端口；这一格是数字，不能写空串。mem 档不用它，
# 预填 8009 只为切档时少填一格。
v_port = "8009"
# 介质（mem / rocksdb）分层裁决（ADR-083 修订，2026-10）：环境变量 AIOS_STORE_MODE >
# 本文件的 store_mode > 默认 rocksdb（漏设要当场报连不上，而不是悄悄跑在内存库上）。
# store_mode 是向导第②步「外部库 external / 内存库 memory」落盘的那一格——本包出厂不写它，
# Start-AMS.ps1 不给 -StoreMode、文件也没写时回填 mem，双击即跑照旧；向导里选了档就写进
# 这里，冷启动与向导重启都按它走。环境变量 pin 了相反档时启动日志会并排点名两边。
# 出厂 mem：数据库在后端进程内，无子进程、无 Surreal TCP 端口，进程一退数据即清空。
# 要数据活过重启：在向导第②步选「外部库（external）」并把上面 v_ip:v_port 指到一台
# 已在跑的 SurrealDB 2.x——本服务只连、不拉起；或先用包内 Start-Surreal.ps1 起一台。
# 持久模式：kv-mem 只保存新生成的 root overlay，冷 root 直接查 RocksDB，不回填。
model_cache_mode = "incremental-overlay"

#服务器启动配置 —— 向导第③步；0.0.0.0 = 局域网可访问（配置向导页仍只许本机打开）
server_release_ip = "0.0.0.0:9099"
http_api_addr = "0.0.0.0:9099"
# 对外展示地址只生成日志/浏览器/分享链接，不参与 socket 绑定；留空从监听地址派生。
http_public_addr = ""

#消息队列（未使用，保留缺省）
mqtt_host = "127.0.0.1"
mqtt_port = 1881

location = ""

remote_file_server_hosts = [""]
file_server_host = ""

#调试选项（缺省形态）
save_model_mesh_to_graph_db = true
need_sync_refno_basic = false
reset_mdb_project = false
only_update_dbinfo = false
debug_print_world_transform = false
only_rebuild_pdms_element = false

debug_refno_types = []
manual_db_nums = []
# 空 = 不限制增量监听范围（本 MDB 声明的全部设计库）
watch_dbnums = []
location_dbs = []
included_db_files = []
plat_url = ""

#puhua（未使用的旧集成，保留缺省）
puhua_database_ip = "localhost:3306"
puhua_database_user = "root"
puhua_database_password = "root"

replace_mesh = true
room_key_word = ["-RM"]

# 数据与模型增量缺省开启（与代码默认一致）。房间归属计算 2026-10-23 起不再是开关：算得了房间的进程
#（AIOS_SPATIAL_COMPUTE 开着、编了 project_hd / project_hh，发布包都是）恒开——构件挪了位置，它所属生成根重算时
# 顺带重算房间归属、与模型行同一笔事务落库。MDB 声明的设计库缺文件、在册面板缺几何只让房间降级
#（/health 的 features.room = degraded），不拦模型（ADR-073 D8–D11）。退役的 room_membership 键 / AIOS_ROOM_MEMBERSHIP
# 写了不生效、只在启动横幅被点名，模板里不再写。
data_incremental = true
model_incremental = true

# 设计→设计引用级联（P4，2026-09-30 起默认开，GitHub #32）：被 POSREF 参照的件挪了，参照它的件所在的根跟着重算。
# 反查判不了时整窗已持久化的根重算并在回执点名。要关用 model_design_reference_cascade = false
# 或环境变量 AIOS_MODEL_DESIGN_REFERENCE_CASCADE=0（环境变量压过本键）。
model_design_reference_cascade = true

# 电缆端点 / 路由反向级联（C8，2026-10-17 起默认开，GitHub #35）：EQUI / ELCONN 或 CWBRAN 及其附着点 / 子路径变了，
# 到本库及 MDB 其余设计库 STAREF / ENDREF 反向表点查引用它的 CABLE / EXTGEO，同库并进 touched、跨库交接。
# 要关用 model_cable_endpoint_cascade = false 或环境变量 AIOS_MODEL_CABLE_ENDPOINT_CASCADE=0。
model_cable_endpoint_cascade = true

# 刚体前移（ADR-066，2026-10-14 起默认开，GitHub #36）：只动了方位的窗口左乘 Δ 不重算网格，
# 判不刚或执行体不成都回退整根重算。要关用 model_transform_cheap_path = false
# 或环境变量 AIOS_MODEL_TRANSFORM_CHEAP_PATH=0。
model_transform_cheap_path = true

# 单元级发布（ADR-080，2026-10-14 起默认开，GitHub #50）：根内只重建 plan_update 点名的单元，
# 复用窗口计划缓存；根几何记录 < 10 条回退整根重算。要关用 model_unit_level_publish = false
# 或环境变量 AIOS_MODEL_UNIT_LEVEL_PUBLISH=0。
model_unit_level_publish = true

# 文件身份冲突只记录并跳过，不阻断其它库初始化。
block_file_identity_conflicts = false

model_concurrency_mode = "adaptive"
model_regen_claim_page = 100
model_post_regen_aabb_page = 256
model_regen_execution_group = 16
model_root_inflight_max = 4
model_full_rebuild_enabled = true

# 进程内四块按**数量**设闸的常驻（ADR-082 / ADR-084 / 内存控制计划 P4，2026-09-22 补进模板）。不写 = 下面的默认值，写 0 = 不限；
# 对应环境变量 AIOS_MODEL_OVERLAY_MAX_ROOTS / AIOS_MODEL_ELEMENT_CACHE_MAX_ENTRIES / AIOS_MODEL_GENERATION_INPUT_MAX_DBNUMS /
# AIOS_MODEL_HISTORICAL_SNAPSHOTS_MAX 压过本键。现值都在 /health.model_cache（overlay / element_cache / historical）与 /ops.html 底栏。
# model_overlay_max_roots            —— 模型投影 overlay 最多常驻多少个根（≈ 13.8 KB/根；只逐已落盘的根、只在 rocksdb 介质下动）。
# model_element_cache_max_entries    —— 每份生成用 DbSet 的池级元素缓存最多装多少个元素（≈ 3.6–4.7 KB/元素；满了整张清）。
# model_generation_input_max_dbnums  —— 生成输入缓存最多同时留几个库的 GenerationInput（≈ 0.7–0.95 GB/库；最久没用的库先出）。默认 0 待真机定。
# model_historical_snapshots_max     —— 历史快照最多同时留几格（最久没 generate 的先丢，再查 = SNAPSHOT_NOT_FOUND）。
model_overlay_max_roots = 50000
model_element_cache_max_entries = 200000
model_generation_input_max_dbnums = 0
model_historical_snapshots_max = 16
