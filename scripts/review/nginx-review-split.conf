# Include inside the deployment's existing server block.
# Replace these local upstream addresses for the deployment; preserve frontend location /.
# Keep /api/projects and other non-migrated API paths on their existing upstream.
location ~ ^/(api/review(?:/|$)|api/users(?:/|$)|api/auth(?:/|$)|files/review_attachments(?:/|$)|api/v1(?:/|$)) {
    proxy_pass http://127.0.0.1:8022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
}
location /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
