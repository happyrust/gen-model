[package]
name = "aios-database"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
config = "0.13.1"
bincode = "1.3.3"
anyhow = "1.0.57"
serde_json = "1.0.81"
hex = "0.4.3"
once_cell = "1.12.0"
futures = "0.3.21"
smol_str = "0.1.23"
itertools = "0.10.3"
lazy_static = "1.4.0"
async-trait = "0.1.52"
dotenv = "0.15.0"
approx = "0.5.1"
flate2 = "1.0.23"
log = "0.4.17"
memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.0"
regex = "1.5.6"
calamine = "0.18.0"
append-only-vec = "0.1.2"
sled = "0.34.7"
derive_more = "0.99.17"
bitflags = "1.3.2"
bitvec = "1.0.0"


parse_pdms_db = { path = "../aios-parse-pdms" }
aios_core = { path = "../aios-core"}
#arangors_lite = { path = "../arangors-lite" }
#parse_pdms_db = { git = "https://gitee.com/happydpc/aios-parse-pdms" }
#aios_core = { git = "https://gitee.com/happydpc/aios-core" }
arangors_lite = "0.2.0"


clap = { version = "3.1.18", features = ["derive"] }
dashmap = { version = "5.2.0", features = ["serde"] }
tokio = { vertion = "1.18.2", features = ["full"] }
serde = {version="1.0.137", features=["derive"]}
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.20.2", features = ["transform-types"] }
sea-orm = { version = "0.8.0", features = ["default", "runtime-tokio"]}
#openssl = { version = "0.10", features = ["vendored"] }
#[target.'cfg(target_os = "macos")'.dependencies]
#simple-process-stats = { path = "../simple-process-stats"}
#
#[target.'cfg(target_os = "windows")'.dependencies]
#simple-process-stats = "1.0.0"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[dependencies.sqlx]
version = "0.6.0"
default-features = false
features = [
#    "runtime-async-std-native-tls",
    "runtime-async-std-rustls",
    "macros",
    "mysql",
    "tls",
    "chrono",
    "json",
    "decimal",
    "bigdecimal",
    "uuid",
    "time",
]