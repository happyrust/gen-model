[package]
name = "aios-database"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#sea-query = { path = "/Volumes/DPC/workspace/sea-query" }
sea-orm = { version = "0.8.0", features = ["default", "runtime-tokio"]}
aios_core = { path =  "../aios_core"}
config = "0.13.1"
parse_pdms_db = { path = "../aios-parse-pdms" }
bincode = "1.3.3"
anyhow = "1.0.57"
serde = {version="1.0.137", features=["derive"]}
serde_json = "1.0.81"
hex = "0.4.3"
futures = "0.3.21"

tokio = { vertion = "1.18.2", features = ["full"] }

[dependencies.sqlx]
version = "^0.5"
default-features = false
features = [
    "runtime-async-std-native-tls",
    "macros",
    "mysql",
    "tls",
    "chrono",
    "json",
    "decimal",
    "bigdecimal",
    "uuid",
    "time",
]