[package]
name = "aios-database"
version = "0.1.18"
edition = "2024"

# Python 调试绑定（python/aios-py）与主 crate 同一个 workspace：
# [patch] 段作用于全图（vendor 本地重定向对绑定同样生效），共享 Cargo.lock 与
# target/（OCC 只编一次）。default-members 钉在根 package，日常 cargo build/test
# 行为不变；绑定构建走 python/ 目录的 maturin（docs/plans/2026-08-11-python-binding-api-plan.md）。
[workspace]
members = [".", "python"]
default-members = ["."]
resolver = "3"

[lib]
name = "aios_database"
path = "src/lib.rs"


[features]
default = ["ws", "gen_model", "manifold", "project_hd", "http_api"]
console = ["ws", "gen_model", "manifold", "project_hd", "mqtt"]
local = []
ws = []
debug_obj_export = []
debug_model = []
debug_model_no_obj = ["aios_core/debug_wire", "aios_core/debug_expr"]
debug_expr = ["aios_core/debug_expr"]
mqtt = []
viewer = []                                                           #是否开启视图
gen_model = ["aios_core/gen_model"]
manifold = ["dep:manifold-csg"]
sql = ["dep:sqlx"]
# `pdms_io` 仍是生产增量窗口/快照读取底座，不属于旧几何生成器。
# 只有 OCC/gen_model 的可运行入口受 `legacy_model` 控制。
legacy_pdms_io = []
legacy_model = []
# Historical developer probes are deliberately not unlocked by
# `legacy_model`; that feature exposes only `legacy_model_gen`.
legacy_diagnostics = []
debug_parse = ["pdms_io/debug_parse"]
legacy_session_replay = ["pdms_io/legacy_session_replay"] # 逐会话实体回放，仅诊断/对拍
surreal_v2 = []
project_hd = []
project_hh = []
profile = []                                                          #性能分析，包含tracing功能
http_api = ["dep:axum", "dep:tower-http"]                             #前端Web服务(REST+WebSocket)
rvm_verify = ["dep:rvm-rs"]                                           #RVM 基准对拍（rvm_verify 探针）

[[bin]]
name = "rvm_verify"
path = "src/bin/rvm_verify.rs"
required-features = ["rvm_verify"]

[[bin]]
name = "rvm_generated_obj_compare"
path = "src/bin/rvm_generated_obj_compare.rs"
required-features = ["rvm_verify"]

[[bin]]
name = "incr_fold_probe"
path = "src/bin/incr_fold_probe.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "db8000_copy_probe"
path = "src/bin/db8000_copy_probe.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "legacy_model_gen"
path = "src/bin/legacy_model_gen.rs"
required-features = ["legacy_model"]

[[bin]]
name = "performance_test"
path = "src/bin/performance_test.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[bin]]
name = "test_gen_geos_data"
path = "src/bin/test_gen_geos_data.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[bin]]
name = "node_gen_room_probe"
path = "src/bin/node_gen_room_probe.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[example]]
name = "performance_test_example"
path = "examples/performance_test_example.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[example]]
name = "stage_analysis_example"
path = "examples/stage_analysis_example.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[example]]
name = "test_gen_geos_data_example"
path = "examples/test_gen_geos_data_example.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[test]]
name = "db8000_two_delete_fixture"
path = "tests/db8000_two_delete_fixture.rs"

[[test]]
name = "db8000_session_pairs"
path = "tests/db8000_session_pairs.rs"

[dependencies]
config = "0.14.1"
bincode = "1.3.3"
# RVM 基准对拍：解析 AVEVA E3D 导出的 RVM/ATT（仅 rvm_verify feature 用）
rvm-rs = { git = "https://github.com/happyrust/rvm-rs", optional = true }
anyhow = "1.0.57"
e3d-model = { path = "../vendor/e3d-model" }
serde_json = "1.0.81"
hex = "0.4.3"
sha2 = "0.10.9"
tempfile = "3.27.0"
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }
once_cell = "1.12.0"
futures = "^0.3"
smol_str = "0.3.2"
itertools = "0.14.0"
lazy_static = "1.4.0"
approx = "0.5.1"
#flate2 = "1.0.23"
log = "0.4.17"

memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.1"
regex = "1.5.6"
calamine = { git = "https://gitee.com/happydpc/calamine.git" }
#sled = "0.34.7"
derive_more = { version = "1.0.0", features = ["deref", "deref_mut"] }
bitflags = "2.4.0"
bitvec = "1.0.0"
chrono = "0.4.22"
nalgebra = { git = "https://gitee.com/happydpc/nalgebra.git", features = [
    "serde",
    "rkyv",
    "glam029",
    "convert-glam029",
] }
parry3d = { git = "https://gitee.com/happydpc/parry.git", package = "parry3d", features = [
    "serde-serialize",
    "rkyv",
] }
parry2d = { git = "https://gitee.com/happydpc/parry.git", package = "parry2d" }
parse_pdms_db = { git = "https://github.com/happyrust/old-parse-pdms-db.git", rev = "005936a6767bd92f733aa4a7d113a07391487eef" }
aios_core = { git = "https://github.com/happyrust/old-aios-core.git", rev = "d97586c795e72229a63921c04d46a5abb780e812", default-features = false }
bevy_transform = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_transform" }
bevy_reflect = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_reflect" }
pdms_io = { git = "https://github.com/happyrust/old-pdms-io.git", rev = "14e2836cbad5949f3e09365ab75c01328b1eab2e" }
# ADR-053 direct 模式的取数底座（t-354）。**路径依赖，不是 git+rev**：两个仓都还在
# `old/vendor/` 下当场演进，没有可钉的上游。稳定后按 pdms_io 的样子换成 git+rev。
# e3d-io 自己 path 依赖 ../e3d-attlib，两者必须并排放在 old/vendor/ 下。
# e3d-attlib 这里也直列一份：direct 转换器要用它的 base-27 反哈希把词属性还原成
# WordType 字符串（ADR-053 P0 残差分类第 1 条），那是转换语义的一部分，不是传递依赖。
e3d-io = { path = "../vendor/e3d-io" }
e3d-attlib = { path = "../vendor/e3d-attlib" }

clap = { version = "4.3.5", features = ["derive"] }
dashmap = { version = "=7.0.0-rc2", features = ["serde", "rayon"] }
tokio = { version = "1.37.0", features = ["full", "test-util"] }
serde = { version = "1.0.137", features = ["derive"] }
sysinfo = "0.33.1"
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.29.3", features = ["serde", "rkyv"] }
cached = "0.55.1"
rkyv = { version = "0.7.45", features = ["hashbrown"] }


# 扫掠体截面：与 aios-core `wire::gen_polyline_original` 同一个 Polyline 类型（同一 fork），
# 倒角与弧段只有那一份权威实现，这里只做 bulge → 折线的离散。
cavalier_contours = { git = "https://gitee.com/happydpc/cavalier_contours" }
# 扫掠体端面：结构截面是凹的（L/C/I），端盖需要带孔的多边形三角剖分。
earcutr = "0.4.3"

# ADR-029：设计布尔走本地 manifold-csg（不经 aios-core 的旧 manifold-sys）。
manifold-csg = { git = "https://github.com/zmerlynn/manifold-csg", rev = "2233c5a1162eba981e3f43efcd39a6bc25581335", optional = true }
serde_with = { version = "3.9.0", features = ["macros"] }
rayon = "1.10.0"
# 几何并发闸默认额度 = 物理核数（specs/023 / ADR-041 第 3 条）；
# std::thread::available_parallelism 给的是逻辑核数，物理核数只有它能拿到。
num_cpus = "1.16"
indexmap = "2.2.6"
urlencoding = "2.1.3"
notify = "8.0.0"
walkdir = "2.5.0"
num_enum = "0.7.2"
jsonxf = "1.1.1"
#sea-orm = { version = "1.1.1", features = [
#    "sqlx-mysql",
#    "runtime-async-std",
#], optional = true }
surrealdb = { git = "https://gitee.com/happydpc/surrealdb.git", default-features = false, features = [
    "protocol-ws",
    # ADR-017 暂存介质：进程内嵌入式 mem 引擎（Surreal<Any> 指向 mem://）。
    # 写回目标仍是 ws 连的 fork 服务器，本仓不开 kv-rocksdb。
    "kv-mem",
    #    "kv-rocksdb",
] }
async-once-cell = "0.5.3"
rumqttc = "0.24.0"
petgraph = { version = "0.8.1", features = ["serde-1"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["registry", "json"] }
tracing-chrome = "0.7.1"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.1"
simplelog = "0.12.2"
downcast-rs = "1.2.0"
flume = "0.11.0"
rand = "0.9.0"

toml = "0.8.19"
pollster = "0.4.0"
async-std = "1.13.1"
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }
rmcp = { version = "=3.1.1", features = ["server", "transport-io"] }

# ── 自研 crate 的本地重定向（默认关闭）────────────────────────────────────
#
# 用 `scripts/Toggle-LocalDeps.ps1 -On` 打开、`-Off` 关掉，别手改标记之间的内容。
# 打开后上面 [dependencies] 里的 git+rev 仍是权威来源声明，只是被重定向到本地
# 工作副本：改一行 Rust 就能直接编，不必再走「提交 → push → 升 rev」三步。
#
# 为什么用 [patch] 而不是把 [dependencies] 改成 path：parse_pdms_db 与 pdms_io
# 在它们自己的 Cargo.toml 里也 git 依赖 aios_core。只把本仓改成 path，依赖图里
# 会同时出现两份 aios_core，而 parse_pdms_db 把 aios_core 类型摆在 API 面上，
# 跨边界必然类型不匹配。patch 作用于整张图，三方一起收敛到同一份。
#
# 前提：下面三个 vendor 目录必须存在，且停在与上面 rev 对应的提交上。
#
#   ../vendor/old-aios-core      codex/libgm-snout-caliber = d97586c7
#   ../vendor/old-parse-pdms-db  codex/room-panel-wire-repair-deps = 2de7cd23
#   ../vendor/old-pdms-io        codex/room-panel-wire-repair-deps = 5e4e4d75
#
# 同名克隆有好几份，别接错。plant-code/rs-core 在 codex/fix-refno-enum-cata-hash
# 上（rkyv 0.8 那条线），engine-v2 在 plant-code/pdms-io，两者都不是这里要的。
# 还有个「看着像但落后」的诱饵：plant-code/dependency-pin-parse 停在
# newrepo-main = 03c1cdb，接上去能编过，但会把上面 rev 才有的 record-boundary
# 修复悄悄退掉。
#
# 打开状态下 Cargo.lock 里这三个包的 `source` 行会消失，所以**不能带着它推 main**。
# pre-push 守卫（.githooks/pre-push）会挡住，不必靠记性。
#
# LOCAL-DEPS PATCH BEGIN
# [patch."https://github.com/happyrust/old-aios-core.git"]
# aios_core = { path = "../vendor/old-aios-core" }
#
# [patch."https://github.com/happyrust/old-parse-pdms-db.git"]
# parse_pdms_db = { path = "../vendor/old-parse-pdms-db" }
#
# [patch."https://github.com/happyrust/old-pdms-io.git"]
# pdms_io = { path = "../vendor/old-pdms-io" }
# LOCAL-DEPS PATCH END
#
# ── 第四路（手动）：pdms-io.git 的 pdmsdb_engine_v2 ─────────────────────────
#
# 上面三仓之外还有一条链：parse_pdms_db → pdmsdb_engine_v2
# （git = https://github.com/happyrust/pdms-io.git，rev 钉在 old-parse-pdms-db
# 的 Cargo.toml 里，当前 13a17e1f）。Toggle-LocalDeps.ps1 不管这一路，所以
# engine-v2 工作副本（../../pdms-io-fork-engine-v2）里已落地但未上游的改动
# （specs/034 的 db4 语义层、open_at、页大小根因修复）gen-model 默认看不到。
#
# 开发期要现场消费 engine-v2 时，手动取消下面两行注释即可（core3d_model 经
# pdmsdb_engine_v2 的 path 依赖传递进图，不必单列 patch）。纪律与上面三仓相同：
# 验收前重新注释掉，等上游提交后升 rev（specs/034 T501），不得带 patch 推 main。
# 注意：**不要**把这两行挪进 BEGIN/END 标记之间——engine-v2 工作副本上常有他人
# 在飞改动，不应随 Toggle 脚本 -On 一键连带激活，开关必须是显式的手动动作。
#
# 2026-08-30：`../../pdms-io-fork-engine-v2` 已从磁盘上消失，带着 patch 连
# manifest 都解析不了，所以这两行改回注释态。要现场消费 engine-v2 时，先确认
# 工作副本还在，再取消注释。
#
# [patch."https://github.com/happyrust/pdms-io.git"]
# pdmsdb_engine_v2 = { path = "../../pdms-io-fork-engine-v2/crates/pdmsdb_engine_v2" }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }


[dependencies.sqlx]
version = "0.7.2"
default-features = false
optional = true
features = [
    "runtime-async-std-rustls",
    #    "runtime-async-std-native-tls",
    "macros",
    "mysql",
    # "tls",
    "chrono",
    "json",
    # "decimal",
    "bigdecimal",
    "uuid",
    "time",
]


#[profile.release]
#lto = true
#strip = true
#opt-level = 3
#panic = 'abort'
#codegen-units = 1

# 自研 crate 的本地重定向见文件中部的 LOCAL-DEPS PATCH 段。

