[package]
name = "aios-database"
version = "0.1.3"
edition = "2021"

[features]
default = ["ws", "gen_model", "manifold", "occ", "mqtt", "gui"]
gui = []
truck = []
local = []
ws = []
debug_obj_export = []
debug_model = []
debug_model_no_obj = ["aios_core/debug_wire", "aios_core/debug_expr"]
debug_expr = ["aios_core/debug_expr"]
mqtt = []
viewer = []                                                           #是否开启视图
gen_model = ["aios_core/gen_model"]
occ = ["aios_core/occ", "dep:opencascade"]
manifold = ["aios_core/manifold"]
sql = ["dep:sea-orm", "dep:sqlx"]
debug_parse = ["pdms_io/debug_parse"]
surreal_v2 = []

[dependencies]
config = "0.14.1"
bincode = "1.3.3"
anyhow = "1.0.57"
serde_json = "1.0.81"
hex = "0.4.3"
once_cell = "1.12.0"
futures = "0.3.21"
smol_str = "0.3.2"
itertools = "0.13.0"
lazy_static = "1.4.0"
async-trait = "0.1.52"
dotenv = "0.15.0"
approx = "0.5.1"
#flate2 = "1.0.23"
log = "0.4.17"

memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.1"
regex = "1.5.6"
calamine = "0.26.1"
#sled = "0.34.7"
derive_more = { version = "1.0.0", features = ["deref", "deref_mut"] }
bitflags = "2.4.0"
bitvec = "1.0.0"
chrono = "0.4.22"
nalgebra = { path = "../new-crates/nalgebra", features = [
    "serde",
    "rkyv",
    "glam029",
    "convert-glam029",
] }
parry3d = { path = "../new-crates/parry/crates/parry3d", features = [
    "serde-serialize",
    "rkyv",
] }
parry2d = { path = "../new-crates/parry/crates/parry2d" }
parse_pdms_db = { path = "../aios-parse-pdms" }
aios_core = { path = "../new-crates/aios-core", default-features = false }
bevy_transform = { path = "../new-crates/bevy/crates/bevy_transform" }
bevy_reflect = { path = "../new-crates/bevy/crates/bevy_reflect" }
pdms_io = { path = "../pdms-io" }
dpcsync = { path = "../dpc-sync" }


clap = { version = "4.3.5", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["serde", "rayon"] }
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.137", features = ["derive"] }
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.29.0", features = ["serde", "rkyv"] }
cached = "0.54.0"
rkyv = { version = "0.7.44", features = ["hashbrown"] }
rfd = "0.15.1"


#造型功能，先在database测试
opencascade = { path = "../new-crates/opencascade-rs/crates/opencascade", optional = true }
serde_with = { version = "3.9.0", features = ["macros"] }
rayon = "1.10.0"
indexmap = "2.2.6"
urlencoding = "2.1.3"
notify = "7.0.0"
walkdir = "2.5.0"
num_enum = "0.7.2"
jsonxf = "1.1.1"
sea-orm = { version = "1.1.1", features = [
    "sqlx-mysql",
    "runtime-async-std",
], optional = true }
surrealdb = { path = "../surrealdb/sdk", default-features = false, features = [
    "protocol-ws",
    #    "kv-rocksdb",
] }
async-once-cell = "0.5.3"
rumqttc = "0.24.0"
petgraph = { version = "0.6.4", features = ["serde-1"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
simplelog = "0.12.2"
downcast-rs = "1.2.0"
flume = "0.11.0"
rust-embed = "8"

gpui = { git = "https://github.com/huacnlee/zed.git", branch = "export-platform-window" }
#story = { path = "../new-crates/gpui-compoents/crates/story" }
ui = { path = "../new-crates/gpui-compoents/crates/ui" }
toml = "0.8.19"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[dependencies.sqlx]
version = "0.8.2"
default-features = false
optional = true
features = [
    "runtime-async-std-rustls",
    #    "runtime-async-std-native-tls",
    "macros",
    "mysql",
    # "tls",
    "chrono",
    "json",
    # "decimal",
    "bigdecimal",
    "uuid",
    "time",
]


#[profile.release]
#lto = true
#strip = true
#opt-level = 3
#panic = 'abort'
#codegen-units = 1
