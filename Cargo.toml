[package]
name = "aios-database"
version = "0.1.4"
edition = "2024"

[lib]
name = "aios_database"
path = "src/lib.rs"


[features]
default = ["ws", "gen_model", "manifold", "occ", "project_hd"]
gui = ["dep:gpui-component", "dep:gpui", "dep:story"]
console = ["ws", "gen_model", "manifold", "occ", "project_hd", "mqtt"]
truck = []
local = []
ws = []
debug_obj_export = []
debug_model = []
debug_model_no_obj = ["aios_core/debug_wire", "aios_core/debug_expr"]
debug_expr = ["aios_core/debug_expr"]
mqtt = []
viewer = []                                                           #是否开启视图
gen_model = ["aios_core/gen_model"]
occ = ["aios_core/occ", "dep:opencascade"]
manifold = ["aios_core/manifold"]
sql = ["dep:sqlx"]
debug_parse = ["pdms_io/debug_parse"]
surreal_v2 = []
project_hd = []
project_hh = []
profile = []                                                          #性能分析，包含tracing功能
http_api = ["dep:axum", "dep:tower-http"]                             #前端Web服务(REST+WebSocket)
rvm_verify = ["dep:rvm-rs"]                                           #RVM 基准对拍（rvm_verify 探针）

[[bin]]
name = "rvm_verify"
path = "src/bin/rvm_verify.rs"
required-features = ["rvm_verify"]

[dependencies]
config = "0.14.1"
bincode = "1.3.3"
# RVM 基准对拍：解析 AVEVA E3D 导出的 RVM/ATT（仅 rvm_verify feature 用）
rvm-rs = { git = "https://github.com/happyrust/rvm-rs", optional = true }
anyhow = "1.0.57"
serde_json = "1.0.81"
hex = "0.4.3"
once_cell = "1.12.0"
futures = "^0.3"
smol_str = "0.3.2"
itertools = "0.14.0"
lazy_static = "1.4.0"
approx = "0.5.1"
#flate2 = "1.0.23"
log = "0.4.17"

memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.1"
regex = "1.5.6"
calamine = { git = "https://gitee.com/happydpc/calamine.git" }
#sled = "0.34.7"
derive_more = { version = "1.0.0", features = ["deref", "deref_mut"] }
bitflags = "2.4.0"
bitvec = "1.0.0"
chrono = "0.4.22"
nalgebra = { git = "https://gitee.com/happydpc/nalgebra.git", features = [
    "serde",
    "rkyv",
    "glam029",
    "convert-glam029",
] }
parry3d = { git = "https://gitee.com/happydpc/parry.git", package = "parry3d", features = [
    "serde-serialize",
    "rkyv",
] }
parry2d = { git = "https://gitee.com/happydpc/parry.git", package = "parry2d" }
parse_pdms_db = { git = "https://github.com/happyrust/aios-parse-pdms.git", rev = "65caaef2a73161cf78371355bea26fd3a0d40c41" }
aios_core = { git = "https://github.com/happyrust/rs-core.git", rev = "7994051f2196b1b31d01678335783d06cab54142", default-features = false }
bevy_transform = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_transform" }
bevy_reflect = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_reflect" }
pdms_io = { git = "https://github.com/happyrust/pdms-io.git", rev = "1dd7fd4804c7ae3bcf5bf3ba5fc1d040139320a3" }
dpcsync = { git = "https://gitee.com/happydpc/dpc-sync.git" }

clap = { version = "4.3.5", features = ["derive"] }
dashmap = { version = "=7.0.0-rc2", features = ["serde", "rayon"] }
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.137", features = ["derive"] }
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.29.3", features = ["serde", "rkyv"] }
cached = "0.55.1"
rkyv = { version = "0.7.45", features = ["hashbrown"] }
rfd = { version = "0.15.1", features = ["async-std"] }


#造型功能，先在database测试
opencascade = { git = "https://github.com/happyrust/occt-rs.git", rev = "1c44c6e122b42a9efaf5c241af05bc3098c01b79", optional = true }
serde_with = { version = "3.9.0", features = ["macros"] }
rayon = "1.10.0"
indexmap = "2.2.6"
urlencoding = "2.1.3"
notify = "8.0.0"
walkdir = "2.5.0"
num_enum = "0.7.2"
jsonxf = "1.1.1"
#sea-orm = { version = "1.1.1", features = [
#    "sqlx-mysql",
#    "runtime-async-std",
#], optional = true }
surrealdb = { git = "https://gitee.com/happydpc/surrealdb.git", default-features = false, features = [
    "protocol-ws",
    #    "kv-rocksdb",
] }
async-once-cell = "0.5.3"
rumqttc = "0.24.0"
petgraph = { version = "0.8.1", features = ["serde-1"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["registry", "json"] }
tracing-chrome = "0.7.1"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.1"
simplelog = "0.12.2"
downcast-rs = "1.2.0"
flume = "0.11.0"
rand = "0.9.0"
rust-embed = "8"

gpui = { git = "https://github.com/huacnlee/zed.git", branch = "webview", optional = true }
story = { git = "https://gitee.com/happydpc/gpui-compoents", optional = true }
gpui-component = { git = "https://gitee.com/happydpc/gpui-compoents", optional = true }
toml = "0.8.19"
pollster = "0.4.0"
async-std = "1.13.1"
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }

[patch."https://gitee.com/happydpc/occt-rs.git"]
opencascade = { git = "https://github.com/happyrust/occt-rs.git", rev = "1c44c6e122b42a9efaf5c241af05bc3098c01b79" }
opencascade-sys = { git = "https://github.com/happyrust/occt-rs.git", rev = "1c44c6e122b42a9efaf5c241af05bc3098c01b79" }
kicad-parser = { git = "https://github.com/happyrust/occt-rs.git", rev = "1c44c6e122b42a9efaf5c241af05bc3098c01b79" }

# ── 开发分支：自研库改走本地克隆 ────────────────────────────────────────────
#
# 上面 [dependencies] 里的 git+rev 仍是权威来源声明，不要删；这里只把它们重定向
# 到本地工作副本，改一行 Rust 就能直接编，不必再走「提交 → push → 升 rev」三步。
#
# 为什么必须用 [patch] 而不是把 [dependencies] 改成 path：parse_pdms_db 与
# pdms_io 在**它们自己的** Cargo.toml 里也各自 git 依赖 aios_core。只把本仓改成
# path，依赖图里会同时出现两份 aios_core，而 parse_pdms_db 在 parse.rs /
# dict.rs / parse_explict_tools.rs 共 41 处把 aios_core 类型摆在 API 面上，
# 跨边界必然类型不匹配。patch 作用于整张图，三方一起收敛到同一份。
#
# 前提：下面三个路径必须存在，且分支对得上（都在 codex/public-dependency-pin-20260804）。
# 不具备这些克隆的机器，把这三个 [patch] 段整体注释掉即可退回纯 git 依赖。
#
#   ../../rs-core-pin        = D:\work\plant-code\rs-core-pin
#   vendor/aios-parse-pdms   = 本仓 vendor/（已 gitignore）
#   ../pdms-io               = D:\work\plant-code\old\pdms-io
#
# 注意同名克隆有好几份，别接错：plant-code/rs-core 在 codex/fix-refno-enum-cata-hash
# 上、plant-code/pdms-io 在 engine-v2-core-dll-aligned 上、pdms-io-fork 在 dev-3.1
# 上，三者都带着大量未提交改动，不是本分支要的东西。

[patch."https://github.com/happyrust/rs-core.git"]
aios_core = { path = "../../rs-core-pin" }

[patch."https://github.com/happyrust/aios-parse-pdms.git"]
parse_pdms_db = { path = "vendor/aios-parse-pdms" }

[patch."https://github.com/happyrust/pdms-io.git"]
pdms_io = { path = "../pdms-io" }

# occt-rs 也有本地克隆（vendor/occt-rs，正在 1c44c6e，与上面钉的 rev 一致），
# 但 opencascade 挂在可选的 occ feature 上，默认构建走不到它，所以先不接。
# 要接就取消下面三行注释——注意被 patch 的是 github 源，gitee → github 那层
# 重定向由上面那个 [patch] 段负责，两段叠加生效。
#
# [patch."https://github.com/happyrust/occt-rs.git"]
# opencascade = { path = "vendor/occt-rs/crates/opencascade" }
# opencascade-sys = { path = "vendor/occt-rs/crates/opencascade-sys" }
# kicad-parser = { path = "vendor/occt-rs/crates/kicad-parser" }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }


[dependencies.sqlx]
version = "0.7.2"
default-features = false
optional = true
features = [
    "runtime-async-std-rustls",
    #    "runtime-async-std-native-tls",
    "macros",
    "mysql",
    # "tls",
    "chrono",
    "json",
    # "decimal",
    "bigdecimal",
    "uuid",
    "time",
]


#[profile.release]
#lto = true
#strip = true
#opt-level = 3
#panic = 'abort'
#codegen-units = 1

# parse_pdms_db / pdms_io 的本地重定向已上移到文件中部的 [patch] 段，并改成了
# github 源——这两个依赖 0f5aabd5 起就不再从 gitee 拉，原先留在这里的 gitee
# 段即使取消注释也不会命中任何东西。

# [patch."https://gitee.com/happydpc/surrealdb.git"]
# surrealdb = { path = "../surrealdb/crates/sdk" }
