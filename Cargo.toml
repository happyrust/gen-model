[package]
name = "aios-database"
version = "0.1.3"
edition = "2024"

[lib]
name = "aios_database"
path = "src/lib.rs"

[[bin]]
name = "web_ui"
path = "src/bin/web_ui.rs"
required-features = ["web_ui"]


[features]
default = ["ws", "gen_model", "manifold", "occ", "project_hd", "sqlite-index"]
gui = ["dep:gpui-component", "dep:gpui", "dep:story"]
console = ["ws", "gen_model", "manifold", "occ", "project_hd", "mqtt"]
grpc = ["dep:tonic", "dep:prost", "dep:tonic-reflection", "dep:tokio-util", "dep:jsonwebtoken", "dep:rstar"]  #GRPC服务功能
truck = []
local = []
ws = []
debug_obj_export = []
debug_model = []
debug_model_no_obj = ["aios_core/debug_wire", "aios_core/debug_expr"]
debug_expr = ["aios_core/debug_expr"]
mqtt = []
viewer = []                                                           #是否开启视图
gen_model = ["aios_core/gen_model"]
occ = ["aios_core/occ", "dep:opencascade"]
manifold = ["aios_core/manifold"]
sql = ["dep:sea-orm", "dep:sqlx"]
debug_parse = ["pdms_io/debug_parse"]
surreal_v2 = []
project_hd = []
project_hh = []
profile = []                                                          #性能分析，包含tracing功能
web_ui = ["dep:axum", "dep:tower-http", "dep:sysinfo"]              #Web UI功能
sqlite-index = ["dep:rusqlite"]

[dependencies]
config = "0.14.1"
bincode = "1.3.3"
anyhow = "1.0.57"
serde_json = "1.0.81"
hex = "0.4.3"
once_cell = "1.12.0"
futures = "^0.3"
smol_str = "0.3.2"
itertools = "0.14.0"
lazy_static = "1.4.0"
approx = "0.5.1"
#flate2 = "1.0.23"
log = "0.4.17"

memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.1"
regex = "1.5.6"
calamine = { git = "https://gitee.com/happydpc/calamine.git" }
#sled = "0.34.7"
derive_more = { version = "1.0.0", features = ["deref", "deref_mut"] }
bitflags = "2.4.0"
bitvec = "1.0.0"
chrono = "0.4.22"
nalgebra = { git = "https://gitee.com/happydpc/nalgebra.git", features = [
    "serde",
    "rkyv",
    "glam029",
    "convert-glam029",
] }
parry3d = { git = "https://gitee.com/happydpc/parry.git", package = "parry3d", features = [
    "serde-serialize",
    "rkyv",
] }
parry2d = { git = "https://gitee.com/happydpc/parry.git", package = "parry2d" }
parse_pdms_db = { git = "https://gitee.com/happydpc/aios-parse-pdms.git" }
aios_core = { git = "https://gitee.com/happydpc/rs-core.git", default-features = false }
bevy_transform = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_transform" }
bevy_reflect = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_reflect" }
pdms_io = { git = "https://gitee.com/happydpc/pdms-io.git" }
dpcsync = { git = "https://gitee.com/happydpc/dpc-sync.git" }

# XKT 格式生成相关依赖
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"
flate2 = "1.0"
byteorder = "1.5"
num_cpus = "1.16"
reqwest = { version = "0.12", features = ["json"] }

clap = { version = "4.3.5", features = ["derive"] }
dashmap = { version = "=7.0.0-rc2", features = ["serde", "rayon"] }
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.137", features = ["derive"] }
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.29.3", features = ["serde", "rkyv"] }
cached = "0.56.0"
rkyv = { version = "0.8.11", features = ["hashbrown-0_15"] }
rfd = { version = "0.15.4", features = ["async-std"] }
# redb = "3.0.1" # Removed - using SQLite for all storage

# 空间索引相关依赖
rstar = { version = "0.12", optional = true }

#造型功能，先在database测试
opencascade = { git = "https://gitee.com/happydpc/occt-rs.git", package = "opencascade", optional = true }
serde_with = { version = "3.9.0", features = ["macros"] }
rayon = "1.10.0"
indexmap = "2.2.6"
urlencoding = "2.1.3"
notify = "8.0.0"
walkdir = "2.5.0"
num_enum = "0.7.2"
jsonxf = "1.1.1"
sea-orm = { version = "1.1.1", features = [
    "sqlx-mysql",
    "runtime-async-std",
], optional = true }
surrealdb = { git = "https://gitee.com/happydpc/surrealdb.git", default-features = false, features = [
    "protocol-ws",
    #    "kv-rocksdb",
] }
async-once-cell = "0.5.3"
rumqttc = "0.24.0"
petgraph = { version = "0.8.2", features = ["serde-1"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["registry", "json"] }
tracing-chrome = "0.7.1"
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.27.1"
simplelog = "0.12.2"
downcast-rs = "1.2.0"
flume = "0.11.0"
rand = "0.9.0"
rust-embed = "8"

gpui = { git = "https://github.com/huacnlee/zed.git", branch = "webview", optional = true }
story = { git = "https://gitee.com/happydpc/gpui-compoents", optional = true }
gpui-component = { git = "https://gitee.com/happydpc/gpui-compoents", optional = true }
toml = "0.9.5"
pollster = "0.4.0"
async-std = "1.13.1"

# GRPC 相关依赖
tonic = { version = "0.12", optional = true, features = ["tls", "tls-roots"] }
prost = { version = "0.13", optional = true }
tonic-reflection = { version = "0.12", optional = true }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "1.0"
jsonwebtoken = { version = "9.0", optional = true }
async-trait = "0.1"
env_logger = "0.11"

# Web UI 相关依赖
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["fs"], optional = true }
sysinfo = { version = "0.30", optional = true }

# SQLite driver for spatial tests and cache
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
tonic-build = "0.12"
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"


[dependencies.sqlx]
version = "0.8.6"
default-features = false
optional = true
features = [
    "runtime-tokio-rustls",
    #    "runtime-async-std-native-tls",
    "macros",
    "mysql",
    # "tls",
    "chrono",
    "json",
    # "decimal",
    "bigdecimal",
    "uuid",
    "time",
]


#[profile.release]
#lto = true
#strip = true
#opt-level = 3
#panic = 'abort'
#codegen-units = 1

[patch."https://gitee.com/happydpc/rs-core.git"]
aios_core = { path = "../new-crates/aios-core" }
#
#[patch."https://gitee.com/happydpc/aios-parse-pdms.git"]
#parse_pdms_db = { path = "../aios-parse-pdms" }
#
#[patch."https://gitee.com/happydpc/pdms-io.git"]
#pdms_io = { path = "../pdms-io" }
#
#
#[patch."https://gitee.com/happydpc/surrealdb.git"]
#surrealdb = { path = "../surrealdb/crates/sdk" }

# Examples
[[example]]
name = "spatial_query_server"
required-features = ["grpc"]

[[example]]
name = "spatial_query_client"
required-features = ["grpc"]

[[example]]
name = "spatial_index_builder"
required-features = ["grpc"]

