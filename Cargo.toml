[package]
name = "aios-database"
version = "0.1.31"
edition = "2024"
description = "AVEVA E3D incremental parsing and geometry service"
build = "build.rs"

# Python 调试绑定（python/aios-py）与主 crate 同一个 workspace：
# [patch] 段作用于全图（vendor 本地重定向对绑定同样生效），共享 Cargo.lock 与
# target/（OCC 只编一次）。default-members 钉在根 package，日常 cargo build/test
# 行为不变；绑定构建走 python/ 目录的 maturin（docs/plans/2026-08-11-python-binding-api-plan.md）。
[workspace]
members = [".", "python", "tools/aios-patch"]
default-members = ["."]
resolver = "3"

[lib]
name = "aios_database"
path = "src/lib.rs"


[features]
default = ["ws", "gen_model", "manifold", "project_hd", "http_api"]
console = ["ws", "gen_model", "manifold", "project_hd", "mqtt"]
local = []
ws = []
debug_obj_export = []
debug_model = []
debug_model_no_obj = ["aios_core/debug_wire", "aios_core/debug_expr"]
debug_expr = ["aios_core/debug_expr"]
mqtt = []
viewer = []                                                           #是否开启视图
gen_model = ["aios_core/gen_model"]
manifold = ["dep:manifold-csg"]
# `sql`（MySQL 落库路）2026-09-07 整条退役：它从来没被任何默认集 / CI / 脚本打开过，
# 而门后的代码早已编不过（`AiosDBMgr::get_global_pool` / `get_project_pools` 不在 aios_core 里）。
# 持久层只有 SurrealDB 一个（宪法 I）。`sqlx` 依赖随之删除。
# old-pdms-io 已整体退出本仓（2026-09-04；此前 2026-09-03 先降为 `legacy_pdms_io` 门后的对拍参照臂，
# `docs/plans/2026-09-03-old-pdms-io-retirement-inventory.md` §0）。数据面的解析走 e3d-io
# （`data_interface::e3d_collector` / `db_file_header` / `frozen_source`），模型面走 e3d-model。
# 对拍不再拿 old-pdms-io 当参照：判据是 E3D TTY 录下来的会话链 / 宏（`tests/db8000_session_pairs`
# 夹具、`scripts/e3d/Test-TtyNetWindow.ps1`、`scripts/e3d/verify_db8000_bran_window.ps1`）。
# `pdms_io` 不许再出现在任何 manifest / 源码里——`scripts/Check-LegacyPdmsIo.ps1` +
# `data_interface::mod.rs::legacy_pdms_io_guard` 两道护栏钉死。
# 只有 OCC/gen_model 的可运行入口受 `legacy_model` 控制。`legacy_model_gen` 2026-09-14
# 随 `direct_model.source` 谓词一起退役——它是 `source='legacy'` 的唯一写入点，删掉之后
# 全库只剩 e3d-model 一个模型来源，那道「哪些行是我的」的篱笆不再需要。
legacy_model = []
# Historical developer probes are deliberately not unlocked by `legacy_model`;
# they additionally require this feature.
legacy_diagnostics = []
# old-parse-pdms-db（`parse_pdms_db`）已整体退出本仓（2026-09-04，第二张退役清单
# `docs/plans/2026-09-04-parse-pdms-db-retirement-inventory.md` 的 B9；B1–B7 先把生产路径搬走：
# 文件头走 `db_file_header::DbBasicInfo`、元素记录是本仓 `data_interface::ele_data::EleData`、
# noun 字典快照在 `noun_dict`、抽取树 / MDB 声明走 e3d-io 索引，B8 又把基线全量解析收敛成
# e3d-io 退化窗口 `e3d_collector::stream_baseline` + `versioned_db::baseline`）。
# 依赖、`[patch]`、`legacy_parse_pdms_db` feature、8 个取证探针 bin 与 2 个门后测试一起删——
# 共识 d-6 定了「不拿第二套解析器当参照臂」，那批探针存在的唯一理由也就没有了。
# `parse_pdms_db` 不许再出现在任何 manifest / 源码里——`scripts/Check-LegacyParsePdmsDb.ps1` +
# `data_interface::mod.rs::legacy_parse_pdms_db_guard` 两道护栏钉死。
surreal_v2 = []
project_hd = []
project_hh = []
profile = []                                                          #性能分析，包含tracing功能
#前端Web服务(REST+WebSocket)。jsonwebtoken / base64 / uuid 是三维校审域（`web_service::review`，
# docs/plans/2026-09-12-review-backend-port-plan.md §5 T1）的 JWT 签发校验与表单/附件 id 生成所需，
# 只跟着 http_api 走，不进核心库。
http_api = [
    "dep:axum",
    "dep:tower-http",
    "dep:toml_edit",
    "dep:jsonwebtoken",
    "dep:base64",
    "dep:uuid",
]
rvm_verify = ["dep:rvm-rs"]                                           #RVM 基准对拍（rvm_verify 探针）

[[bin]]
name = "rvm_verify"
path = "src/bin/rvm_verify.rs"
required-features = ["rvm_verify"]

[[bin]]
name = "rvm_generated_obj_compare"
path = "src/bin/rvm_generated_obj_compare.rs"
required-features = ["rvm_verify"]

[[bin]]
name = "performance_test"
path = "src/bin/performance_test.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[bin]]
name = "test_gen_geos_data"
path = "src/bin/test_gen_geos_data.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[example]]
name = "performance_test_example"
path = "examples/performance_test_example.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[example]]
name = "stage_analysis_example"
path = "examples/stage_analysis_example.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[example]]
name = "test_gen_geos_data_example"
path = "examples/test_gen_geos_data_example.rs"
required-features = ["legacy_model", "legacy_diagnostics"]

[[test]]
name = "db8000_two_delete_fixture"
path = "tests/db8000_two_delete_fixture.rs"

[[test]]
name = "db8000_session_pairs"
path = "tests/db8000_session_pairs.rs"

[dependencies]
config = "0.14.1"
bincode = "1.3.3"
# RVM 基准对拍：解析 AVEVA E3D 导出的 RVM/ATT（仅 rvm_verify feature 用）
rvm-rs = { git = "https://github.com/happyrust/rvm-rs", optional = true }
anyhow = "1.0.57"
e3d-model = { path = "../vendor/e3d-model" }
serde_json = { version = "1.0.81", features = ["float_roundtrip"] }
hex = "0.4.3"
sha2 = "0.10.9"
tempfile = "3.27.0"
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }
once_cell = "1.12.0"
futures = "^0.3"
smol_str = "0.3.2"
itertools = "0.14.0"
lazy_static = "1.4.0"
approx = "0.5.1"
#flate2 = "1.0.23"
log = "0.4.17"

memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.1"
regex = "1.5.6"
calamine = { git = "https://gitee.com/happydpc/calamine.git" }
#sled = "0.34.7"
derive_more = { version = "1.0.0", features = ["deref", "deref_mut"] }
bitflags = "2.4.0"
bitvec = "1.0.0"
chrono = "0.4.22"
nalgebra = { git = "https://gitee.com/happydpc/nalgebra.git", features = [
    "serde",
    "rkyv",
    "glam029",
    "convert-glam029",
] }
parry3d = { git = "https://gitee.com/happydpc/parry.git", package = "parry3d", features = [
    "serde-serialize",
    "rkyv",
] }
parry2d = { git = "https://gitee.com/happydpc/parry.git", package = "parry2d" }
aios_core = { git = "https://github.com/happyrust/old-aios-core.git", rev = "4a7a00f93f3afa4069922ea52fab174cbbbddcde", default-features = false }
bevy_transform = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_transform" }
bevy_reflect = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_reflect" }
# old-pdms-io（`pdms_io`）不再是依赖——连 optional 都不是。`cargo tree --workspace -i pdms_io`
# 必须匹配不到任何包（`scripts/Check-LegacyPdmsIo.ps1`）。
# 库文件分发（`data_interface::file_sync`，自 old-pdms-io `sync` 搬入）：`.cba` 归档与远端按块 clone。
dpcsync = { git = "https://gitee.com/happydpc/dpc-sync", rev = "d7ce7fd848a138e5fc3ebd88ef55da00ee0ac780" }
blake2 = "0.10.6"
reqwest = { version = "0.11.22", default-features = false, features = ["json", "rustls-tls"] }
url = "2.4.1"
futures-util = "0.3"
# ADR-053 direct 模式的取数底座（t-354）。**路径依赖，不是 git+rev**：两个仓都还在
# `old/vendor/` 下当场演进，没有可钉的上游。稳定后按 pdms_io 的样子换成 git+rev。
# e3d-io 自己 path 依赖 ../e3d-attlib，两者必须并排放在 old/vendor/ 下。
# e3d-attlib 这里也直列一份：direct 转换器要用它的 base-27 反哈希把词属性还原成
# WordType 字符串（ADR-053 P0 残差分类第 1 条），那是转换语义的一部分，不是传递依赖。
e3d-io = { path = "../vendor/e3d-io" }
e3d-attlib = { path = "../vendor/e3d-attlib" }
# MBD 管道尺寸标注求解器（`.planning/2026-09-06-plant-mbd-pipe-dimension` D1/D4）：纯库，不读库不 HTTP，
# 与 e3d-model 同款 path 依赖并排放在 old/vendor/ 下。本仓 `src/mbd/` 把 e3d-model 的 Route 读成
# 它要的 BranchQueryResult，`web_service` 挂 `GET /api/mbd/v2/pipe/{refno}`。
plant-mbd = { path = "../vendor/plant-mbd/crates/plant-mbd" }

clap = { version = "4.3.5", features = ["derive"] }
dashmap = { version = "=7.0.0-rc2", features = ["serde", "rayon"] }
tokio = { version = "1.37.0", features = ["full", "test-util"] }
serde = { version = "1.0.137", features = ["derive"] }
sysinfo = "0.33.1"
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.29.3", features = ["serde", "rkyv"] }
cached = "0.55.1"
rkyv = { version = "0.7.45", features = ["hashbrown"] }


# 扫掠体截面：与 aios-core `wire::gen_polyline_original` 同一个 Polyline 类型（同一 fork），
# 倒角与弧段只有那一份权威实现，这里只做 bulge → 折线的离散。
cavalier_contours = { git = "https://gitee.com/happydpc/cavalier_contours" }
# 扫掠体端面：结构截面是凹的（L/C/I），端盖需要带孔的多边形三角剖分。
earcutr = "0.4.3"

# ADR-029：设计布尔走本地 manifold-csg（不经 aios-core 的旧 manifold-sys）。
manifold-csg = { git = "https://github.com/zmerlynn/manifold-csg", rev = "2233c5a1162eba981e3f43efcd39a6bc25581335", optional = true }
serde_with = { version = "3.9.0", features = ["macros"] }
rayon = "1.10.0"
# 几何并发闸默认额度 = 物理核数（specs/023 / ADR-041 第 3 条）；
# std::thread::available_parallelism 给的是逻辑核数，物理核数只有它能拿到。
num_cpus = "1.16"
indexmap = "2.2.6"
urlencoding = "2.1.3"
notify = "8.0.0"
walkdir = "2.5.0"
num_enum = "0.7.2"
jsonxf = "1.1.1"
#sea-orm = { version = "1.1.1", features = [
#    "sqlx-mysql",
#    "runtime-async-std",
#], optional = true }
surrealdb = { git = "https://gitee.com/happydpc/surrealdb.git", default-features = false, features = [
    "protocol-ws",
    # ADR-017 暂存介质：进程内嵌入式 mem 引擎（Surreal<Any> 指向 mem://）。
    # 写回目标仍是 ws 连的 fork 服务器，本仓不开 kv-rocksdb。
    "kv-mem",
    #    "kv-rocksdb",
] }
async-once-cell = "0.5.3"
rumqttc = "0.24.0"
petgraph = { version = "0.8.1", features = ["serde-1"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["registry", "json"] }
tracing-chrome = "0.7.1"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.1"
simplelog = "0.12.2"
downcast-rs = "1.2.0"
flume = "0.11.0"
rand = "0.9.0"

toml = "0.8.19"
pollster = "0.4.0"
async-std = "1.13.1"
# `multipart`：校审附件上传 `POST /api/review/attachments`（旧端 50MB 上限，路由单独放宽 body 限制；
# docs/plans/2026-09-12-review-backend-port-plan.md §1.4 第 3 条）。
axum = { version = "0.8.9", features = ["ws", "multipart"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }
# 三维校审域依赖（同上 plan §5 T1；版本与旧端 plant-model-gen 对齐，Cargo.lock 里已有同版传递依赖，不引入新包）：
# jsonwebtoken —— `[review_auth]` / `[platform_auth]` JWT 签发与校验；
# base64 —— JWT debug 直通与 URL-safe 编解码；uuid —— form_id / 附件 stored_name 生成。
jsonwebtoken = { version = "9.0", optional = true }
base64 = { version = "0.22", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
# 配置向导（/api/v1/setup）的写盘口：外科手术式改键，注释与未知键原样保留
# （docs/plans/2026-09-09-setup-wizard-web-frontend.md Q12）。普通 `toml` 做不到——
# 它 round-trip 会丢注释，而 DbOption.toml 的注释是决策史。
toml_edit = { version = "0.22", optional = true }
rmcp = { version = "=3.1.1", features = ["server", "transport-io"] }

# ── 自研 crate 的本地重定向（默认关闭）────────────────────────────────────
#
# 用 `scripts/Toggle-LocalDeps.ps1 -On` 打开、`-Off` 关掉，别手改标记之间的内容。
# 打开后上面 [dependencies] 里的 git+rev 仍是权威来源声明，只是被重定向到本地
# 工作副本：改一行 Rust 就能直接编，不必再走「提交 → push → 升 rev」三步。
#
# 为什么用 [patch] 而不是把 [dependencies] 改成 path：path 只改本仓这一条边。图里
# 别的 crate 若也 git 依赖 aios_core，依赖图里就会同时出现两份，而 aios_core 的类型
# 摆在各家 API 面上，跨边界必然类型不匹配。patch 作用于整张图，所有人一起收敛到同一份。
#
# 前提：下面这个 vendor 目录必须存在，且停在与上面 rev 对应的提交上。
#
#   ../vendor/old-aios-core      codex/libgm-snout-caliber = 4a7a00f9
#
# old-pdms-io 与 old-parse-pdms-db 的那两条分别在 2026-09-04 随 `pdms_io` / `parse_pdms_db`
# 依赖一起摘掉了（不再是任何 crate 的依赖，留着 patch 只会得到 cargo 的
# "patch was not used" 警告）。
#
# 同名克隆有好几份，别接错：plant-code/rs-core 在 codex/fix-refno-enum-cata-hash 上
# （rkyv 0.8 那条线），不是这里要的。
#
# 打开状态下 Cargo.lock 里这个包的 `source` 行会消失，所以**不能带着它推 main**。
# pre-push 守卫（.githooks/pre-push）会挡住，不必靠记性。
#
# LOCAL-DEPS PATCH BEGIN
[patch."https://github.com/happyrust/old-aios-core.git"]
aios_core = { path = "../vendor/old-aios-core" }
# LOCAL-DEPS PATCH END
#
# 曾经还有第四路：parse_pdms_db → pdmsdb_engine_v2（git = pdms-io.git）。它是
# old-pdms-io 那个仓留在依赖图里的最后一条尾巴，2026-09-04 随 parse_pdms_db 一起断了，
# 手动 patch 那两行注释也一并删除——图里没有这个包，patch 无处可打。

# 配置向导第③步问「这个端口有人占着吗」，判据必须与 Start-AMS.ps1 的
# GetActiveTcpListeners() 一致：查监听表，不靠绑定试探。通配监听不设
# SO_EXCLUSIVEADDRUSE，别人持着 0.0.0.0:P 时再绑 127.0.0.1:P 在 Windows 上照样成功，
# 拿绑定当判据就会把占着的端口报成可用（web_service/setup.rs::listening_ports）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
# 校审域 handler 级单测用 `tower::ServiceExt::oneshot` 直接打 Router（旧端 82 个单测同一写法，
# docs/plans/2026-09-12-review-backend-port-plan.md §6 A7）；tower 本就是 axum 的传递依赖，这里只是显式化。
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
winresource = "0.1.31"


#[profile.release]
#lto = true
#strip = true
#opt-level = 3
#panic = 'abort'
#codegen-units = 1

# 自研 crate 的本地重定向见文件中部的 LOCAL-DEPS PATCH 段。

# [patch."https://gitee.com/happydpc/surrealdb.git"]
# surrealdb = { path = "../surrealdb/crates/sdk" }
