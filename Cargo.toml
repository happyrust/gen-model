[package]
name = "aios-database"
version = "0.1.0"
edition = "2021"

[features]
default = []
truck = []
viewer = []  #是否开启视图

[dependencies]
config = "0.13.1"
bincode = "1.3.3"
anyhow = "1.0.57"
serde_json = "1.0.81"
hex = "0.4.3"
once_cell = "1.12.0"
futures = "0.3.21"
smol_str = "0.2.0"
itertools = "0.10.3"
lazy_static = "1.4.0"
async-trait = "0.1.52"
dotenv = "0.15.0"
approx = "0.5.1"
#flate2 = "1.0.23"
log = "0.4.17"
env_logger = "0.9.0"

memchr = "2.5.0"
nom = "7.1.1"
nom-derive = "0.10.1"
regex = "1.5.6"
calamine = "0.19.1"
sled = "0.34.7"
derive_more = "0.99.17"
bitflags = "1.3.2"
bitvec = "1.0.0"
chrono = "0.4.22"
#geo = { path = "../crates/geo/geo" }
nalgebra = { path="../crates/nalgebra", features = ["serde", "rkyv", "glam023"] }
parry3d = { path="../crates/parry/crates/parry3d", features = ["serde-serialize", "rkyv"] }

parse_pdms_db = { path = "../aios-parse-pdms" }
aios_core = { path = "../crates/aios-core" }
#bevy = { path = "../crates/bevy", default-features = false }
bevy_transform = { path = "../crates/bevy/crates/bevy_transform"}

#csg = { path = "../crates/csgrs/csg" }
arangors_lite = { path = "../crates/arangors-lite"}
#heed = {path = "../crates/heed/heed"}
bb8-arangodb = { path = "../crates/bb8-arangodb" }
bb8 = "0.8.1"

tobj = { path = "../crates/tobj", features = ["merging"]}

clap = { version = "4.3.5", features = ["derive"] }
dashmap = { version = "5.4.0", features = ["serde"] }
tokio = { vertion = "1.18.2", features = ["full"] }
serde = { version = "1.0.137", features = ["derive"] }
id_tree = { version = "1.8.0", features = ["serde_support"] }
glam = { version = "0.24.0", features = ["rkyv"] }
cached = "0.43.0"
rkyv = "0.7.42"


#造型功能，先在database测试
#opencascade = { path = "../dslcad/crates/opencascade", optional = true }
serde_with = "3.0.0"
tokio-stream = "0.1.14"
rayon = "1.7.0"
redb = "0.22.0"
#geo = "0.24.1"

#mcut-sys = { path = "../crates/mcut-sys"}
# manifold-sys = { path = "../crates/manifold-sys"}
kigumi-sys= { path = "../crates/kigumi-sys"}


[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[dependencies.sqlx]
version = "0.6.3"
default-features = false
features = [
#    "runtime-async-std-rustls",
    "runtime-async-std-native-tls",
    "macros",
    "mysql",
    "tls",
    "chrono",
    "json",
    "decimal",
    "bigdecimal",
    "uuid",
    "time",
]

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 3
