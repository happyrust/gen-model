<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKT v10 立方体测试查看器</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .viewer-container {
            width: 100%;
            height: 600px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #222;
            position: relative;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        .control-button {
            margin: 5px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-button:hover {
            background-color: #0056b3;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        .info {
            color: blue;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "@xeokit/xeokit-sdk": "./js/xeokit/xeokit-sdk.es.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XKT v10 立方体测试查看器</h1>
            <p>测试我们生成的符合XKT v10标准规范的立方体文件</p>
        </div>

        <div class="viewer-container" id="viewer-container">
            <canvas id="viewer" style="width: 100%; height: 100%;"></canvas>
        </div>

        <div class="controls">
            <button class="control-button" onclick="loadCube()">加载标准立方体</button>
            <button class="control-button" onclick="loadLargeCube()">加载大立方体</button>
            <button class="control-button" onclick="loadExistingXKT()">加载现有XKT文件</button>
            <button class="control-button" onclick="resetView()">重置视图</button>
            <button class="control-button" onclick="toggleWireframe()">切换线框</button>
        </div>

        <div class="status" id="status">
            <h3>状态信息</h3>
            <p>准备加载XKT文件...</p>
        </div>
    </div>

    <script type="module">
        import {Viewer, XKTLoaderPlugin} from "@xeokit/xeokit-sdk";

        let viewer;
        let xktLoader;
        let currentModel = null;

        // 初始化查看器
        function initViewer() {
            try {
                viewer = new Viewer({
                    canvasId: "viewer",
                    transparent: true
                });

                xktLoader = new XKTLoaderPlugin(viewer, {
                    objectDefaults: {
                        IfcSpace: {
                            pickable: false,
                            opacity: 0.2
                        }
                    }
                });

                // 设置相机位置
                viewer.scene.camera.eye = [5, 5, 5];
                viewer.scene.camera.look = [0, 0, 0];
                viewer.scene.camera.up = [0, 1, 0];

                updateStatus("✅ xeokit查看器初始化成功", "success");

                // 设置光照
                viewer.scene.lightsOn = true;
                viewer.scene.ambientLightColor = [0.3, 0.3, 0.3];
                viewer.scene.dirLightColor = [0.8, 0.8, 0.8];
                viewer.scene.dirLightDir = [-0.5, -0.5, -0.5];

            } catch (error) {
                updateStatus(`❌ 查看器初始化失败: ${error.message}`, "error");
                console.error("Viewer initialization error:", error);
            }
        }

        // 加载标准立方体
        window.loadCube = async function() {
            await loadXKTFile("output/cube_v10_standard.xkt", "standard_cube");
        }

        // 加载大立方体
        window.loadLargeCube = async function() {
            await loadXKTFile("output/cube_v10_large.xkt", "large_cube");
        }

        // 加载原有的XKT文件（作为对比）
        window.loadExistingXKT = async function() {
            await loadXKTFile("output/db1112_real.xkt", "existing_model");
        }

        // 加载XKT文件
        async function loadXKTFile(url, modelId) {
            try {
                updateStatus(`⏳ 正在加载 ${url}...`, "info");

                // 卸载当前模型
                if (currentModel) {
                    currentModel.destroy();
                    currentModel = null;
                }

                // 加载新模型
                currentModel = xktLoader.load({
                    id: modelId,
                    src: url,
                    edges: true // 启用边缘渲染
                });

                currentModel.on("loaded", () => {
                    updateStatus(`✅ 成功加载 ${url}`, "success");

                    // 显示模型信息
                    const scene = viewer.scene;
                    const aabb = scene.aabb;
                    const info = `
                        <strong>模型信息:</strong><br>
                        • 模型ID: ${modelId}<br>
                        • 文件: ${url}<br>
                        • 包围盒: [${aabb[0].toFixed(2)}, ${aabb[1].toFixed(2)}, ${aabb[2].toFixed(2)}] - [${aabb[3].toFixed(2)}, ${aabb[4].toFixed(2)}, ${aabb[5].toFixed(2)}]<br>
                        • 实体数量: ${Object.keys(scene.objects).length}<br>
                        • 加载时间: ${Date.now() - loadStartTime}ms
                    `;
                    updateStatus(info, "success");

                    // 适配视图
                    viewer.cameraFlight.flyTo(currentModel);
                });

                currentModel.on("error", (error) => {
                    updateStatus(`❌ 加载失败: ${error}`, "error");
                    console.error("XKT load error:", error);
                });

                const loadStartTime = Date.now();

            } catch (error) {
                updateStatus(`❌ 加载错误: ${error.message}`, "error");
                console.error("Load error:", error);
            }
        }

        // 重置视图
        window.resetView = function() {
            if (currentModel) {
                viewer.cameraFlight.flyTo(currentModel);
                updateStatus("🔄 视图已重置", "info");
            }
        }

        // 切换线框模式
        window.toggleWireframe = function() {
            if (currentModel) {
                const isWireframe = viewer.scene.edges;
                viewer.scene.edges = !isWireframe;
                updateStatus(`🔧 线框模式: ${!isWireframe ? '开启' : '关闭'}`, "info");
            }
        }

        // 更新状态信息
        function updateStatus(message, type = "info") {
            const statusDiv = document.getElementById("status");
            const className = type;
            statusDiv.innerHTML = `<h3>状态信息</h3><p class="${className}">${message}</p>`;
        }

        // 初始化
        window.addEventListener('load', () => {
            initViewer();
        });
    </script>

</body>
</html>
