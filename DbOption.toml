#【新增 2026-08-10】startup_autorun
# 启动即自动干活；默认 true = 重扫发现后立即消费。
#   false：启动重扫照常发现并入队（队列是准的、看得见停机期间攒了多少活），
#          但排出来的行「挂起」（/queue 上状态是 held）不派发，持久积压也不消化，
#          启动全量房间重建不跑。某个 dbnum 真的来了增量（在 E3D 里存一次盘，
#          或 POST /api/v1/update/execute）才放行它那一条，并把积压与新会话
#          合并成一条一起跑。别的库继续挂着。
#   true ：历史行为——起来就消费队列，并在库侧凭据对不上时做一次全量房间重建。
# 环境变量 AIOS_STARTUP_AUTORUN 压过本键（认 1/true/yes/on 与 0/false/no/off），
# 用于「这一次想让它自己跑」而不改文件。
# 注意 POST /api/v1/queue/resume 解的是持久化暂停，不是这里的挂起，两者正交。
# 另有 AIOS_SKIP_STARTUP_ROOM_BUILD：无论本键取值都不做启动全量房间重建，
# 给「要增量、不要 2 万面板重算」的场景（L3 夹具就用它）。
startup_autorun = true

#【新增 2026-08-10，默认值 2026-08-12 改为 true】room_incremental
# 房间归属的「增量」重算；默认 true = 照排照收。
#   true ：位姿/删除刷新包围盒之后排 room_recalc 目标（直写事务与暂存窗口收口
#          两个写入点），空闲轮收房间轮。
#   false：两个写入点都不排，空闲轮也不收。已经排在 model_update_pending 里的
#          目标原样留着，开关一开照常收——关掉不等于把那些活丢了。
# 管的只有增量这一条链：启动全量重建、人工重建、以及 drain_rooms 直调（房间对拍
# 夹具走的就是它）都不看本键。
# 环境变量 AIOS_ROOM_INCREMENTAL 压过本键（取值规则同 AIOS_STARTUP_AUTORUN），
# 想单独排查模型增量时用 AIOS_ROOM_INCREMENTAL=0 临时关一次，不必改文件。
# 2026-08-10 默认取假的理由是现场压着 2580 个查不到几何的房间目标，每页 256 个
# 付两次全量查询、约 88 秒，把模型侧真正的失败埋进日志。那批目标已经收干净，
# 而关着的代价更贵：房间归属只在删除时还会被清，搬家后的重算全靠启动全量重建
# 回补，而那条兜底路径排在 startup_autorun 之后——默认部署里等于没有回补通道。
room_incremental = true

#【新增 2026-08-13】net_window_collection
# 增量窗口收集口径（ADR-022 灰度开关）；默认 false。
#   false：现状——逐会话回放（collect_changes），成本 O(会话数×每会话触达×3 次解析)。
#   true ：净窗口——会话索引差分给出净三态，再按窗口两端记录版本合成同形状操作流：
#          每 refno 恰一条，加了又删不出现（不再留墓碑行）、改了又改回不触发 regen、
#          删了又建判净修改。收集耗时与窗口内会话数解耦（实测 ams8000 全窗口 1.2s
#          vs 回放 11s，负载逐字符对拍一致，见 docs/evidence/2026-08-13-session-
#          index-diff-net-changes.md）。预览与执行经 collect_window 唯一入口同口径，
#          回执首条警告自报口径。
# 环境变量 AIOS_NET_WINDOW 压过本键（取值规则同 AIOS_STARTUP_AUTORUN）。
# 灰度期证据未收口前保持 false；夹具 + live A/B 全绿后翻默认值（ADR-022 §4）。
# net_window_collection = false

#【移除 2026-08-13】watermark_realign（2026-08-12 引入的 off/check/rebaseline 档位）
