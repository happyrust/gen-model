<svg xmlns="http://www.w3.org/2000/svg" width="960" height="779" viewBox="0 0 960 779" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah8250DF" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#8250DF"/></marker></defs><rect x="0" y="0" width="960" height="779" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="778" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">图例：本文所有图共用的画法</text><text x="22" y="68.86" font-size="13.5" font-weight="700" fill="#0550AE">树上的元素</text><line x1="22" y1="78" x2="938" y2="78" stroke="#D0D7DE" stroke-width="1.2"/><rect x="22" y="90" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="30" y="96" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="35" y="108.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="71.19" y="109.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><text x="443" y="109.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26551</text><text x="470" y="109.5" font-size="12.5" fill="#424A53">最小交付单元：类型牌是蓝底。提资以它为单位决定发不发。</text><rect x="22" y="130" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="30" y="136" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="148.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="65.14" y="149.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-A1</text><text x="443" y="149.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26560</text><text x="470" y="149.5" font-size="12.5" fill="#424A53">有名构件：有真实名字的元素，实线框。名称口径给它出一行。</text><rect x="22" y="170" width="430" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="30" y="176" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="188.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ELBO</text><text x="71.19" y="189.5" font-size="12.5" fill="#6E7781">（无名）</text><text x="443" y="189.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26602</text><text x="470" y="189.5" font-size="12.5" fill="#424A53">没有名字的成员：虚线框。不出行，它的变化算到所属的有名构件上。</text><rect x="22" y="210" width="430" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="30" y="216" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="228.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="65.14" y="229.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781">/Copy-of-AIOS-SUITE-BOX-A1</text><rect x="256.98" y="215.25" width="56" height="19.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="263.98" y="228.78" font-size="10.5" font-weight="600" fill="#59636E">自动命名</text><text x="443" y="229.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26731</text><text x="470" y="219.5" font-size="12.5" fill="#424A53">自动命名的成员：名称以 /Copy-of- 或 /Copy-(数字)-of- 开头。和没有名字的一样</text><text x="470" y="239.5" font-size="12.5" fill="#424A53">对待。</text><rect x="22" y="260" width="430" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="30" y="266" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="278.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ZONE</text><text x="71.19" y="279.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-8000-Z</text><text x="443" y="279.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26540</text><text x="470" y="279.5" font-size="12.5" fill="#424A53">容器（SITE、ZONE、PIPE 等）：也是有名构件，但不属于任何交付单元。</text><text x="22" y="320.86" font-size="13.5" font-weight="700" fill="#0550AE">操作留下的痕迹（画在操作前、操作后的树上）</text><line x1="22" y1="330" x2="938" y2="330" stroke="#D0D7DE" stroke-width="1.2"/><rect x="22" y="342" width="430" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="30" y="348" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="360.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="65.14" y="361.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-A1</text><rect x="200.8" y="347" width="36" height="20" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="207.8" y="360.96" font-size="11" font-weight="600" fill="#A40E26">被删</text><text x="443" y="361.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26560</text><text x="470" y="361.5" font-size="12.5" fill="#424A53">红：这个参考号的元素被删掉了。</text><rect x="22" y="382" width="430" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><rect x="30" y="388" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="400.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="65.14" y="401.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-A1</text><rect x="200.8" y="387" width="36" height="20" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="207.8" y="400.96" font-size="11" font-weight="600" fill="#116329">新建</text><text x="443" y="401.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26716</text><text x="470" y="401.5" font-size="12.5" fill="#424A53">绿：新建出来的元素，参考号是新的。</text><rect x="22" y="422" width="430" height="30" rx="6" fill="#FFF8C5" stroke="#BF8700" stroke-width="1.6"/><rect x="30" y="428" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="440.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="65.14" y="441.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-A1</text><rect x="200.8" y="427" width="68.61" height="20" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="207.8" y="440.96" font-size="11" font-weight="600" fill="#7D4E00">改了 XLEN</text><text x="443" y="441.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26560</text><text x="470" y="441.5" font-size="12.5" fill="#424A53">黄：元素还在、参考号没变，属性或位置被改了。</text><path d="M40,482 L200,482" fill="none" stroke="#8250DF" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah8250DF)"/><text x="214" y="486.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#8250DF">=24384/26716</text><text x="470" y="476.5" font-size="12.5" fill="#424A53">紫色虚线和紫色参考号：前后被当作同一个东西，但参考号不同。有名字的</text><text x="470" y="496.5" font-size="12.5" fill="#424A53">按名称配对，记「换号」；没有名字的成员按顺序比，不单独出行，也不记换号。</text><text x="22" y="532.86" font-size="13.5" font-weight="700" fill="#0550AE">判定结果</text><line x1="22" y1="542" x2="938" y2="542" stroke="#D0D7DE" stroke-width="1.2"/><rect x="22" y="556.5" width="38" height="21" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="29" y="571.32" font-size="12" font-weight="600" fill="#116329">新增</text><rect x="66" y="556.5" width="38" height="21" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="73" y="571.32" font-size="12" font-weight="600" fill="#A40E26">删除</text><rect x="110" y="556.5" width="38" height="21" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="117" y="571.32" font-size="12" font-weight="600" fill="#7D4E00">修改</text><rect x="154" y="556.5" width="50" height="21" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="161" y="571.32" font-size="12" font-weight="600" fill="#424A53">未修改</text><text x="470" y="571.5" font-size="12.5" fill="#424A53">四个类别。每个有名构件一行，每行恰好一个类别。</text><rect x="22" y="592.5" width="169.18" height="21" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="29" y="607.32" font-size="12" font-weight="600" fill="#6639BA">换号 …/26560 → …/26716</text><rect x="197.18" y="592.5" width="62" height="21" rx="4" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/><text x="204.18" y="607.32" font-size="12" font-weight="600" fill="#0550AE">从未提资</text><text x="470" y="607.5" font-size="12.5" fill="#424A53">两个标注。和类别是两回事：换了参考号的构件可以是未修改，也可以是修改。</text><rect x="22" y="628.5" width="50" height="21" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="29" y="643.32" font-size="12" font-weight="600" fill="#6E7781">不出行</text><rect x="78" y="628.5" width="74" height="21" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="85" y="643.32" font-size="12" font-weight="600" fill="#6E7781">不在结果里</text><text x="470" y="643.5" font-size="12.5" fill="#424A53">名称口径不管的：没有真实名字的成员不出行；没有真实名字的单元整个不在结果里。</text><text x="22" y="682.86" font-size="13.5" font-weight="700" fill="#0550AE">流程图</text><line x1="22" y1="692" x2="938" y2="692" stroke="#D0D7DE" stroke-width="1.2"/><rect x="22" y="704" width="150" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="97" y="727" font-size="12.5" fill="#0A3069" text-anchor="middle">判断</text><rect x="190" y="704" width="110" height="37" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="245" y="727" font-size="12.5" fill="#1F2328" text-anchor="middle">做法</text><rect x="318" y="704" width="110" height="37" rx="6" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1.5"/><text x="373" y="727" font-size="12.5" fill="#424A53" text-anchor="middle">结论</text><text x="470" y="727" font-size="12.5" fill="#424A53">蓝色长圆是判断，白框是做法，带颜色的框是结论。</text><text x="940" y="768.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号都是示意</text></svg>
