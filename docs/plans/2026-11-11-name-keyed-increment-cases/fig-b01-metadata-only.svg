<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="496" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="495" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">B-01 只动了纯元数据</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">操作：设备 /AIOS-SUITE-EQ-A 上只有 CACHID 变了。CACHID 是 E3D 自己写的一个计数，设计人员没有改任何东西。</text><rect x="20" y="76" width="442" height="110" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="97.68" font-size="13" font-weight="700" fill="#1F2328">操作前（基准一侧）</text><rect x="498" y="76" width="442" height="110" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="510" y="97.68" font-size="13" font-weight="700" fill="#1F2328">操作后（目标一侧）</text><rect x="30" y="110" width="422" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="38" y="116" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="43" y="128.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="79.19" y="129.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><text x="443" y="129.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26551</text><rect x="50" y="146" width="402" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="58" y="152" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="63" y="164.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="93.14" y="165.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-A1</text><text x="443" y="165.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26560</text><line x1="40" y1="140" x2="40" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><line x1="40" y1="161" x2="50" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><rect x="508" y="110" width="422" height="30" rx="6" fill="#FFF8C5" stroke="#BF8700" stroke-width="1.6"/><rect x="516" y="116" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="521" y="128.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="557.19" y="129.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><rect x="678.55" y="115" width="108.89" height="20" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="685.55" y="128.96" font-size="11" font-weight="600" fill="#7D4E00">只有 CACHID 变了</text><text x="921" y="129.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26551</text><rect x="528" y="146" width="402" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="536" y="152" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="541" y="164.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="571.14" y="165.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-A1</text><text x="921" y="165.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26560</text><line x1="518" y1="140" x2="518" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><line x1="518" y1="161" x2="528" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><path d="M469,93 L491,93" fill="none" stroke="#57606A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="20" y="200" width="442" height="156" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="221.68" font-size="13" font-weight="700" fill="#1F2328">按参考号看（原来的办法）</text><rect x="30" y="237" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="35" y="249.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="70.19" y="250.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">=24384/26551</text><rect x="160.66" y="235.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="167.66" y="250.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="205.66" y="250.32" font-size="12" fill="#59636E">记录被重写了一次</text><text x="32" y="282.5" font-size="12.5" fill="#424A53">模型这一侧原来就会分辨：CACHID 不影响模型，不重新生成。但提资那一</text><text x="32" y="302.5" font-size="12.5" fill="#424A53">侧只看「单元里被写过没有」。</text><rect x="498" y="200" width="442" height="156" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="510" y="221.68" font-size="13" font-weight="700" fill="#0550AE">按名称看（名称口径）</text><rect x="508" y="237" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="513" y="249.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="548.19" y="250.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><rect x="666.15" y="235.75" width="48.5" height="20.5" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="673.15" y="250.14" font-size="11.5" font-weight="600" fill="#424A53">未修改</text><text x="722.65" y="250.32" font-size="12" fill="#59636E">CACHID 不算内容</text><line x1="506" y1="264" x2="932" y2="264" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="508" y="274" width="36" height="20" rx="4" fill="#424A53" stroke="#424A53" stroke-width="1"/><text x="515" y="287.96" font-size="11" font-weight="600" fill="#FFFFFF">单元</text><text x="551" y="288.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><rect x="668.96" y="273.75" width="48.5" height="20.5" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="675.96" y="288.14" font-size="11.5" font-weight="600" fill="#424A53">未修改</text><text x="510" y="320.5" font-size="12.5" fill="#0A3069">没有任何一行变成修改。对照（B-02）：只改 DESC 算实质，提资要读它，</text><text x="510" y="340.5" font-size="12.5" fill="#0A3069">判修改。</text><rect x="20" y="370" width="920" height="96" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="391.68" font-size="13" font-weight="700" fill="#1F2328">提资时</text><rect x="32" y="401.75" width="37" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="416.14" font-size="11.5" font-weight="600" fill="#59636E">原来</text><text x="108" y="416.5" font-size="12.5" fill="#1F2328">单元里最后一次改动的会话号变了，指纹对不上，重发；版本记录的状态还被标成了「已修改」。</text><rect x="32" y="431.75" width="60" height="20.5" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="39" y="446.14" font-size="11.5" font-weight="600" fill="#0969DA">名称口径</text><text x="108" y="446.5" font-size="12.5" fill="#1F2328">跳过。不再看版本记录的状态。</text><text x="940" y="485.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号为示意</text></svg>
