<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="500" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="499" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">换了号的单元：提资前后，两张记录怎么变</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">以 /AIOS-SUITE-BRAN-S 删后同名重建为例：旧参考号 …/26603 提资过，新参考号 …/26616 接替了它。内容不变是 A-02，内容有变是 A-05。</text><rect x="20" y="76" width="286" height="320" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="97.68" font-size="13" font-weight="700" fill="#1F2328">提资之前</text><rect x="326" y="76" width="308" height="320" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="338" y="97.68" font-size="13" font-weight="700" fill="#0550AE">判成什么类别，提资怎么办</text><rect x="654" y="76" width="286" height="320" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="666" y="97.68" font-size="13" font-weight="700" fill="#1F2328">提资之后</text><rect x="30" y="110" width="266" height="98" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="42" y="131.68" font-size="13" font-weight="700" fill="#1F2328">提资版本记录</text><rect x="222.29" y="117" width="63.71" height="20" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="229.29" y="130.96" font-size="11" font-weight="600" fill="#59636E">…/26603</text><text x="42" y="154.5" font-size="12.5" fill="#424A53">记在旧参考号 …/26603 上：位号</text><text x="42" y="174.5" font-size="12.5" fill="#424A53">/AIOS-SUITE-BRAN-S、版本号、上一次提</text><text x="42" y="194.5" font-size="12.5" fill="#424A53">资的基准。单元被删后，状态记为已删除。</text><rect x="30" y="218" width="266" height="98" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="42" y="239.68" font-size="13" font-weight="700" fill="#1F2328">待删除记录</text><rect x="222.29" y="225" width="63.71" height="20" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="229.29" y="238.96" font-size="11" font-weight="600" fill="#59636E">…/26603</text><text x="42" y="262.5" font-size="12.5" fill="#424A53">旧位号 /AIOS-SUITE-BRAN-S，原因「删</text><text x="42" y="282.5" font-size="12.5" fill="#424A53">除」。读待删除列表时，系统给它标上「已</text><text x="42" y="302.5" font-size="12.5" fill="#424A53">被接替」。</text><rect x="30" y="326" width="266" height="58" rx="7" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><text x="42" y="347.68" font-size="13" font-weight="700" fill="#1F2328">新参考号</text><rect x="222.29" y="333" width="63.71" height="20" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="229.29" y="346.96" font-size="11" font-weight="600" fill="#6639BA">…/26616</text><text x="42" y="370.5" font-size="12.5" fill="#424A53">还没有版本记录。</text><rect x="336" y="110" width="288" height="88" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="348" y="119.5" width="50" height="21" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="355" y="134.32" font-size="12" font-weight="600" fill="#424A53">未修改</text><rect x="404" y="119.5" width="38" height="21" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="411" y="134.32" font-size="12" font-weight="600" fill="#6639BA">换号</text><text x="348" y="160.5" font-size="12.5" fill="#1F2328">不提资。不为 …/26603 提删除：人工勾选的、</text><text x="348" y="180.5" font-size="12.5" fill="#1F2328">系统补的、改名带出的，三种来源都排除。</text><rect x="336" y="208" width="288" height="88" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="348" y="217.5" width="38" height="21" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="355" y="232.32" font-size="12" font-weight="600" fill="#7D4E00">修改</text><rect x="392" y="217.5" width="38" height="21" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="399" y="232.32" font-size="12" font-weight="600" fill="#6639BA">换号</text><text x="348" y="258.5" font-size="12.5" fill="#1F2328">按原位号提交修改，不是新增；版本号接着旧记</text><text x="348" y="278.5" font-size="12.5" fill="#1F2328">录往下走。同样不为 …/26603 提删除。</text><rect x="664" y="110" width="266" height="98" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="676" y="131.68" font-size="13" font-weight="700" fill="#1F2328">提资版本记录</text><rect x="856.29" y="117" width="63.71" height="20" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="863.29" y="130.96" font-size="11" font-weight="600" fill="#6639BA">…/26616</text><text x="676" y="154.5" font-size="12.5" fill="#424A53">落在新参考号 …/26616 上：位号沿用；</text><text x="676" y="174.5" font-size="12.5" fill="#424A53">「提资时的会话号」写成这一次的目标会话</text><text x="676" y="194.5" font-size="12.5" fill="#424A53">号。</text><rect x="664" y="218" width="266" height="58" rx="7" fill="#FFF5F4" stroke="#FF8182" stroke-width="1.3" stroke-dasharray="5 3"/><text x="676" y="239.68" font-size="13" font-weight="700" fill="#1F2328">旧参考号的两条记录</text><rect x="856.29" y="225" width="63.71" height="20" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="863.29" y="238.96" font-size="11" font-weight="600" fill="#A40E26">…/26603</text><text x="676" y="262.5" font-size="12.5" fill="#424A53">版本记录和待删除记录都删掉。</text><rect x="664" y="286" width="266" height="78" rx="7" fill="#FFFDF0" stroke="#D4A72C" stroke-width="1.3"/><text x="676" y="307.68" font-size="13" font-weight="700" fill="#1F2328">一次做完</text><text x="676" y="330.5" font-size="12.5" fill="#424A53">不能出现新旧两条都在、或者两条都不在的</text><text x="676" y="350.5" font-size="12.5" fill="#424A53">中间状态。</text><path d="M309,93 L323,93" fill="none" stroke="#57606A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah57606A)"/><path d="M637,93 L651,93" fill="none" stroke="#57606A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="20" y="410" width="920" height="60" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="5 4"/><text x="32" y="434.5" font-size="12.5" fill="#424A53">不在测试范围内：单元里没有名字的子件，在提资内容里用参考号当编码。单元换号之后，不管是被跳过还是重发，数据中台上用旧参考号编码的那些子件都留着，</text><text x="32" y="454.5" font-size="12.5" fill="#424A53">不清理。</text><text x="940" y="489.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号为示意</text></svg>
