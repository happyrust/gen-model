las,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="591.14" y="273.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BOX-MV2</text><text x="921" y="273.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=24384/26804</text><line x1="538" y1="248" x2="538" y2="269" stroke="#AFB8C1" stroke-width="1.2"/><line x1="538" y1="269" x2="548" y2="269" stroke="#AFB8C1" stroke-width="1.2"/><line x1="518" y1="140" x2="518" y2="233" stroke="#AFB8C1" stroke-width="1.2"/><line x1="518" y1="161" x2="528" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><line x1="518" y1="233" x2="528" y2="233" stroke="#AFB8C1" stroke-width="1.2"/><path d="M469,93 L491,93" fill="none" stroke="#57606A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="20" y="308" width="442" height="268" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="329.68" font-size="13" font-weight="700" fill="#1F2328">按参考号看（原来的办法）</text><rect x="30" y="345" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="35" y="357.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ZONE</text><text x="70.19" y="358.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">=24384/26800</text><rect x="160.66" y="343.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="167.66" y="358.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="205.66" y="358.32" font-size="12" fill="#59636E">只有它的位置变了</text><text x="32" y="390.5" font-size="12.5" fill="#424A53">只有 ZONE 这一条记录被改。模型这一侧，现有的处理会让下面两台设备的</text><text x="32" y="410.5" font-size="12.5" fill="#424A53">模型跟着移（不变）。</text><rect x="498" y="308" width="442" height="268" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="510" y="329.68" font-size="13" font-weight="700" fill="#0550AE">按名称看（名称口径）</text><rect x="508" y="345" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="513" y="357.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ZONE</text><text x="548.19" y="358.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-ZONE-MV</text><rect x="686.77" y="343.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="693.77" y="358.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="731.77" y="358.32" font-size="12" fill="#59636E">自己的位置变了</text><rect x="508" y="373" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="513" y="385.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="548.19" y="386.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-MV1</text><rect x="679.9" y="371.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="686.9" y="386.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="724.9" y="386.32" font-size="12" fill="#59636E">上级的位置变了</text><rect x="508" y="401" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="513" y="413.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="548.19" y="414.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-MV2</text><rect x="679.9" y="399.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="686.9" y="414.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="724.9" y="414.32" font-size="12" fill="#59636E">上级的位置变了</text><text x="508" y="442.5" font-size="12.5" fill="#424A53">两个 BOX</text><rect x="570.55" y="427.75" width="48.5" height="20.5" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="577.55" y="442.14" font-size="11.5" font-weight="600" fill="#424A53">未修改</text><text x="627.05" y="442.32" font-size="12" fill="#59636E">上级的位置只算在单元那一行</text><line x1="506" y1="456" x2="932" y2="456" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="508" y="466" width="36" height="20" rx="4" fill="#424A53" stroke="#424A53" stroke-width="1"/><text x="515" y="479.96" font-size="11" font-weight="600" fill="#FFFFFF">单元</text><text x="551" y="480.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-MV1</text><rect x="682.71" y="465.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="689.71" y="480.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><rect x="508" y="494" width="36" height="20" rx="4" fill="#424A53" stroke="#424A53" stroke-width="1"/><text x="515" y="507.96" font-size="11" font-weight="600" fill="#FFFFFF">单元</text><text x="551" y="508.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-MV2</text><rect x="682.71" y="493.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="689.71" y="508.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="510" y="540.5" font-size="12.5" fill="#0A3069">上级各级的位置和方向算进单元自己那一行。ZONE 是容器，提资对比时它</text><text x="510" y="560.5" font-size="12.5" fill="#0A3069">自己不出行（F-02）。</text><rect x="20" y="590" width="920" height="96" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="611.68" font-size="13" font-weight="700" fill="#1F2328">提资时</text><rect x="32" y="621.75" width="37" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="636.14" font-size="11.5" font-weight="600" fill="#59636E">原来</text><text x="108" y="636.5" font-size="12.5" fill="#1F2328">两台设备的记录没有被写过，指纹没变，跳过。数据中台上留的是移动之前的坐标。</text><rect x="32" y="651.75" width="60" height="20.5" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="39" y="666.14" font-size="11.5" font-weight="600" fill="#0969DA">名称口径</text><text x="108" y="666.5" font-size="12.5" fill="#1F2328">两台设备都判修改，重发。</text><text x="940" y="705.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号为示意</text></svg>
