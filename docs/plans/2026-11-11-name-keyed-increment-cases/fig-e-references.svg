<svg xmlns="http://www.w3.org/2000/svg" width="960" height="696" viewBox="0 0 960 696" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="696" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="695" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">引用类属性：比的是目标叫什么，不是目标的参考号</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">引用类属性（CREF、SPRE、TREF 等）的值是另一个元素的参考号。比的时候先换成对目标的描述。</text><text x="22" y="89.5" font-size="12.5" font-weight="700" fill="#59636E">情形</text><text x="202" y="89.5" font-size="12.5" font-weight="700" fill="#59636E">引用指向的目标：基准一侧</text><text x="490" y="89.5" font-size="12.5" font-weight="700" fill="#59636E">目标一侧</text><text x="764" y="89.5" font-size="12.5" font-weight="700" fill="#59636E">引用方怎么判</text><rect x="14" y="98" width="932" height="82" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="22" y="123.68" font-size="13" font-weight="700" fill="#1F2328">E-01 被引用的对象删后同名</text><text x="22" y="143.68" font-size="13" font-weight="700" fill="#1F2328">重建</text><text x="22" y="164.32" font-size="12" fill="#59636E">例：管口的 CREF 指向一条支管</text><rect x="202" y="109" width="262" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="210" y="115" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="215" y="127.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="251.19" y="128.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="455" y="128.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><rect x="490" y="109" width="262" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><rect x="498" y="115" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="503" y="127.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="539.19" y="128.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="743" y="128.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#8250DF" text-anchor="end">=…/26616</text><path d="M468,124 L486,124" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="764" y="109.5" width="50" height="21" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="771" y="124.32" font-size="12" font-weight="600" fill="#424A53">未修改</text><text x="764" y="149.32" font-size="12" fill="#424A53">目标的名称没变。</text><rect x="14" y="190" width="932" height="100" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="22" y="215.68" font-size="13" font-weight="700" fill="#1F2328">E-02 引用换到另一个名称的</text><text x="22" y="235.68" font-size="13" font-weight="700" fill="#1F2328">对象</text><text x="22" y="256.32" font-size="12" fill="#59636E">例：管件的 SPRE（规格）从</text><text x="22" y="274.32" font-size="12" fill="#59636E">YBS2 换成 YBS3</text><rect x="202" y="201" width="262" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="210" y="207" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="215" y="219.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">SPCO</text><text x="251.19" y="220.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/YBS2/CIB51002:BO,9,9</text><rect x="490" y="201" width="262" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="498" y="207" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="503" y="219.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">SPCO</text><text x="539.19" y="220.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/YBS3/CIB51002:BO,9,9</text><rect x="696.29" y="206" width="36" height="20" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="703.29" y="219.96" font-size="11" font-weight="600" fill="#7D4E00">换了</text><path d="M468,216 L486,216" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="764" y="201.5" width="38" height="21" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="771" y="216.32" font-size="12" font-weight="600" fill="#7D4E00">修改</text><text x="764" y="241.32" font-size="12" fill="#424A53">换了名称就算实质变化，哪怕两</text><text x="764" y="259.32" font-size="12" fill="#424A53">个规格件内容相同。</text><rect x="14" y="300" width="932" height="82" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="22" y="325.68" font-size="13" font-weight="700" fill="#1F2328">E-03 被引用的对象自己改了</text><text x="22" y="345.68" font-size="13" font-weight="700" fill="#1F2328">名</text><text x="22" y="366.32" font-size="12" fill="#59636E">同一个库里，参考号没变</text><rect x="202" y="311" width="262" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="210" y="317" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="215" y="329.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="251.19" y="330.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="455" y="330.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><rect x="490" y="311" width="262" height="30" rx="6" fill="#FFF8C5" stroke="#BF8700" stroke-width="1.6"/><rect x="498" y="317" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="503" y="329.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="539.19" y="330.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-T</text><text x="743" y="330.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><path d="M468,326 L486,326" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="764" y="311.5" width="38" height="21" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="771" y="326.32" font-size="12" font-weight="600" fill="#7D4E00">修改</text><text x="764" y="351.32" font-size="12" fill="#424A53">提资内容里有从目标名称取的值。</text><rect x="14" y="392" width="932" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="22" y="417.68" font-size="13" font-weight="700" fill="#1F2328">E-04 目标没有真实名字</text><text x="22" y="438.32" font-size="12" fill="#59636E">例：支管的 TREF 指向另一条支</text><text x="22" y="456.32" font-size="12" fill="#59636E">管里的无名三通</text><rect x="202" y="403" width="262" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6" stroke-dasharray="5 3"/><rect x="210" y="409" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="215" y="421.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">TEE</text><text x="245.14" y="422.5" font-size="12.5" fill="#6E7781">（无名）</text><text x="455" y="422.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26607</text><rect x="490" y="403" width="262" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6" stroke-dasharray="5 3"/><rect x="498" y="409" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="503" y="421.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">TEE</text><text x="533.14" y="422.5" font-size="12.5" fill="#6E7781">（无名）</text><text x="743" y="422.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#8250DF" text-anchor="end">=…/26620</text><path d="M468,418 L486,418" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="202" y="453.32" font-size="12" fill="#0550AE">两侧的描述都是：/AIOS-SUITE-BRAN-S › TEE 1</text><rect x="764" y="403.5" width="50" height="21" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="771" y="418.32" font-size="12" font-weight="600" fill="#424A53">未修改</text><text x="764" y="443.32" font-size="12" fill="#424A53">描述取「最近的有名祖先的名称，</text><text x="764" y="461.32" font-size="12" fill="#424A53">加上往下逐级的类型与序号」。</text><rect x="14" y="486" width="932" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="22" y="511.68" font-size="13" font-weight="700" fill="#1F2328">E-05、E-06 目标在别的库</text><text x="22" y="532.32" font-size="12" fill="#59636E">目录库，或另一个设计库</text><rect x="202" y="497" width="262" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="210" y="503" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="215" y="515.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">SPCO</text><text x="251.19" y="516.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/YBS2/CIB51002:BO,9,9</text><rect x="490" y="497" width="262" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="498" y="503" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="503" y="515.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">SPCO</text><text x="539.19" y="516.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/YBS2/CIB51002:BO,9,9</text><path d="M468,512 L486,512" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="202" y="547.32" font-size="12" fill="#0550AE">基准时刻那个库处在哪个会话无从知道：两侧都用目标现在的名称</text><rect x="764" y="497.5" width="86" height="21" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="771" y="512.32" font-size="12" font-weight="600" fill="#59636E">看现在的名称</text><text x="764" y="537.32" font-size="12" fill="#424A53">换了目标看得出来（E-05）；目</text><text x="764" y="555.32" font-size="12" fill="#424A53">标自己变了，看不出来（E-06）。</text><rect x="14" y="580" width="932" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="22" y="605.68" font-size="13" font-weight="700" fill="#1F2328">E-07 引用为空，或目标已经</text><text x="22" y="625.68" font-size="13" font-weight="700" fill="#1F2328">不存在</text><rect x="202" y="591" width="262" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1" stroke-dasharray="5 3"/><text x="333" y="610.5" font-size="12.5" fill="#6E7781" text-anchor="middle">（空引用，或目标已不存在）</text><rect x="490" y="591" width="262" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1" stroke-dasharray="5 3"/><text x="621" y="610.5" font-size="12.5" fill="#6E7781" text-anchor="middle">（空引用，或目标已不存在）</text><path d="M468,606 L486,606" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="202" y="641.32" font-size="12" fill="#0550AE">各用一个固定记号，记号相同算相同</text><rect x="764" y="591.5" width="62" height="21" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="771" y="606.32" font-size="12" font-weight="600" fill="#59636E">按记号比</text><text x="764" y="631.32" font-size="12" fill="#424A53">E-08：一直到库顶都没有有名祖</text><text x="764" y="649.32" font-size="12" fill="#424A53">先的目标，退回用参考号比。</text><text x="940" y="685.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号和 /AIOS-SUITE-BRAN-T 这个名字为示意</text></svg>
