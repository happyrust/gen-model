）</text><rect x="508" y="365" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="513" y="377.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="548.19" y="378.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><rect x="666.15" y="363.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="673.15" y="378.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="711.15" y="378.32" font-size="12" fill="#59636E">多了一个成员</text><text x="508" y="406.5" font-size="12.5" fill="#424A53">Copy-of 的 BOX</text><rect x="610.1" y="391.75" width="48.5" height="20.5" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="617.1" y="406.14" font-size="11.5" font-weight="600" fill="#6E7781">不出行</text><text x="666.6" y="406.32" font-size="12" fill="#59636E">和无名成员一样，算到 /AIOS-SUITE-EQ-A 上</text><text x="508" y="434.5" font-size="12.5" fill="#424A53">Copy-of 的设备</text><rect x="605.55" y="419.75" width="71.5" height="20.5" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="612.55" y="434.14" font-size="11.5" font-weight="600" fill="#6E7781">不在结果里</text><line x1="506" y1="448" x2="932" y2="448" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="508" y="458" width="36" height="20" rx="4" fill="#424A53" stroke="#424A53" stroke-width="1"/><text x="515" y="471.96" font-size="11" font-weight="600" fill="#FFFFFF">单元</text><text x="551" y="472.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-A</text><rect x="668.96" y="457.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="675.96" y="472.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="510" y="504.5" font-size="12.5" fill="#0A3069">之后再改这个 Copy-of 的 BOX 的尺寸，/AIOS-SUITE-EQ-A 仍判修改。自</text><text x="510" y="524.5" font-size="12.5" fill="#0A3069">动命名的单元整个不看。</text><rect x="20" y="554" width="920" height="96" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="575.68" font-size="13" font-weight="700" fill="#1F2328">提资时</text><rect x="32" y="585.75" width="37" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="600.14" font-size="11.5" font-weight="600" fill="#59636E">原来</text><text x="108" y="600.5" font-size="12.5" fill="#1F2328">/AIOS-SUITE-EQ-A 重发。名字含 Copy-of 的设备，提资本来就不发。</text><rect x="32" y="615.75" width="60" height="20.5" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="39" y="630.14" font-size="11.5" font-weight="600" fill="#0969DA">名称口径</text><text x="108" y="630.5" font-size="12.5" fill="#1F2328">/AIOS-SUITE-EQ-A 重发。Copy-of 的设备不在结果里，提资照原来的办法处理：不发。</text><text x="940" y="669.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号为示意</text></svg>
