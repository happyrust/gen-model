="355" y="148.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">VALV</text><text x="391.19" y="149.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-V1</text><text x="609" y="149.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26830</text><rect x="342" y="166" width="276" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="350" y="172" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="355" y="184.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">VALV</text><text x="391.19" y="185.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-V1</text><text x="609" y="185.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26851</text><line x1="342" y1="204" x2="618" y2="204" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="3 3"/><text x="344" y="230.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-V1</text><rect x="448.22" y="215.75" width="48.5" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="455.22" y="230.14" font-size="11.5" font-weight="600" fill="#59636E">不配对</text><text x="504.72" y="230.32" font-size="12" fill="#59636E">进重名清单</text><text x="344" y="257.32" font-size="12" fill="#424A53">E3D 不允许同库重名，业务上也不会重名，只有数</text><text x="344" y="275.32" font-size="12" fill="#424A53">据异常时才会出现。重名的构件没有类别；所在的</text><text x="344" y="293.32" font-size="12" fill="#424A53">单元按修改处理。</text><rect x="644" y="76" width="296" height="264" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="656" y="97.68" font-size="13" font-weight="700" fill="#1F2328">D-03 别的库里有同名的</text><text x="656" y="122.32" font-size="12" font-weight="700" fill="#59636E">库 8000（正在比的库）</text><rect x="654" y="130" width="276" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="662" y="136" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="667" y="148.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="703.19" y="149.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-B</text><text x="921" y="149.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26562</text><text x="656" y="178.32" font-size="12" font-weight="700" fill="#59636E">库 7999（别的库）</text><rect x="654" y="186" width="276" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="662" y="192" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="667" y="204.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="703.19" y="205.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-B</text><text x="921" y="205.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/91234</text><line x1="654" y1="224" x2="930" y2="224" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="656" y="237" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="661" y="249.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="696.19" y="250.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-EQ-B</text><rect x="814.15" y="235.75" width="37" height="20.5" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="821.15" y="250.14" font-size="11.5" font-weight="600" fill="#A40E26">删除</text><text x="656" y="277.32" font-size="12" fill="#424A53">只在同一个库里配对。库 8000 里它就是被删了；</text><text x="656" y="295.32" font-size="12" fill="#424A53">库 7999 里那个同名的不配对，只在结果里提示一</text><text x="656" y="313.32" font-size="12" fill="#424A53">句。</text><text x="940" y="361.96" font-size="11" fill="#818B98" text-anchor="end">图中的名字 /AIOS-SUITE-V1 和参考号为示意</text></svg>
