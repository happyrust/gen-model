<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs></defs><rect x="0" y="0" width="960" height="372" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="371" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">名称相同却不配对的三种情形</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">三种情形都不配对。配错比不配更糟：配错会把两个不同的构件判成未修改，提资就漏发了。</text><rect x="20" y="76" width="296" height="264" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="97.68" font-size="13" font-weight="700" fill="#1F2328">D-01 同名，但类型不同</text><text x="32" y="122.32" font-size="12" font-weight="700" fill="#59636E">基准一侧</text><rect x="30" y="130" width="276" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="38" y="136" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="43" y="148.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">VALV</text><text x="79.19" y="149.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-V1</text><text x="297" y="149.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26830</text><text x="32" y="178.32" font-size="12" font-weight="700" fill="#59636E">目标一侧</text><rect x="30" y="186" width="276" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><rect x="38" y="192" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="43" y="204.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">INST</text><text x="79.19" y="205.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-V1</text><text x="297" y="20