<svg xmlns="http://www.w3.org/2000/svg" width="960" height="647" viewBox="0 0 960 647" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="647" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="646" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">提资时两条路并存：一个单元走哪一条</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">提资不自己判断名字算不算真实名字，只看这个单元在不在名称口径的结果里。</text><rect x="270" y="76" width="220" height="37" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="380" y="99" font-size="12.5" fill="#1F2328" text-anchor="middle">提资请求里的一个单元</text><rect x="220" y="143" width="320" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="380" y="166" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">提资原有的「不发」规则命中吗？</text><path d="M380,113 L380,143" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="628" y="122.5" width="310" height="78" rx="7" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1.3"/><text x="640" y="144.18" font-size="13" font-weight="700" fill="#1F2328">不发（和原来一样）</text><text x="640" y="167" font-size="12.5" fill="#424A53">例如名字含 Copy-of 的设备，没有名字的工艺支管</text><text x="640" y="187" font-size="12.5" fill="#424A53">和设备。这些规则不改，先于类别生效（C-09）。</text><path d="M540,161.5 L628,161.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="569" y="141.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="584" y="154.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">命中</text><rect x="220" y="224" width="320" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="380" y="247" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">它在名称口径的结果里吗？</text><path d="M380,180 L380,224" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="389" y="193.36" width="42" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="410" y="206.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">没命中</text><rect x="20" y="307" width="452" height="320" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="32" y="328.68" font-size="13" font-weight="700" fill="#0550AE">在：按名称口径的类别</text><rect x="32" y="338.75" width="48.5" height="20.5" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="353.14" font-size="11.5" font-weight="600" fill="#424A53">未修改</text><text x="162" y="353.5" font-size="12.5" fill="#1F2328">跳过，不提资。</text><rect x="32" y="368.75" width="48.5" height="20.5" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="383.14" font-size="11.5" font-weight="600" fill="#424A53">未修改</text><rect x="86.5" y="368.75" width="37" height="20.5" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="93.5" y="383.14" font-size="11.5" font-weight="600" fill="#6639BA">换号</text><text x="162" y="383.5" font-size="12.5" fill="#1F2328">跳过；版本记录转到新参考号；不为旧参考号提删除。</text><rect x="32" y="398.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="39" y="413.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="162" y="413.5" font-size="12.5" fill="#1F2328">重发。</text><rect x="32" y="428.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="39" y="443.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><rect x="75" y="428.75" width="37" height="20.5" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="82" y="443.14" font-size="11.5" font-weight="600" fill="#6639BA">换号</text><text x="162" y="443.5" font-size="12.5" fill="#1F2328">按原位号提交修改，版本号接着走；不为旧参考号提</text><text x="162" y="463.5" font-size="12.5" fill="#1F2328">删除。</text><rect x="32" y="474.75" width="37" height="20.5" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="39" y="489.14" font-size="11.5" font-weight="600" fill="#116329">新增</text><rect x="75" y="474.75" width="60" height="20.5" rx="4" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/><text x="82" y="489.14" font-size="11.5" font-weight="600" fill="#0550AE">从未提资</text><text x="162" y="489.5" font-size="12.5" fill="#1F2328">首次提资。</text><rect x="32" y="504.75" width="37" height="20.5" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="39" y="519.14" font-size="11.5" font-weight="600" fill="#A40E26">删除</text><rect x="75" y="504.75" width="37" height="20.5" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="82" y="519.14" font-size="11.5" font-weight="600" fill="#116329">新增</text><text x="162" y="519.5" font-size="12.5" fill="#1F2328">改了位号的单元：旧位号提删除，新位号提新增（原</text><text x="162" y="539.5" font-size="12.5" fill="#1F2328">有做法，不变）。</text><rect x="32" y="550.75" width="37" height="20.5" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="39" y="565.14" font-size="11.5" font-weight="600" fill="#A40E26">删除</text><text x="162" y="565.5" font-size="12.5" fill="#1F2328">旧位号提删除（走待删除列表，原有做法）。已被接</text><text x="162" y="585.5" font-size="12.5" fill="#1F2328">替的不提。</text><text x="32" y="614.32" font-size="12" fill="#0550AE">不再看版本记录的状态：纯元数据的改动也会把它标成「已修改」（B-01）。</text><rect x="488" y="307" width="452" height="320" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="500" y="328.68" font-size="13" font-weight="700" fill="#1F2328">不在：照原来的办法（H-01）</text><text x="500" y="353.5" font-size="12.5" fill="#1F2328">版本记录的状态没有被标成「已修改」，并且指纹没变，就跳过；否则照发。</text><text x="500" y="373.5" font-size="12.5" fill="#1F2328">指纹是「单元里最后一次改动的会话号，加上成员的个数」，单元里任何一次</text><text x="500" y="393.5" font-size="12.5" fill="#1F2328">写入都会让它变。</text><text x="500" y="423.5" font-size="12.5" font-weight="700" fill="#1F2328">谁会落到这里：</text><text x="508" y="448.04" font-size="14" font-weight="700" fill="#59636E" text-anchor="middle">·</text><text x="520" y="447.5" font-size="12.5" fill="#424A53">没有真实名字的单元：没有名字的、自动命名的（C-05、C-08）</text><text x="508" y="472.04" font-size="14" font-weight="700" fill="#59636E" text-anchor="middle">·</text><text x="520" y="471.5" font-size="12.5" fill="#424A53">类型不属于最小交付单元的：工艺和仪控的支吊架（ZONE）、电气接地</text><text x="520" y="491.5" font-size="12.5" fill="#424A53">和一部分电缆支架（STRU）</text><text x="508" y="516.04" font-size="14" font-weight="700" fill="#59636E" text-anchor="middle">·</text><text x="520" y="515.5" font-size="12.5" fill="#424A53">名称口径的判定用不了时的全部单元（H-02）</text><path d="M320,261 L320,293 L246,293 L246,307" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="295" y="268.36" width="18" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="304" y="281.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">在</text><path d="M440,261 L440,293 L714,293 L714,307" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="449" y="268.36" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="464" y="281.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">不在</text></svg>
