<svg xmlns="http://www.w3.org/2000/svg" width="960" height="374" viewBox="0 0 960 374" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs></defs><rect x="0" y="0" width="960" height="374" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="373" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">提资预览怎么分栏</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">前五栏取自 gen-model 的结果，最后一栏取自 rs-server 现有的判断。预览不写任何东西；真正提资时如果库又前进了，提示重新预览。</text><rect x="20" y="76" width="296" height="122" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1.5"/><rect x="32" y="85" width="40" height="22" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="100.68" font-size="13" font-weight="600" fill="#424A53">跳过</text><text x="32" y="130.32" font-size="12" fill="#818B98">对应</text><text x="84" y="130.5" font-size="12.5" fill="#1F2328">类别是未修改的单元。其中换了参考号</text><text x="84" y="150.5" font-size="12.5" fill="#1F2328">的单独计一个数。</text><text x="32" y="178.32" font-size="12" fill="#818B98">提资时</text><text x="84" y="178.5" font-size="12.5" fill="#1F2328">不提资。</text><rect x="332" y="76" width="296" height="122" rx="8" fill="#FFFFFF" stroke="#D4A72C" stroke-width="1.5"/><rect x="344" y="85" width="40" height="22" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="351" y="100.68" font-size="13" font-weight="600" fill="#7D4E00">重发</text><text x="344" y="130.32" font-size="12" fill="#818B98">对应</text><text x="396" y="130.5" font-size="12.5" fill="#1F2328">类别是修改的单元。</text><text x="344" y="160.32" font-size="12" fill="#818B98">提资时</text><text x="396" y="160.5" font-size="12.5" fill="#1F2328">按原位号提交修改。</text><rect x="644" y="76" width="296" height="122" rx="8" fill="#FFFFFF" stroke="#4AC26B" stroke-width="1.5"/><rect x="656" y="85" width="66" height="22" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="663" y="100.68" font-size="13" font-weight="600" fill="#116329">首次提资</text><text x="656" y="130.32" font-size="12" fill="#818B98">对应</text><text x="708" y="130.5" font-size="12.5" fill="#1F2328">类别是新增、并且标了「从未提资」的</text><text x="708" y="150.5" font-size="12.5" fill="#1F2328">单元。</text><text x="656" y="178.32" font-size="12" fill="#818B98">提资时</text><text x="708" y="178.5" font-size="12.5" fill="#1F2328">提交新增。</text><rect x="20" y="212" width="296" height="140" rx="8" fill="#FFFFFF" stroke="#FF8182" stroke-width="1.5"/><rect x="32" y="221" width="40" height="22" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="236.68" font-size="13" font-weight="600" fill="#59636E">改名</text><rect x="88" y="221.75" width="60" height="20.5" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="95" y="236.14" font-size="11.5" font-weight="600" fill="#A40E26">旧名删除</text><rect x="154" y="221.75" width="60" height="20.5" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="161" y="236.14" font-size="11.5" font-weight="600" fill="#116329">新名新增</text><text x="32" y="266.32" font-size="12" fill="#818B98">对应</text><text x="84" y="266.5" font-size="12.5" fill="#1F2328">改了位号的单元：旧名一条删除，新名</text><text x="84" y="286.5" font-size="12.5" fill="#1F2328">一条新增。沿用已有的改名影响一栏。</text><text x="32" y="314.32" font-size="12" fill="#818B98">提资时</text><text x="84" y="314.5" font-size="12.5" fill="#1F2328">旧位号提删除，新位号提新增。</text><rect x="332" y="212" width="296" height="140" rx="8" fill="#FFFFFF" stroke="#FF8182" stroke-width="1.5"/><rect x="344" y="221" width="40" height="22" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="351" y="236.68" font-size="13" font-weight="600" fill="#A40E26">删除</text><text x="344" y="266.32" font-size="12" fill="#818B98">对应</text><text x="396" y="266.5" font-size="12.5" fill="#1F2328">类别是删除的单元。已被接替的不在其</text><text x="396" y="286.5" font-size="12.5" fill="#1F2328">中。</text><text x="344" y="314.32" font-size="12" fill="#818B98">提资时</text><text x="396" y="314.5" font-size="12.5" fill="#1F2328">提交删除。</text><rect x="644" y="212" width="296" height="140" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="656" y="221" width="118" height="22" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="663" y="236.68" font-size="13" font-weight="600" fill="#6E7781">按原来的办法判断</text><text x="656" y="266.32" font-size="12" fill="#818B98">对应</text><text x="708" y="266.5" font-size="12.5" fill="#1F2328">不在结果里的单元：没有真实名字的，</text><text x="708" y="286.5" font-size="12.5" fill="#1F2328">和类型不属于最小交付单元的。</text><text x="656" y="314.32" font-size="12" fill="#818B98">提资时</text><text x="708" y="314.5" font-size="12.5" fill="#1F2328">只分「照发」和「跳过」两个数，依据</text><text x="708" y="334.5" font-size="12.5" fill="#1F2328">是今天的状态加指纹。</text></svg>
