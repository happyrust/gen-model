<svg xmlns="http://www.w3.org/2000/svg" width="960" height="546" viewBox="0 0 960 546" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="546" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="545" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">接替：新单元顶上旧单元的名字，有两种来法</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">两种来法都发生在已经提资过的单元上。库里同一时刻不能有两个同名的元素，所以原来的那个要先让出名字。</text><rect x="20" y="76" width="920" height="144" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="97.68" font-size="13" font-weight="700" fill="#1F2328">来法一：删掉，再同名重建</text><text x="30" y="123.5" font-size="12.5" font-weight="700" fill="#424A53">会话 A：提资过</text><rect x="30" y="134" width="288" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="38" y="140" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="43" y="152.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="79.19" y="153.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="309" y="153.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><text x="30" y="185.32" font-size="12" fill="#59636E">提资版本记录记在参考号 …/26603 上。</text><path d="M320,149 L334,149" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="336" y="123.5" font-size="12.5" font-weight="700" fill="#424A53">会话 B：整条删掉</text><rect x="336" y="134" width="288" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="344" y="140" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="349" y="152.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="385.19" y="153.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="615" y="153.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><text x="336" y="185.32" font-size="12" fill="#59636E">增量给它记一条待删除记录：旧位号</text><text x="336" y="203.32" font-size="12" fill="#59636E">/AIOS-SUITE-BRAN-S，原因「删除」。</text><path d="M626,149 L640,149" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="642" y="123.5" font-size="12.5" font-weight="700" fill="#424A53">会话 C：同名重建</text><rect x="642" y="134" width="288" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><rect x="650" y="140" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="655" y="152.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="691.19" y="153.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="921" y="153.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#8250DF" text-anchor="end">=…/26616</text><text x="642" y="185.32" font-size="12" fill="#59636E">新参考号没有版本记录。B 和 C 可以是同一次保存。</text><rect x="20" y="232" width="920" height="180" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="253.68" font-size="13" font-weight="700" fill="#1F2328">来法二：原单元先改名让出名字，新单元用原名，再删掉原单元</text><text x="30" y="279.5" font-size="12.5" font-weight="700" fill="#424A53">会话 A：提资过</text><rect x="30" y="290" width="288" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="38" y="296" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="43" y="308.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="79.19" y="309.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="309" y="309.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><text x="30" y="377.32" font-size="12" fill="#59636E">提资版本记录记在参考号 …/26603 上。</text><path d="M320,305 L334,305" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="336" y="279.5" font-size="12.5" font-weight="700" fill="#424A53">会话 B：原单元改名，另建一条用原名</text><rect x="336" y="290" width="288" height="30" rx="6" fill="#FFF8C5" stroke="#BF8700" stroke-width="1.6"/><rect x="344" y="296" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="349" y="308.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="385.19" y="309.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S-OLD</text><text x="615" y="309.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><rect x="336" y="326" width="288" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><rect x="344" y="332" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="349" y="344.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="385.19" y="345.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="615" y="345.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#8250DF" text-anchor="end">=…/26616</text><text x="336" y="377.32" font-size="12" fill="#59636E">增量记一条待删除记录：旧位号</text><text x="336" y="395.32" font-size="12" fill="#59636E">/AIOS-SUITE-BRAN-S，原因「改名」。</text><path d="M626,305 L640,305" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="642" y="279.5" font-size="12.5" font-weight="700" fill="#424A53">会话 C：删掉改了名的原单元</text><rect x="642" y="290" width="288" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="650" y="296" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="655" y="308.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="691.19" y="309.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S-OLD</text><text x="921" y="309.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><rect x="642" y="326" width="288" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="650" y="332" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="655" y="344.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="691.19" y="345.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="921" y="345.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#8250DF" text-anchor="end">=…/26616</text><text x="642" y="377.32" font-size="12" fill="#59636E">同一个参考号只留第一条记录，原因仍是「改名」。</text><rect x="20" y="424" width="920" height="92" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="32" y="448.5" font-size="12.5" fill="#0A3069">怎么认出接替（两种来法一样）：新单元 /AIOS-SUITE-BRAN-S（…/26616）没有自己的版本记录，就到同库的待删除记录里找。旧位号等于它的名称、类型相</text><text x="32" y="468.5" font-size="12.5" fill="#0A3069">同、旧参考号有版本记录的那一条，就是它接替的旧单元。</text><text x="32" y="494.5" font-size="12.5" fill="#0A3069">认出之后：用旧单元记录上的基准比内容，结果标「换号」；待删除列表里那一条标「已被接替」；提资不为它推送删除，版本记录转到新参考号。</text><text x="940" y="535.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号和 -OLD 这个名字为示意</text></svg>
