<svg xmlns="http://www.w3.org/2000/svg" width="960" height="466" viewBox="0 0 960 466" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs></defs><rect x="0" y="0" width="960" height="466" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="465" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">比的是什么：一个有名构件的「内容」</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">以支管 /AIOS-SUITE-BRAN-S 为例。两侧的内容逐项相同，才算未修改。</text><rect x="20" y="76" width="420" height="370" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="97.68" font-size="13" font-weight="700" fill="#1F2328">库里的一段树（示意）</text><rect x="30" y="110" width="400" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="38" y="116" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="43" y="128.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ZONE</text><text x="79.19" y="129.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-8000-Z</text><rect x="50" y="146" width="380" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="58" y="152" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="63" y="164.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="99.19" y="165.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><rect x="70" y="182" width="360" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="78" y="188" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="83" y="200.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ELBO</text><text x="119.19" y="201.5" font-size="12.5" fill="#6E7781">（无名）</text><rect x="70" y="218" width="360" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="78" y="224" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="83" y="236.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">TEE</text><text x="113.14" y="237.5" font-size="12.5" fill="#6E7781">（无名）</text><rect x="70" y="254" width="360" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="78" y="260" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="83" y="272.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">VALV</text><text x="119.19" y="273.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S-M2</text><rect x="70" y="290" width="360" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="78" y="296" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="83" y="308.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">FTUB</text><text x="119.19" y="309.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781">/Copy-of-…-M3</text><rect x="218.11" y="295.25" width="56" height="19.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="225.11" y="308.78" font-size="10.5" font-weight="600" fill="#59636E">自动命名</text><line x1="60" y1="176" x2="60" y2="305" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="197" x2="70" y2="197" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="233" x2="70" y2="233" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="269" x2="70" y2="269" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="305" x2="70" y2="305" stroke="#AFB8C1" stroke-width="1.2"/><line x1="40" y1="140" x2="40" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><line x1="40" y1="161" x2="50" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><circle cx="414" cy="125" r="9.5" fill="#0969DA"/><text x="414" y="129.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="391" cy="161" r="9.5" fill="#0969DA"/><text x="391" y="165.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="414" cy="161" r="9.5" fill="#0969DA"/><text x="414" y="165.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="414" cy="197" r="9.5" fill="#0969DA"/><text x="414" y="201.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="414" cy="233" r="9.5" fill="#0969DA"/><text x="414" y="237.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="414" cy="269" r="9.5" fill="#0969DA"/><text x="414" y="273.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="414" cy="305" r="9.5" fill="#0969DA"/><text x="414" y="309.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="456" y="76" width="484" height="370" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="468" y="97.68" font-size="13" font-weight="700" fill="#0550AE">算进内容的</text><circle cx="478" cy="118" r="9.5" fill="#0969DA"/><text x="478" y="122.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="496" y="122.5" font-size="12.5" fill="#1F2328">它自己的类型和属性。纯元数据不算；NAME 自己不参与（名称相同是配对的</text><text x="496" y="142.5" font-size="12.5" fill="#1F2328">前提）。</text><circle cx="478" cy="166" r="9.5" fill="#0969DA"/><text x="478" y="170.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="496" y="170.5" font-size="12.5" fill="#1F2328">它的引用类属性：换成目标的名称再比，不比参考号。</text><circle cx="478" cy="196" r="9.5" fill="#0969DA"/><text x="478" y="200.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="496" y="200.5" font-size="12.5" fill="#1F2328">名下没有真实名字的成员（无名的、自动命名的）：按顺序逐个比类型和属性，</text><text x="496" y="220.5" font-size="12.5" fill="#1F2328">一层层往下，不带参考号。</text><circle cx="478" cy="244" r="9.5" fill="#0969DA"/><text x="478" y="248.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="496" y="248.5" font-size="12.5" fill="#1F2328">下面的有名成员：只记「第几个位置上是谁」（类型加名称）。它自己的内容</text><text x="496" y="268.5" font-size="12.5" fill="#1F2328">在它自己那一行里比。</text><circle cx="478" cy="292" r="9.5" fill="#0969DA"/><text x="478" y="296.14" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="496" y="296.5" font-size="12.5" fill="#1F2328">只有单元那一行：再加上从它往上各级的位置和方向。</text><text x="468" y="330.68" font-size="13" font-weight="700" fill="#59636E">不算进内容的</text><text x="478" y="357.04" font-size="14" font-weight="700" fill="#818B98" text-anchor="middle">×</text><text x="496" y="356.5" font-size="12.5" fill="#59636E">任何元素的参考号</text><text x="478" y="381.04" font-size="14" font-weight="700" fill="#818B98" text-anchor="middle">×</text><text x="496" y="380.5" font-size="12.5" fill="#59636E">纯元数据（提资读取清单到位前，只有 CACHID、SPAMAP 两项）</text><text x="478" y="405.04" font-size="14" font-weight="700" fill="#818B98" text-anchor="middle">×</text><text x="496" y="404.5" font-size="12.5" fill="#59636E">有名成员自己的内容</text><text x="478" y="429.04" font-size="14" font-weight="700" fill="#818B98" text-anchor="middle">×</text><text x="496" y="428.5" font-size="12.5" fill="#59636E">下面没有真实名字的交付单元</text></svg>
