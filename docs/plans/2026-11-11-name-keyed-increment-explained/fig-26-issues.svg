<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah424A53" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#424A53"/></marker></defs><rect x="0" y="0" width="960" height="660" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="659" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">十片工作和它们的依赖</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">箭头从「先做的」指向「等它的」。每一片对应 happyrust/gen-model 上的一张票。</text><rect x="20" y="76" width="920" height="306" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="100.68" font-size="13" font-weight="700" fill="#424A53">gen-model</text><rect x="20" y="396" width="920" height="80" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="420.68" font-size="13" font-weight="700" fill="#424A53">rs-server</text><rect x="20" y="484" width="920" height="80" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="508.68" font-size="13" font-weight="700" fill="#424A53">rs-server</text><text x="32" y="528.14" font-size="11.5" fill="#59636E">和 plant-ui</text><rect x="130" y="168" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="140" y="187.68" font-size="13" font-weight="700" fill="#0550AE">S1</text><text x="300" y="187.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#133</text><text x="140" y="206.82" font-size="12" fill="#1F2328">两个会话之间按名称配对，只</text><text x="140" y="223.82" font-size="12" fill="#1F2328">读接口</text><rect x="350" y="88" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="360" y="107.68" font-size="13" font-weight="700" fill="#0550AE">S2</text><text x="520" y="107.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#134</text><text x="360" y="126.82" font-size="12" fill="#1F2328">引用按目标的名称比；单元之</text><text x="360" y="143.82" font-size="12" fill="#1F2328">外的变化</text><rect x="350" y="162" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="360" y="181.68" font-size="13" font-weight="700" fill="#0550AE">S6</text><text x="520" y="181.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#138</text><text x="360" y="200.82" font-size="12" fill="#1F2328">待删除列表标出已被接替</text><rect x="350" y="236" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="360" y="255.68" font-size="13" font-weight="700" fill="#0550AE">S5</text><text x="520" y="255.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#137</text><text x="360" y="274.82" font-size="12" fill="#1F2328">以上一次提资为基准的缺省入</text><text x="360" y="291.82" font-size="12" fill="#1F2328">口</text><rect x="350" y="310" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="360" y="329.68" font-size="13" font-weight="700" fill="#0550AE">S3</text><text x="520" y="329.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#136</text><text x="360" y="348.82" font-size="12" fill="#1F2328">接入提资读取清单，纯元数据</text><text x="360" y="365.82" font-size="12" fill="#1F2328">不算</text><rect x="130" y="405" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="140" y="424.68" font-size="13" font-weight="700" fill="#0550AE">S4</text><text x="300" y="424.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#135</text><text x="140" y="443.82" font-size="12" fill="#1F2328">用脚本扫出「提资读取清单」</text><rect x="560" y="405" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="570" y="424.68" font-size="13" font-weight="700" fill="#0550AE">S7</text><text x="730" y="424.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#99</text><text x="570" y="443.82" font-size="12" fill="#1F2328">提资时按类别跳过或重发</text><rect x="760" y="493" width="170" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="770" y="512.68" font-size="13" font-weight="700" fill="#0550AE">S8</text><text x="920" y="512.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#113</text><text x="770" y="531.82" font-size="12" fill="#1F2328">换号的单元：不推旧删除，</text><text x="770" y="548.82" font-size="12" fill="#1F2328">版本记录转移</text><rect x="560" y="493" width="180" height="62" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="570" y="512.68" font-size="13" font-weight="700" fill="#0550AE">S9</text><text x="730" y="512.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53" text-anchor="end">#100</text><text x="570" y="531.82" font-size="12" fill="#1F2328">提资预览按类别分栏</text><path d="M310,199 L330,199 L330,119 L350,119" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M310,199 L330,199 L330,193 L350,193" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M310,199 L330,199 L330,267 L350,267" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M310,199 L330,199 L330,341 L350,341" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M310,436 L338,436 L338,357 L350,357" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M530,259 L548,259 L548,436 L560,436" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M530,275 L540,275 L540,524 L560,524" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M530,247 L830,247 L830,493" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M530,193 L880,193 L880,493" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M740,436 L805,436 L805,493" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah424A53)"/><path d="M620,467 L620,493" fill="none" stroke="#424A53" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ah424A53)"/><rect x="632.75" y="471.72" width="86.5" height="16.56" fill="#FFFFFF" opacity="0.94"/><text x="676" y="484.14" font-size="11.5" fill="#59636E" text-anchor="middle">核对数量时要它</text><rect x="20" y="572" width="920" height="58" rx="8" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4" stroke-dasharray="6 4"/><text x="32" y="594.68" font-size="13" font-weight="700" fill="#0550AE">S10</text><text x="70" y="594.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">#139</text><text x="118" y="594.5" font-size="12.5" font-weight="700" fill="#1F2328">八条验收用例的 E3D 宏与真机证据（gen-model 的套件，联调 rs-server）</text><text x="32" y="617.32" font-size="12" fill="#424A53">贯穿全程：接口层面的验证随 S1、S2、S3、S5、S6 做；端到端的验证要等 S7、S8。</text><text x="940" y="649.96" font-size="11" fill="#818B98" text-anchor="end">S7、S8、S9 是原有的三张票，其余七张是 2026-11-10 新开的</text></svg>
