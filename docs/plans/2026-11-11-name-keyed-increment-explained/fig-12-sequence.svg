<svg xmlns="http://www.w3.org/2000/svg" width="960" height="719" viewBox="0 0 960 719" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah1F2328" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#1F2328"/></marker><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="719" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="718" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">提资时三方怎么配合</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">实线是调用，虚线是返回。gen-model 只读不写；写提资版本记录的仍然是 rs-server。</text><line x1="92" y1="110" x2="92" y2="607" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="300" y1="110" x2="300" y2="607" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="540" y1="110" x2="540" y2="607" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="730" y1="110" x2="730" y2="607" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="882" y1="110" x2="882" y2="607" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="17" y="76" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="92" y="97.5" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">设计人员 · plant-ui</text><rect x="240" y="76" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="300" y="97.5" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">rs-server</text><rect x="480" y="76" width="120" height="34" rx="6" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.4"/><text x="540" y="97.5" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">gen-model</text><rect x="652" y="76" width="156" height="34" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="730" y="97.5" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">版本记录、待删除记录</text><rect x="830" y="76" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.4"/><text x="882" y="97.5" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">数据中台</text><rect x="109.9" y="124" width="172.2" height="18" fill="#FFFFFF" opacity="0.94"/><text x="196" y="137.5" font-size="12.5" fill="#1F2328">① 发起提资（选中的根节点）</text><path d="M92,147 L300,147" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah1F2328)"/><rect x="308.9" y="165" width="222.2" height="18" fill="#FFFFFF" opacity="0.94"/><text x="420" y="178.5" font-size="12.5" fill="#1F2328">② 按库各问一次：和上一次提资比，哪</text><rect x="385.75" y="183" width="68.5" height="18" fill="#FFFFFF" opacity="0.94"/><text x="420" y="196.5" font-size="12.5" fill="#1F2328">些单元变了</text><path d="M300,206 L540,206" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah1F2328)"/><rect x="555.15" y="224" width="159.7" height="18" fill="#FFFFFF" opacity="0.94"/><text x="635" y="237.5" font-size="12.5" fill="#1F2328">③ 读版本记录、待删除记录</text><rect x="607" y="242" width="56" height="18" fill="#FFFFFF" opacity="0.94"/><text x="635" y="255.5" font-size="12.5" fill="#1F2328">（只读）</text><path d="M540,265 L730,265" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah1F2328)"/><rect x="552" y="283" width="150" height="56" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="627" y="306" font-size="12.5" fill="#1F2328" text-anchor="middle">④ 按会话读库文件，</text><text x="627" y="325" font-size="12.5" fill="#1F2328" text-anchor="middle">按名称对比</text><rect x="308.9" y="353" width="222.2" height="18" fill="#FFFFFF" opacity="0.94"/><text x="420" y="366.5" font-size="12.5" fill="#1F2328">⑤ 每个有真实名字的单元的类别、是否</text><rect x="367" y="371" width="106" height="18" fill="#FFFFFF" opacity="0.94"/><text x="420" y="384.5" font-size="12.5" fill="#1F2328">换号；目标会话号</text><path d="M540,394 L300,394" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ah57606A)"/><rect x="312" y="412" width="204" height="56" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="414" y="435" font-size="12.5" fill="#1F2328" text-anchor="middle">⑥ 逐个单元定发不发：结果里有</text><text x="414" y="454" font-size="12.5" fill="#1F2328" text-anchor="middle">的看类别，没有的照今天的办法</text><rect x="517.4" y="482" width="147.2" height="18" fill="#FFFFFF" opacity="0.94"/><text x="591" y="495.5" font-size="12.5" fill="#1F2328">⑦ 推送要发的单元和删除</text><path d="M300,505 L882,505" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah1F2328)"/><rect x="554.9" y="523" width="72.2" height="18" fill="#FFFFFF" opacity="0.94"/><text x="591" y="536.5" font-size="12.5" fill="#1F2328">⑧ 回执确认</text><path d="M882,546 L300,546" fill="none" stroke="#57606A" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ah57606A)"/><rect x="328.9" y="564" width="372.2" height="18" fill="#FFFFFF" opacity="0.94"/><text x="515" y="577.5" font-size="12.5" fill="#1F2328">⑨ 写版本记录，带上「提资时的会话号」；换了号的转到新参考号</text><path d="M300,587 L730,587" fill="none" stroke="#1F2328" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah1F2328)"/><rect x="20" y="621" width="452" height="78" rx="7" fill="#FFFDF0" stroke="#D4A72C" stroke-width="1.3"/><text x="32" y="642.68" font-size="13" font-weight="700" fill="#1F2328">gen-model 调不通时</text><text x="32" y="665.5" font-size="12.5" fill="#424A53">这一次全部单元照今天的办法（版本记录的状态加指纹）判断，提资照常完成，</text><text x="32" y="685.5" font-size="12.5" fill="#424A53">回执里说明没有用名称口径。</text><rect x="488" y="621" width="452" height="78" rx="7" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.3"/><text x="500" y="642.68" font-size="13" font-weight="700" fill="#1F2328">提资预览</text><text x="500" y="665.5" font-size="12.5" fill="#424A53">走同一条路：plant-ui 调 rs-server 的预览接口，rs-server 再问 gen-model。</text><text x="500" y="685.5" font-size="12.5" fill="#424A53">预览不写任何东西。</text></svg>
