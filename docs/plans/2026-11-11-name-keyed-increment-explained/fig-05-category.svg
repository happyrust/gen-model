<svg xmlns="http://www.w3.org/2000/svg" width="960" height="718" viewBox="0 0 960 718" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="718" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="717" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">类别是怎么判出来的</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">对一个库里的每个真实名字，基准一侧、目标一侧各查一次，顺着下面的问题往下走。</text><rect x="305" y="76" width="350" height="37" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="480" y="99" font-size="12.5" fill="#1F2328" text-anchor="middle">拿一个真实名字，在基准一侧、目标一侧各查一次</text><rect x="355" y="153" width="250" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="480" y="176" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">这个名称两侧都有吗？</text><path d="M480,113 L480,153" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="22" y="125.5" width="240" height="92" rx="6" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1.5"/><text x="32" y="146.18" font-size="13" font-weight="700" fill="#116329">新增</text><text x="32" y="167.82" font-size="12" fill="#424A53">只在目标一侧有。如果这个参考号在基准</text><text x="32" y="185.82" font-size="12" fill="#424A53">一侧叫另一个名字，就是改名：标明由哪</text><text x="32" y="203.82" font-size="12" fill="#424A53">个名字改来。</text><rect x="698" y="134.5" width="240" height="74" rx="6" fill="#FFEBE9" stroke="#FF8182" stroke-width="1.5"/><text x="708" y="155.18" font-size="13" font-weight="700" fill="#A40E26">删除</text><text x="708" y="176.82" font-size="12" fill="#424A53">只在基准一侧有。如果这个参考号现在叫</text><text x="708" y="194.82" font-size="12" fill="#424A53">另一个名字：标明改成了哪个名字。</text><path d="M355,171.5 L262,171.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="269.5" y="151.86" width="78" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="308.5" y="164.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">只在目标一侧</text><path d="M605,171.5 L698,171.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="612.5" y="151.86" width="78" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="651.5" y="164.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">只在基准一侧</text><rect x="355" y="268" width="250" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="480" y="291" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">两侧的类型相同吗？</text><path d="M480,190 L480,268" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="489" y="220.36" width="54" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="516" y="233.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">两侧都有</text><rect x="698" y="249.5" width="240" height="74" rx="6" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1.5"/><text x="708" y="270.18" font-size="13" font-weight="700" fill="#59636E">不配对</text><text x="708" y="291.82" font-size="12" fill="#424A53">旧的那个记删除，新的那个记新增，两行</text><text x="708" y="309.82" font-size="12" fill="#424A53">都标「类型变了」。</text><path d="M605,286.5 L698,286.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="636.5" y="266.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="651.5" y="279.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">不同</text><rect x="355" y="367" width="250" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="480" y="390" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">还在原来的有名祖先、原来的单元下面吗？</text><path d="M480,305 L480,367" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="489" y="327.36" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="504" y="340.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">相同</text><rect x="698" y="339.5" width="240" height="92" rx="6" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/><text x="708" y="360.18" font-size="13" font-weight="700" fill="#7D4E00">修改</text><text x="708" y="381.82" font-size="12" fill="#424A53">挪到了别的属主或别的单元下面。写明旧</text><text x="708" y="399.82" font-size="12" fill="#424A53">的和新的，不拆成一删一增。上级只是改</text><text x="708" y="417.82" font-size="12" fill="#424A53">名，不算。</text><path d="M605,385.5 L698,385.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="630.5" y="365.86" width="42" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="651.5" y="378.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">不在了</text><rect x="355" y="466" width="250" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="480" y="489" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">内容逐项相同吗？</text><path d="M480,404 L480,466" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="489" y="426.36" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="504" y="439.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">还在</text><rect x="22" y="456.5" width="240" height="56" rx="6" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1.5"/><text x="32" y="477.18" font-size="13" font-weight="700" fill="#424A53">未修改</text><text x="32" y="498.82" font-size="12" fill="#424A53">只是参考号换了，也是未修改。</text><rect x="698" y="447.5" width="240" height="74" rx="6" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/><text x="708" y="468.18" font-size="13" font-weight="700" fill="#7D4E00">修改</text><text x="708" y="489.82" font-size="12" fill="#424A53">附变化摘要：哪个属性、第几个成员、顺</text><text x="708" y="507.82" font-size="12" fill="#424A53">序、哪一级上级动了。</text><path d="M355,484.5 L262,484.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="293.5" y="464.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="308.5" y="477.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">相同</text><path d="M605,484.5 L698,484.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="636.5" y="464.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="651.5" y="477.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">不同</text><rect x="20" y="543.5" width="920" height="156" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="565.18" font-size="13" font-weight="700" fill="#1F2328">类别之外</text><rect x="32" y="575.25" width="37" height="20.5" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="39" y="589.64" font-size="11.5" font-weight="600" fill="#6639BA">换号</text><text x="138" y="590" font-size="12.5" fill="#424A53">两侧的参考号不同就标上，带着旧参考号和新参考号。它和类别无关：未修改、修改都可能带。</text><rect x="32" y="605.25" width="60" height="20.5" rx="4" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/><text x="39" y="619.64" font-size="11.5" font-weight="600" fill="#0550AE">从未提资</text><text x="138" y="620" font-size="12.5" fill="#424A53">只在「以上一次提资为基准」时出现：这个单元没有提资过，也没有接替谁。</text><rect x="32" y="635.25" width="37" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="649.64" font-size="11.5" font-weight="600" fill="#59636E">重名</text><text x="138" y="650" font-size="12.5" fill="#424A53">同一侧同一个名称对到多个元素：不配对，单独报出来，所在单元按修改处理。</text><rect x="32" y="665.25" width="48.5" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="679.64" font-size="11.5" font-weight="600" fill="#59636E">判不了</text><text x="138" y="680" font-size="12.5" fill="#424A53">读不出来、没有基准、基准读不回来：一律判修改，不判未修改。</text></svg>
