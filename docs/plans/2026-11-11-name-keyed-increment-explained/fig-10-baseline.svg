<svg xmlns="http://www.w3.org/2000/svg" width="960" height="619" viewBox="0 0 960 619" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="619" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="618" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">以哪一次为基准：逐个单元找，一共六种情形</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">以上一次提资为基准时，对范围里每个有真实名字的单元这样找。提资版本记录由 rs-server 在提资成功时按单元的参考号写。</text><rect x="330" y="76" width="300" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="480" y="99" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">这个单元的参考号有提资版本记录吗？</text><rect x="100" y="153" width="296" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="248" y="176" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">记录上有「提资时的会话号」吗？</text><rect x="596" y="153" width="326" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="759" y="176" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">同库的待删除记录里，有它接替的旧单元吗？</text><path d="M330,94.5 L248,94.5 L248,153" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="280" y="74.86" width="18" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="289" y="87.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">有</text><path d="M630,94.5 L759,94.5 L759,153" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="679.5" y="74.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="694.5" y="87.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">没有</text><rect x="269" y="230" width="236" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="387" y="253" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">指纹里有会话号吗？</text><rect x="22" y="311" width="172" height="98" rx="7" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1.5"/><circle cx="41" cy="329" r="10" fill="#0969DA"/><text x="41" y="333.32" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="58" y="333.5" font-size="12.5" font-weight="700" fill="#0A3069">用「提资时的会话号」</text><text x="32" y="358.32" font-size="12" fill="#424A53">最准。rs-server 在提资成功</text><text x="32" y="376.32" font-size="12" fill="#424A53">时记在版本记录上，是新加</text><text x="32" y="394.32" font-size="12" fill="#424A53">的字段。</text><rect x="208" y="311" width="172" height="98" rx="7" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1.5"/><circle cx="227" cy="329" r="10" fill="#0969DA"/><text x="227" y="333.32" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="244" y="333.5" font-size="12.5" font-weight="700" fill="#0A3069">退回用指纹里的会话号</text><text x="218" y="358.32" font-size="12" fill="#424A53">旧记录才会这样。它是单元</text><text x="218" y="376.32" font-size="12" fill="#424A53">子树最后一次被写的会话。</text><rect x="394" y="311" width="172" height="98" rx="7" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/><circle cx="413" cy="329" r="10" fill="#9A6700"/><text x="413" y="333.32" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="430" y="333.5" font-size="12.5" font-weight="700" fill="#7D4E00">按已修改处理</text><text x="404" y="358.32" font-size="12" fill="#424A53">两个数都没有。标「没有基</text><text x="404" y="376.32" font-size="12" fill="#424A53">准」，重发一次。</text><rect x="580" y="311" width="172" height="98" rx="7" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1.5"/><circle cx="599" cy="329" r="10" fill="#0969DA"/><text x="599" y="333.32" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="616" y="333.5" font-size="12.5" font-weight="700" fill="#0A3069">接替：用旧单元的记录</text><text x="590" y="358.32" font-size="12" fill="#424A53">旧位号等于它的名称、类型</text><text x="590" y="376.32" font-size="12" fill="#424A53">相同、旧参考号有版本记录。</text><text x="590" y="394.32" font-size="12" fill="#424A53">结果标换号。</text><rect x="766" y="311" width="172" height="98" rx="7" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1.5"/><circle cx="785" cy="329" r="10" fill="#1A7F37"/><text x="785" y="333.32" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="802" y="333.5" font-size="12.5" font-weight="700" fill="#116329">从未提资</text><text x="776" y="358.32" font-size="12" fill="#424A53">单元和属于它的行都是新增，</text><text x="776" y="376.32" font-size="12" fill="#424A53">标「从未提资」。</text><path d="M124,190 L124,311" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="99" y="211.86" width="18" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="108" y="224.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">有</text><path d="M360,190 L360,230" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="369" y="201.36" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="384" y="214.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">没有</text><path d="M300,267 L300,311" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="275" y="280.36" width="18" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="284" y="293.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">有</text><path d="M470,267 L470,311" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="479" y="280.36" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="494" y="293.32" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">没有</text><path d="M666,190 L666,311" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="641" y="241.86" width="18" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="650" y="254.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">有</text><path d="M852,190 L852,311" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="861" y="241.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="876" y="254.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">没有</text><line x1="108" y1="409" x2="108" y2="429" stroke="#57606A" stroke-width="1.4"/><line x1="294" y1="409" x2="294" y2="429" stroke="#57606A" stroke-width="1.4"/><line x1="666" y1="409" x2="666" y2="429" stroke="#57606A" stroke-width="1.4"/><line x1="108" y1="429" x2="666" y2="429" stroke="#57606A" stroke-width="1.4"/><rect x="222" y="455" width="330" height="37" rx="18" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1.3"/><text x="387" y="478" font-size="12.5" font-weight="700" fill="#0A3069" text-anchor="middle">这个基准会话还在库文件的会话链上吗？</text><path d="M387,429 L387,455" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="680" y="433.32" font-size="12" fill="#59636E">①、②、⑤ 拿到了基准会话</text><rect x="606" y="442.5" width="330" height="62" rx="7" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/><circle cx="625" cy="460.5" r="10" fill="#9A6700"/><text x="625" y="464.82" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="642" y="465" font-size="12.5" font-weight="700" fill="#7D4E00">按已修改处理</text><text x="616" y="489.82" font-size="12" fill="#424A53">标明原因，重发一次。库的会话被合并过才会这样。</text><path d="M552,473.5 L606,473.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="564" y="453.86" width="30" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="579" y="466.82" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">不在</text><rect x="172" y="542.5" width="430" height="56" rx="6" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1.5"/><text x="387" y="565.5" font-size="12.5" fill="#424A53" text-anchor="middle">拿基准会话和目标会话按名称对比，得出每一行的类别。目标会话取这个</text><text x="387" y="584.5" font-size="12.5" fill="#424A53" text-anchor="middle">库的应用水位，也就是已经写进数据库的那个会话。</text><path d="M387,492 L387,542.5" fill="none" stroke="#57606A" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah57606A)"/><rect x="394" y="508.61" width="18" height="17.28" fill="#FFFFFF" opacity="0.94"/><text x="403" y="521.57" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">在</text></svg>
