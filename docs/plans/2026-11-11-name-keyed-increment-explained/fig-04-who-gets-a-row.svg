14" font-size="11.5" font-weight="600" fill="#6E7781">不在结果里</text><text x="590" y="345.32" font-size="12" fill="#424A53">没有真实名字的单元：整个不出现，提资照今天的办法</text><line x1="478" y1="341" x2="502" y2="341" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="2 3"/><rect x="506" y="366.75" width="37" height="20.5" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="513" y="381.14" font-size="11.5" font-weight="600" fill="#6E7781">不看</text><text x="590" y="381.32" font-size="12" fill="#424A53">往上找不到有名构件就到单元为止，不再往上</text><line x1="478" y1="377" x2="502" y2="377" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="2 3"/><rect x="506" y="402.75" width="48.5" height="20.5" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="513" y="417.14" font-size="11.5" font-weight="600" fill="#0969DA">出一行</text><text x="590" y="417.32" font-size="12" fill="#424A53">只在显式入口出行，所属单元为空；缺省入口不出行</text><line x1="478" y1="413" x2="502" y2="413" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="2 3"/><rect x="506" y="438.75" width="71.5" height="20.5" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="513" y="453.14" font-size="11.5" font-weight="600" fill="#6E7781">不在结果里</text><text x="590" y="453.32" font-size="12" fill="#424A53">自动命名的单元：同样整个不出现</text><line x1="478" y1="449" x2="502" y2="449" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="2 3"/><rect x="506" y="474.75" width="37" height="20.5" rx="4" fill="#F6F8FA" stroke="#AFB8C1" stroke-width="1" stroke-dasharray="4 3"/><text x="513" y="489.14" font-size="11.5" font-weight="600" fill="#6E7781">不看</text><text x="590" y="489.32" font-size="12" fill="#424A53">同上</text><line x1="478" y1="485" x2="502" y2="485" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="2 3"/><text x="940" y="531.96" font-size="11" fill="#818B98" text-anchor="end">树的结构和 /AIOS-SUITE-VALV-X 这个名字为示意</text></svg>
