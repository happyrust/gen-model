<svg xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs></defs><rect x="0" y="0" width="960" height="542" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="541" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">哪些元素出行，哪些被跳过</text><text x="22" y="60.5" font-size="12.5" fill="#59636E">左边是库里的一段树，右边是名称口径对每个元素的做法。「显式入口」指直接给两个会话做对比，「缺省入口」指以上一次提资为基准。</text><rect x="20" y="76" width="464" height="434" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="97.68" font-size="13" font-weight="700" fill="#1F2328">库里的树（示意）</text><rect x="496" y="76" width="444" height="434" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="508" y="97.68" font-size="13" font-weight="700" fill="#0550AE">名称口径怎么对待它</text><rect x="30" y="110" width="444" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="38" y="116" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="43" y="128.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ZONE</text><text x="79.19" y="129.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-8000-Z</text><rect x="50" y="146" width="424" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="58" y="152" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="63" y="164.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">PIPE</text><text x="99.19" y="165.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-PIPE-P</text><rect x="70" y="182" width="404" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="78" y="1