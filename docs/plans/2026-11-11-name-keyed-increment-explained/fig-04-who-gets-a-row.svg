305" stroke="#AFB8C1" stroke-width="1.2"/><line x1="80" y1="233" x2="90" y2="233" stroke="#AFB8C1" stroke-width="1.2"/><line x1="80" y1="269" x2="90" y2="269" stroke="#AFB8C1" stroke-width="1.2"/><line x1="80" y1="305" x2="90" y2="305" stroke="#AFB8C1" stroke-width="1.2"/><rect x="70" y="326" width="404" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="78" y="332" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="83" y="344.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="119.19" y="345.5" font-size="12.5" fill="#6E7781">（无名）</text><rect x="90" y="362" width="384" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="98" y="368" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="103" y="380.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">ELBO</text><text x="139.19" y="381.5" font-size="12.5" fill="#6E7781">（无名）</text><rect x="90" y="398" width="384" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><rect x="98" y="404" width="34.19" height="18" rx="4" fill="#EAEEF2"/><text x="103" y="416.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">VALV</text><text x="139.19" y="417.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-VALV-X</text><line x1="80" y1="356" x2="80" y2="413" stroke="#AFB8C1" stroke-width="1.2"/><line x1="80" y1="377" x2="90" y2="377" stroke="#AFB8C1" stroke-width="1.2"/><line x1="80" y1="413" x2="90" y2="413" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="176" x2="60" y2="341" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="197" x2="70" y2="197" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="341" x2="70" y2="341" stroke="#AFB8C1" stroke-width="1.2"/><rect x="50" y="434" width="424" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="58" y="440" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="63" y="452.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="99.19" y="453.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781">/Copy-of-AIOS-SUITE-EQ-B</text><rect x="276.73" y="439.25" width="56" height="19.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="283.73" y="452.78" font-size="10.5" font-weight="600" fill="#59636E">自动命名</text><rect x="70" y="470" width="404" height="30" rx="6" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.3" stroke-dasharray="5 3"/><rect x="78" y="476" width="28.14" height="18" rx="4" fill="#EAEEF2"/><text x="83" y="488.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="113.14" y="489.5" font-size="12.5" fill="#6E7781">（无名）</text><line x1="60" y1="464" x2="60" y2="485" stroke="#AFB8C1" stroke-width="1.2"/><line x1="60" y1="485" x2="70" y2="485" stroke="#AFB8C1" stroke-width="1.2"/><line x1="40" y1="140" x2="40" y2="449" stroke="#AFB8C1" stroke-width="1.2"/><line x1="40" y1="161" x2="50" y2="161" stroke="#AFB8C1" stroke-width="1.2"/><line x1="40" y1="449" x2="50" y2="449" stroke="#AFB8C1" stroke-width="1.2"/><rect x="506" y="114.75" width="48.5" height="20.5" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="513" y="129.14" font-size="11.5" font-weight="600" fill="#0969DA">出一行</text><text x="590" y="129.32" font-size="12" fill="#424A53">容器。显式入口出行，所属单元为空；缺省入口不出行</text><line x1="478" y1="125" x2="502" y2="125" stroke="#D0D7DE" stroke-width="1.2" stroke-dasharray="2 3"/><rect x="506" y="150.75" width="48.5" height="20.5" rx="4" fill="#FFFFFF" stroke=