<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Segoe UI',sans-serif"><defs><marker id="ah57606A" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#57606A"/></marker></defs><rect x="0" y="0" width="960" height="476" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="959" height="475" fill="none" stroke="#D0D7DE"/><text x="22" y="36.3" font-size="17.5" font-weight="700" fill="#1F2328">一页看懂：名称口径要解决什么、怎么认、谁算、谁用</text><rect x="20" y="54" width="296" height="338" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="75.86" font-size="13.5" font-weight="700" fill="#1F2328">① 今天：按参考号认身份</text><rect x="332" y="54" width="296" height="338" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="344" y="75.86" font-size="13.5" font-weight="700" fill="#0550AE">② 名称口径：按名称认身份</text><rect x="644" y="54" width="296" height="338" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="656" y="75.86" font-size="13.5" font-weight="700" fill="#1F2328">③ 谁算、谁用</text><text x="32" y="102.5" font-size="12.5" fill="#424A53">参考号是 E3D 给每个元素的内部编号。元素删掉</text><text x="32" y="122.5" font-size="12.5" fill="#424A53">再重建，参考号就是新的。</text><rect x="30" y="136" width="276" height="30" rx="6" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/><rect x="38" y="142" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="43" y="154.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="79.19" y="155.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="297" y="155.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26603</text><path d="M60,169 L60,193" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="74" y="185.32" font-size="12" fill="#59636E">整条删掉，再按原样同名重建</text><rect x="30" y="196" width="276" height="30" rx="6" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><rect x="38" y="202" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="43" y="214.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="79.19" y="215.68" font-size="13" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><text x="297" y="215.32" font-size="12" font-family="Consolas,'Cascadia Mono','Courier New',monospace" fill="#6E7781" text-anchor="end">=…/26616</text><text x="32" y="254.5" font-size="12.5" font-weight="700" fill="#1F2328">按参考号看：</text><rect x="116" y="239.5" width="62" height="21" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="123" y="254.32" font-size="12" font-weight="600" fill="#A40E26">旧的全删</text><rect x="184" y="239.5" width="62" height="21" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="191" y="254.32" font-size="12" font-weight="600" fill="#116329">新的全加</text><text x="32" y="284.5" font-size="12.5" fill="#424A53">内容一个字没变，却被当成两件事：单元整个重</text><text x="32" y="304.5" font-size="12.5" fill="#424A53">新生成；提资把新单元当成首次提资再发一遍，</text><text x="32" y="324.5" font-size="12.5" fill="#424A53">旧位号还进了待删除列表。</text><text x="344" y="103.18" font-size="13" font-weight="700" fill="#0A3069">同一个库里，名称（NAME）整串相同，就是</text><text x="344" y="124.18" font-size="13" font-weight="700" fill="#0A3069">同一个构件，不看参考号。</text><rect x="342" y="138" width="276" height="30" rx="6" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><rect x="348" y="144" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="353" y="156.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="388.19" y="157.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">/AIOS-SUITE-BRAN-S</text><rect x="519.9" y="142.75" width="48.5" height="20.5" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="526.9" y="157.14" font-size="11.5" font-weight="600" fill="#424A53">未修改</text><rect x="574.4" y="142.75" width="37" height="20.5" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="581.4" y="157.14" font-size="11.5" font-weight="600" fill="#6639BA">换号</text><text x="344" y="194.5" font-size="12.5" font-weight="700" fill="#1F2328">每个有真实名字的构件一行，带着：</text><rect x="344" y="207.5" width="38" height="21" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="351" y="222.32" font-size="12" font-weight="600" fill="#116329">新增</text><rect x="388" y="207.5" width="38" height="21" rx="4" fill="#FFEBE9" stroke="#FF8182" stroke-width="1"/><text x="395" y="222.32" font-size="12" font-weight="600" fill="#A40E26">删除</text><rect x="432" y="207.5" width="38" height="21" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="439" y="222.32" font-size="12" font-weight="600" fill="#7D4E00">修改</text><rect x="476" y="207.5" width="50" height="21" rx="4" fill="#EAEEF2" stroke="#AFB8C1" stroke-width="1"/><text x="483" y="222.32" font-size="12" font-weight="600" fill="#424A53">未修改</text><text x="616" y="222.32" font-size="12" fill="#59636E" text-anchor="end">类别</text><rect x="344" y="237.5" width="38" height="21" rx="4" fill="#FBEFFF" stroke="#C297FF" stroke-width="1"/><text x="351" y="252.32" font-size="12" font-weight="600" fill="#6639BA">换号</text><rect x="388" y="237.5" width="62" height="21" rx="4" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/><text x="395" y="252.32" font-size="12" font-weight="600" fill="#0550AE">从未提资</text><text x="616" y="252.32" font-size="12" fill="#59636E" text-anchor="end">标注</text><rect x="344" y="269" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="349" y="281.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">BRAN</text><text x="388" y="282.5" font-size="12.5" fill="#424A53">所属的最小交付单元</text><text x="344" y="312.5" font-size="12.5" fill="#424A53">没有名字的、自动命名（Copy-of）的元素不出</text><text x="344" y="332.5" font-size="12.5" fill="#424A53">行，变化算到所属的有名构件上。结果按需算，</text><text x="344" y="352.5" font-size="12.5" fill="#424A53">不落库。</text><rect x="654" y="88" width="276" height="78" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="666" y="109.68" font-size="13" font-weight="700" fill="#1F2328">gen-model</text><rect x="895" y="95" width="25" height="20" rx="4" fill="#424A53" stroke="#424A53" stroke-width="1"/><text x="902" y="108.96" font-size="11" font-weight="600" fill="#FFFFFF">算</text><text x="666" y="132.5" font-size="12.5" fill="#424A53">按名称配对、比内容、给类别。提供一条只读</text><text x="666" y="152.5" font-size="12.5" fill="#424A53">接口。</text><path d="M684,168 L684,192" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="698" y="184.32" font-size="12" fill="#59636E">每个单元的类别、目标会话号</text><rect x="654" y="194" width="276" height="78" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="666" y="215.68" font-size="13" font-weight="700" fill="#1F2328">rs-server</text><rect x="862" y="201" width="58" height="20" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="869" y="214.96" font-size="11" font-weight="600" fill="#0969DA">提资时用</text><text x="666" y="238.5" font-size="12.5" fill="#424A53">未修改的单元跳过，其余照发。结果里没有的</text><text x="666" y="258.5" font-size="12.5" fill="#424A53">单元，照今天的办法判断。</text><path d="M684,274 L684,298" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah57606A)"/><text x="698" y="290.32" font-size="12" fill="#59636E">同一份结果</text><rect x="654" y="300" width="276" height="78" rx="7" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/><text x="666" y="321.68" font-size="13" font-weight="700" fill="#1F2328">plant-ui</text><rect x="862" y="307" width="58" height="20" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="869" y="320.96" font-size="11" font-weight="600" fill="#0969DA">预览时用</text><text x="666" y="344.5" font-size="12.5" fill="#424A53">提资预览按类别分栏：跳过、重发、首次提资、</text><text x="666" y="364.5" font-size="12.5" fill="#424A53">删除。</text><rect x="20" y="406" width="920" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="5 4"/><text x="32" y="430.5" font-size="12.5" fill="#424A53">不变的：现有的增量处理、任务回执、模型生成和落库都不动。换了参考号的构件，内部仍按新参考号重新生成。名称口径省的是重复提资，不省模型生成。</text><text x="940" y="465.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号为示意</text></svg>
