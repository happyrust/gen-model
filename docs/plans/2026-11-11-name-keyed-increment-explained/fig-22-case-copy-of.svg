ia Mono','Courier New',monospace" font-weight="700" fill="#424A53">BOX</text><text x="64.14" y="358.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">=24384/26770</text><rect x="154.61" y="343.75" width="37" height="20.5" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="161.61" y="358.14" font-size="11.5" font-weight="600" fill="#116329">新增</text><rect x="30" y="373" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="35" y="385.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="70.19" y="386.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">=24384/26780</text><rect x="160.66" y="371.75" width="37" height="20.5" rx="4" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/><text x="167.66" y="386.14" font-size="11.5" font-weight="600" fill="#116329">新增</text><rect x="30" y="401" width="34.19" height="18" rx="4" fill="#0969DA"/><text x="35" y="413.96" font-size="11" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="700" fill="#FFFFFF">EQUI</text><text x="70.19" y="414.5" font-size="12.5" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-weight="600" fill="#1F2328">=24384/26551</text><rect x="160.66" y="399.75" width="37" height="20.5" rx="4" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/><text x="167.66" y="414.14" font-size="11.5" font-weight="600" fill="#7D4E00">修改</text><text x="205.66" y="414.32" font-size="12" fill="#59636E">成员表变了</text><text x="32" y="446.5" font-size="12.5" fill="#424A53">两个新增，一个修改。名字是不是 Copy-of 开头，没有区别。</text><rect x="498" y="308" width="442" height="212" rx="8" fill="#F3F9FF" stroke="#54AEFF" stroke-width="1.6"/><text x="510" y="329.68" font-size="13" font-weight="700" fill="#0550AE">按名称看（名称口径）</text><rect x="508" y="345" width="34.19" height="18" rx="4" fill="#0969