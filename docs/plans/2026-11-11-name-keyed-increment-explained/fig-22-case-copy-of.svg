S-SUITE-EQ-A 仍判修改。自</text><text x="510" y="504.5" font-size="12.5" fill="#0A3069">动命名的单元整个不看。</text><rect x="20" y="534" width="920" height="96" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="32" y="555.68" font-size="13" font-weight="700" fill="#1F2328">提资时</text><rect x="32" y="565.75" width="37" height="20.5" rx="4" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/><text x="39" y="580.14" font-size="11.5" font-weight="600" fill="#59636E">今天</text><text x="108" y="580.5" font-size="12.5" fill="#1F2328">/AIOS-SUITE-EQ-A 重发。名字含 Copy-of 的设备，rs-server 本来就不发。</text><rect x="32" y="595.75" width="60" height="20.5" rx="4" fill="#FFFFFF" stroke="#54AEFF" stroke-width="1"/><text x="39" y="610.14" font-size="11.5" font-weight="600" fill="#0969DA">名称口径</text><text x="108" y="610.5" font-size="12.5" fill="#1F2328">/AIOS-SUITE-EQ-A 重发。Copy-of 的设备不在结果里，rs-server 照今天的办法处理：不发。</text><text x="940" y="649.96" font-size="11" fill="#818B98" text-anchor="end">图中的参考号为示意</text></svg>
