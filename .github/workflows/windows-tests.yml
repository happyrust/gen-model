name: Windows tests

# 2026-09-09 布局说明（e3d-io 底座换装后的 CI 形态）：
#
# 本仓的自研依赖是 **path 依赖**，指向仓库外的兄弟目录（Cargo.toml：
# `../vendor/e3d-io`、`../vendor/e3d-attlib`、`../vendor/e3d-model`、
# `../vendor/plant-mbd/crates/plant-mbd`，以及 aios_core 的 [patch] →
# `../vendor/old-aios-core`）。e3d-io 自己又 path 依赖 `../e3d-attlib`，
# 所以它们只能以「并排放在 vendor/ 下」的目录形状存在——git 依赖救不了。
#
# 因此 CI 用多仓 checkout 复刻本地 old/ 的目录形状：
#   $GITHUB_WORKSPACE/
#     gen-model/            ← 本仓（checkout path: gen-model）
#     vendor/e3d-io         ← happyrust/e3d-io
#     vendor/e3d-attlib     ← happyrust/e3d-attlib
#     vendor/e3d-model      ← happyrust/e3d-model
#     vendor/plant-mbd      ← happyrust/plant-mbd
#     vendor/old-aios-core  ← happyrust/old-aios-core
#     target/               ← CARGO_TARGET_DIR（缓存键照旧叫 target）
#
# 兄弟仓是私有仓。`GITHUB_TOKEN` 只能读本仓，拿去拉 happyrust/e3d-io 等会在
# 「Determining the default branch」得到 404 Not Found。检出用仓库 secret
# `GH_PAT`（与 linux 打包同一把、对 happyrust/* 有读权限的 PAT）。
# 跑之前的硬前提：**五个兄弟仓的默认分支必须
# 推到 GitHub 且与本仓当前提交互相兼容**——本地未提交/未推送的 vendor 改动，
# CI 一概看不见。e3d-io 的 `noun_catalog` 会调 `AttlibData::catalogue_value_nouns`，
# e3d-attlib 默认分支须含 `f37be2e`，否则生产构建在 e3d-io 上编不过。
#
# E3D schema 资产（attlib.dat + desvir.dat）不再依赖装机：随仓走
# `tests/fixtures/e3d-templates/`（见该目录 README），AIOS_E3D_TEMPLATE_DIR
# 全局指过去。离线夹具档从此在 GitHub 托管 runner 上完整可跑。

on:
  push:
    branches: [gen-model-refactor, main, e3d-direct]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: ${{ github.workspace }}\target
  # Integration-test builds also compile every binary target. Keep the hosted
  # runner below its paging/commit-memory limit (the repository default is 8x8).
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: -Z threads=2 -C link-arg=/DEBUG:NONE
  RUST_TOOLCHAIN: nightly-2026-08-02
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  CXXFLAGS: /std:c++17
  PROTOC_ARCHIVE_URL: https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-win64.zip
  PROTOC_ARCHIVE_SHA256: 5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082
  # 离线夹具档（db8000 会话链、基线流、读透对拍）要 E3D 模板与 attlib：
  # 用仓内随行副本，不依赖 runner 上有 E3D 装机。
  AIOS_E3D_TEMPLATE_DIR: ${{ github.workspace }}\gen-model\tests\fixtures\e3d-templates

jobs:
  # 离线回归总闸：不需要 E3D 装机、SurrealDB 或任何外部服务的那一档。
  # 现含 增量纯规划契约（pipe/equi/hvac/ctray + model_impact）、issue-019 增量夹具、
  # 通用会话切割自检、db8000 会话对回归、基线流回归、读透行级对拍、
  # 删除清理的 lib 用例，以及整个单测层（cargo test --lib，U1–U13）。
  # （原名 db8000-model-increment，范围早已超出 db8000 一个库。）
  offline-increment-regression:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: gen-model

    steps:
      - uses: actions/checkout@v6
        with:
          path: gen-model

      - name: Require GH_PAT for private vendor repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_PAT)) {
            throw 'secret GH_PAT 未设置：e3d-io / e3d-attlib / e3d-model / plant-mbd / old-aios-core 都是私有仓，GITHUB_TOKEN 读不到'
          }

      # ../vendor 兄弟仓：形状必须与本地 old/vendor 一致（见文件头说明）。
      - name: Check out vendor/e3d-io
        uses: actions/checkout@v6
        with:
          repository: happyrust/e3d-io
          token: ${{ secrets.GH_PAT }}
          path: vendor/e3d-io
      - name: Check out vendor/e3d-attlib
        uses: actions/checkout@v6
        with:
          repository: happyrust/e3d-attlib
          token: ${{ secrets.GH_PAT }}
          path: vendor/e3d-attlib
      - name: Check out vendor/e3d-model
        uses: actions/checkout@v6
        with:
          repository: happyrust/e3d-model
          token: ${{ secrets.GH_PAT }}
          path: vendor/e3d-model
      - name: Check out vendor/plant-mbd
        uses: actions/checkout@v6
        with:
          repository: happyrust/plant-mbd
          token: ${{ secrets.GH_PAT }}
          path: vendor/plant-mbd
      # aios_core 的在途工作在 codex/libgm-snout-caliber 分支上（Cargo.toml [patch]
      # 用本地树、git 依赖 rev 钉在该分支提交），checkout 必须跟着这条分支走，
      # 不能拿 main。分支合回 main 后把这里的 ref 拿掉。
      - name: Check out vendor/old-aios-core
        uses: actions/checkout@v6
        with:
          repository: happyrust/old-aios-core
          token: ${{ secrets.GH_PAT }}
          path: vendor/old-aios-core
          ref: codex/libgm-snout-caliber

      # handlers.rs 用 include_bytes! 把 plant-ui 的 web/public 嵌进二进制。
      # 路径相对 src/web_service，落到本仓库检出目录的同级：$GITHUB_WORKSPACE/plant-ui。
      - name: Check out plant-ui web assets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_PAT)) {
            throw 'secret GH_PAT 未设置：嵌前端资源需要拉取 plant-ui'
          }
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch master "https://x-access-token:$($env:GH_PAT)@github.com/happyrust/plant-ui.git" plant-ui
          git -C plant-ui sparse-checkout set web/public
          $needed = @(
            'web/public/index.html',
            'web/public/config.example.json',
            'web/public/pkg/rs-plant.js',
            'web/public/pkg/rs-plant.d.ts',
            'web/public/pkg/rs-plant_bg.wasm',
            'web/public/pkg/rs-plant_bg.wasm.d.ts',
            'web/public/assets/fonts/AlibabaPuHuiTi-2-55-Regular.ttf',
            'web/public/assets/fonts/AlibabaPuHuiTi-2-65-Medium.ttf',
            'web/public/assets/fonts/AlibabaPuHuiTi-2-75-SemiBold.ttf',
            'web/public/assets/textures/viewport-placeholder.jpg'
          )
          foreach ($rel in $needed) {
            $path = Join-Path plant-ui $rel
            if (-not (Test-Path -LiteralPath $path)) { throw "plant-ui 缺少内嵌资源 $rel" }
          }

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python interfaces
        shell: pwsh
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Install Rust nightly
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - name: Download protoc
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\protoc.zip"
          $root = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest $env:PROTOC_ARCHIVE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:PROTOC_ARCHIVE_SHA256) {
            throw 'protoc archive checksum mismatch'
          }
          Expand-Archive $archive $root
          "PROTOC=$root\bin\protoc.exe" >> $env:GITHUB_ENV

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-windows-tests-${{ hashFiles('gen-model/Cargo.lock') }}
          restore-keys: |
            cargo-windows-tests-

      # Compile-time reachability gate: the production feature set must build while
      # both IncrementPipeline::collect_changes and pdms_io's replay APIs are absent.
      - name: Check production build without legacy session replay
        shell: pwsh
        run: >-
          cargo check --locked
          --bin aios-database
          --no-default-features
          --features ws,gen_model,manifold,project_hd,http_api

      - name: Reject production references to legacy model generation
        shell: pwsh
        run: ./scripts/check-production-no-legacy.ps1

      - name: Compile the explicit legacy model CLI
        shell: pwsh
        run: >-
          cargo check --locked
          --bin legacy_model_gen
          --no-default-features
          --features ws,gen_model,manifold,project_hd,legacy_model

      # old-pdms-io 2026-09-04 整体退出：既没有 feature 门也没有参照臂。这一步是 compile-fail
      # doctest（`collect_changes` 在任何构建里都不存在），下一步是护栏脚本（依赖图 / manifest /
      # 源码三处都不许再提 pdms_io）。
      - name: Prove legacy replay API is absent from production docs build
        shell: pwsh
        run: >-
          cargo test --locked --doc
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          LegacySessionReplayUnavailableInProduction

      - name: Prove old-pdms-io is gone from the workspace
        shell: pwsh
        run: powershell -NoProfile -File scripts\Check-LegacyPdmsIo.ps1

      # old-parse-pdms-db 2026-09-04 随 B9 整体退出：依赖、[patch]、legacy_parse_pdms_db feature、
      # 8 个取证探针与 2 个门后测试一起删。这一步钉的是「不许回来」：依赖图里没有这个包、两份
      # manifest 与源码一处都不许提它、基线编排不含 DbBasicData / member_prune。
      - name: Prove the baseline no longer runs on old-parse-pdms-db
        shell: pwsh
        run: powershell -NoProfile -File scripts\Check-LegacyParsePdmsDb.ps1

      # 增量纯规划契约：四个学科（管道 / 设备 / HVAC / 电缆桥架）的
      # 「变化元素 → 生成根 → 窗口去向」矩阵 + 模型影响门。不接 E3D、不接库、
      # 不要任何夹具，动 generation_root / window_root_plan / model_update_plan /
      # model_impact 的回归第一时间在这里红。
      - name: Run pure planner-contract increment cases
        shell: pwsh
        run: >-
          cargo test --locked
          --test pipe26229_increment
          --test equi_increment
          --test hvac_bran_increment
          --test ctray_increment
          --test model_impact
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      - name: Run portable db8000 model-increment cases
        shell: pwsh
        run: >-
          cargo test --locked
          --test db8000_two_delete_fixture
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      # Reuses the issue-019 archive: the generic cutter must reproduce its
      # recorded history byte for byte, so a regression in the shared session
      # tooling fails here instead of surfacing later as a bad new fixture.
      - name: Replay issue-019 history with the generic session cutter
        shell: pwsh
        run: >-
          cargo test --locked
          --test db_session_fixture_selfcheck
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      # 阶段三（方案 §3）：数据驱动的会话对回归。夹具来源是运行时从 issue-019
      # 的 final 现场 pack 出来的那一份——真实录制到货后改指 AIOS_SESSION_FIXTURE
      # 即可，断言不动。KEEP 让台账落在工作区，失败时随 artifact 传出来比对。
      - name: Run db8000 session-pair regression
        shell: pwsh
        env:
          AIOS_SESSION_FIXTURE_KEEP: ${{ github.workspace }}\artifacts\session-fixture
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          cargo test --locked `
            --test db8000_session_pairs `
            --no-default-features `
            --features ws,gen_model,manifold,project_hd `
            -- --nocapture 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\artifacts\session-pairs.log"
          if ($LASTEXITCODE -ne 0) { throw "db8000_session_pairs failed ($LASTEXITCODE)" }

      # 远程红了以后，光看断言文本还原不出当时那份台账；把 manifest / SHA256SUMS
      # 与完整输出一起带出来，才能在本地拿同一批散列对账。
      - name: Upload session-pair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db8000-session-pairs-diagnostics
          path: |
            artifacts/session-pairs.log
            artifacts/session-fixture/manifest.json
            artifacts/session-fixture/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      # B8.5 第 2 条：基线退化窗口在真实 db8000 会话链上的离线回归（幽灵/遗漏、
      # 分块、真会话号 F7、双读口对拍），加读透行级对拍（G2/R2）。两者都吃
      # AIOS_E3D_TEMPLATE_DIR 的仓内模板副本。
      - name: Run baseline-stream and read-through regressions
        shell: pwsh
        run: >-
          cargo test --locked
          --test baseline_stream_8000
          --test read_through_rows_parity
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      - name: Verify topmost model delete cleanup
        shell: pwsh
        run: >-
          cargo test --locked --lib
          child_delete_then_parent_delete_across_sessions_schedules_only_the_parent
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      # 单测层总闸（增量单测总纲 §3 的 CI 特性口径）：纯函数、源码契约与
      # 进程内 kv-mem 三层，U1–U13 全组。#[ignore] 的 live 用例照常跳过。
      - name: Run the unit-test layer (cargo test --lib)
        shell: pwsh
        run: >-
          cargo test --locked --lib
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

  # PyO3 绑定（python/）：建 abi3 wheel + 跑离线档 pytest。
  #
  # 只跑 `-m offline` 那一档——它不连 SurrealDB、不碰 E3D 装机、不扫项目目录，
  # 数据全来自仓内 issue-019 会话快照夹具。房间增量档要 bin/surreal.exe 与
  # testbed 项目副本，留在本地跑（见 python/README.md）。
  #
  # 绑定按 Q7 决策钉死「与服务同一套默认 feature」的单一构建形态。OCC 摘除
  # （specs/009 X1a/X1b）之后这套 feature 不再链任何外部原生库，OCCT provisioning
  # 随之删除。
  python-bindings:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: gen-model

    steps:
      - uses: actions/checkout@v6
        with:
          path: gen-model

      - name: Require GH_PAT for private vendor repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_PAT)) {
            throw 'secret GH_PAT 未设置：e3d-io / e3d-attlib / e3d-model / plant-mbd / old-aios-core 都是私有仓，GITHUB_TOKEN 读不到'
          }

      - name: Check out vendor/e3d-io
        uses: actions/checkout@v6
        with:
          repository: happyrust/e3d-io
          token: ${{ secrets.GH_PAT }}
          path: vendor/e3d-io
      - name: Check out vendor/e3d-attlib
        uses: actions/checkout@v6
        with:
          repository: happyrust/e3d-attlib
          token: ${{ secrets.GH_PAT }}
          path: vendor/e3d-attlib
      - name: Check out vendor/e3d-model
        uses: actions/checkout@v6
        with:
          repository: happyrust/e3d-model
          token: ${{ secrets.GH_PAT }}
          path: vendor/e3d-model
      - name: Check out vendor/plant-mbd
        uses: actions/checkout@v6
        with:
          repository: happyrust/plant-mbd
          token: ${{ secrets.GH_PAT }}
          path: vendor/plant-mbd
      # 同上：aios_core 在途工作在 codex/libgm-snout-caliber 分支上。
      - name: Check out vendor/old-aios-core
        uses: actions/checkout@v6
        with:
          repository: happyrust/old-aios-core
          token: ${{ secrets.GH_PAT }}
          path: vendor/old-aios-core
          ref: codex/libgm-snout-caliber

      # handlers.rs 用 include_bytes! 把 plant-ui 的 web/public 嵌进二进制。
      # 路径相对 src/web_service，落到本仓库检出目录的同级：$GITHUB_WORKSPACE/plant-ui。
      - name: Check out plant-ui web assets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_PAT)) {
            throw 'secret GH_PAT 未设置：嵌前端资源需要拉取 plant-ui'
          }
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch master "https://x-access-token:$($env:GH_PAT)@github.com/happyrust/plant-ui.git" plant-ui
          git -C plant-ui sparse-checkout set web/public
          $needed = @(
            'web/public/index.html',
            'web/public/config.example.json',
            'web/public/pkg/rs-plant.js',
            'web/public/pkg/rs-plant.d.ts',
            'web/public/pkg/rs-plant_bg.wasm',
            'web/public/pkg/rs-plant_bg.wasm.d.ts',
            'web/public/assets/fonts/AlibabaPuHuiTi-2-55-Regular.ttf',
            'web/public/assets/fonts/AlibabaPuHuiTi-2-65-Medium.ttf',
            'web/public/assets/fonts/AlibabaPuHuiTi-2-75-SemiBold.ttf',
            'web/public/assets/textures/viewport-placeholder.jpg'
          )
          foreach ($rel in $needed) {
            $path = Join-Path plant-ui $rel
            if (-not (Test-Path -LiteralPath $path)) { throw "plant-ui 缺少内嵌资源 $rel" }
          }

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust nightly
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc --version

      - name: Download protoc
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\protoc.zip"
          $root = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest $env:PROTOC_ARCHIVE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:PROTOC_ARCHIVE_SHA256) {
            throw 'protoc archive checksum mismatch'
          }
          Expand-Archive $archive $root
          "PROTOC=$root\bin\protoc.exe" >> $env:GITHUB_ENV

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-python-bindings-${{ hashFiles('gen-model/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-python-bindings-${{ hashFiles('gen-model/Cargo.lock') }}-
            cargo-python-bindings-

      - name: Install maturin and pytest
        shell: pwsh
        run: python -m pip install --upgrade "maturin>=1.7,<2" "pytest>=8"

      - name: Build abi3 wheel
        shell: pwsh
        working-directory: gen-model/python
        run: maturin build --locked --out "$env:CARGO_TARGET_DIR\wheels"

      # 键里带 run_id：失败轮也把编译进度存下来，重试从断点继续。
      - name: Save cargo cache
        if: always() && steps.cargo-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-python-bindings-${{ hashFiles('gen-model/Cargo.lock') }}-${{ github.run_id }}

      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:CARGO_TARGET_DIR\wheels\*.whl" | Select-Object -First 1
          if (-not $wheel) { throw 'maturin 没有产出 wheel' }
          python -m pip install --force-reinstall $wheel.FullName

      # 先单独试一次 import：加载失败会让整档 60+ 条用例一起变成同一条错误，
      # 噪声盖过信号。OCC 摘除后扩展不再链外部原生库，一句真 import 就够了；
      # 原先那套读 PE 导入表递归找缺失 DLL 的探针是为 OCCT 写的，随它一起删。
      - name: Smoke-import the extension
        shell: pwsh
        run: |
          python -c "import aios_db; print('import ok:', ' '.join(sorted(aios_db.__all__)))"
          if ($LASTEXITCODE -ne 0) { throw "import aios_db failed ($LASTEXITCODE)" }

      - name: Run offline binding tests
        shell: pwsh
        working-directory: gen-model/python
        run: python -m pytest -m offline -q

      - name: Upload wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-db-wheel
          path: ${{ github.workspace }}\target\wheels\*.whl
          if-no-files-found: warn
          retention-days: 30
