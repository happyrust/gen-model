name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target
  # Integration-test builds also compile every binary target. Keep the hosted
  # runner below its paging/commit-memory limit (the repository default is 8x8).
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: -Z threads=2 -C link-arg=/DEBUG:NONE
  RUST_TOOLCHAIN: nightly-2026-08-02
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  CXXFLAGS: /std:c++17
  PROTOC_ARCHIVE_URL: https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-win64.zip
  PROTOC_ARCHIVE_SHA256: 5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082

jobs:
  # 离线回归总闸：不需要 E3D、SurrealDB 或任何外部服务的那一档。
  # 现含 issue-019 增量夹具、通用会话切割自检、db8000 会话对回归、
  # PDMS 记录边界解析、以及删除清理的 lib 用例。
  # （原名 db8000-model-increment，范围早已超出 db8000 一个库。）
  offline-increment-regression:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python interfaces
        shell: pwsh
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Install Rust nightly
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - name: Download protoc
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\protoc.zip"
          $root = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest $env:PROTOC_ARCHIVE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:PROTOC_ARCHIVE_SHA256) {
            throw 'protoc archive checksum mismatch'
          }
          Expand-Archive $archive $root
          "PROTOC=$root\bin\protoc.exe" >> $env:GITHUB_ENV

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-windows-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-tests-

      # Compile-time reachability gate: the production feature set must build while
      # both IncrementPipeline::collect_changes and pdms_io's replay APIs are absent.
      - name: Check production build without legacy session replay
        shell: pwsh
        run: >-
          cargo check --locked
          --bin aios-database
          --no-default-features
          --features ws,gen_model,manifold,project_hd,http_api

      - name: Prove legacy replay API is absent from production docs build
        shell: pwsh
        run: >-
          cargo test --locked --doc
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          LegacySessionReplayUnavailableInProduction

      - name: Run portable db8000 model-increment cases
        shell: pwsh
        run: >-
          cargo test --locked
          --test db8000_two_delete_fixture
          --no-default-features
          --features ws,gen_model,manifold,project_hd,legacy_session_replay
          -- --nocapture

      # Reuses the issue-019 archive: the generic cutter must reproduce its
      # recorded history byte for byte, so a regression in the shared session
      # tooling fails here instead of surfacing later as a bad new fixture.
      - name: Replay issue-019 history with the generic session cutter
        shell: pwsh
        run: >-
          cargo test --locked
          --test db_session_fixture_selfcheck
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      # 阶段三（方案 §3）：数据驱动的会话对回归。夹具来源是运行时从 issue-019
      # 的 final 现场 pack 出来的那一份——真实录制到货后改指 AIOS_SESSION_FIXTURE
      # 即可，断言不动。KEEP 让台账落在工作区，失败时随 artifact 传出来比对。
      - name: Run db8000 session-pair regression
        shell: pwsh
        env:
          AIOS_SESSION_FIXTURE_KEEP: ${{ github.workspace }}\artifacts\session-fixture
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          cargo test --locked `
            --test db8000_session_pairs `
            --no-default-features `
            --features ws,gen_model,manifold,project_hd,legacy_session_replay `
            -- --nocapture 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\artifacts\session-pairs.log"
          if ($LASTEXITCODE -ne 0) { throw "db8000_session_pairs failed ($LASTEXITCODE)" }

      # 远程红了以后，光看断言文本还原不出当时那份台账；把 manifest / SHA256SUMS
      # 与完整输出一起带出来，才能在本地拿同一批散列对账。
      - name: Upload session-pair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db8000-session-pairs-diagnostics
          path: |
            artifacts/session-pairs.log
            artifacts/session-fixture/manifest.json
            artifacts/session-fixture/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

      - name: Check PDMS record-boundary parsing
        shell: pwsh
        run: >-
          cargo test --locked
          --test pdms_record_boundary
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

      - name: Verify topmost model delete cleanup
        shell: pwsh
        run: >-
          cargo test --locked --lib
          child_delete_then_parent_delete_across_sessions_schedules_only_the_parent
          --no-default-features
          --features ws,gen_model,manifold,project_hd
          -- --nocapture

  # PyO3 绑定（python/）：建 abi3 wheel + 跑离线档 pytest。
  #
  # 只跑 `-m offline` 那一档——它不连 SurrealDB、不碰 E3D 装机、不扫项目目录，
  # 数据全来自仓内 issue-019 会话快照夹具。房间增量档要 bin/surreal.exe 与
  # testbed 项目副本，留在本地跑（见 python/README.md）。
  #
  # 绑定按 Q7 决策钉死「与服务同一套默认 feature」的单一构建形态，所以这里必须
  # 备齐 OCCT——provisioning 与 windows-binary.yml 逐字同款，那边升级版本时这边
  # 跟着改（两处 OCC_* 环境变量）。
  python-bindings:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      # 绑定的 cdylib 与主 crate 共享编译产物；给绝对路径，免得 maturin 在
      # python/ 目录下跑时把 target 落到 python/target 而错过缓存。
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      OCC_VERSION: 7.9.3
      OCC_ARCHIVE_URL: https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64-combined.zip
      OCC_ARCHIVE_SHA256: afbef3457fbc4a2bdca0608e0fe284392f51e4c2c42ccbfb9df7168d8e4eb9b3

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust nightly
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc --version

      - name: Download prebuilt OpenCASCADE
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\occt.zip"
          $extract = "$env:RUNNER_TEMP\occt-extract"
          $source = "$extract\opencascade-$env:OCC_VERSION-vc14-64"
          $root = "$env:RUNNER_TEMP\occt"
          Invoke-WebRequest $env:OCC_ARCHIVE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:OCC_ARCHIVE_SHA256) {
            throw 'OpenCASCADE archive checksum mismatch'
          }
          New-Item -ItemType Directory -Force $extract, "$root\include\opencascade", "$root\lib", "$root\bin" | Out-Null
          # 三方 bin 全量取，不再逐个点名：windows-binary.yml 只点了 tbb12 与
          # jemalloc，那边够用是因为它只编译打包、从不真的加载；这里要 import
          # 扩展，TK*.dll 的**传递**依赖（tbbmalloc / freetype 等）少一个就是
          # "DLL load failed"，而错误信息不会告诉你少的是哪个。
          tar -xf $archive -C $extract `
            "opencascade-$env:OCC_VERSION-vc14-64/inc/*" `
            "opencascade-$env:OCC_VERSION-vc14-64/win64/vc14/lib/*" `
            "opencascade-$env:OCC_VERSION-vc14-64/win64/vc14/bin/*" `
            '3rdparty-vc14-64/*/bin/*'
          Copy-Item "$source\inc\*" "$root\include\opencascade" -Recurse
          Copy-Item "$source\win64\vc14\lib\*" "$root\lib"
          Copy-Item "$source\win64\vc14\bin\*" "$root\bin"
          # 匹配 bin 及其子目录：OpenVR 装在 `openvr-*/bin/win64/openvr_api.dll`，
          # 只认「直接位于 bin 下」会把它漏掉——而 TKService.dll 正依赖它，
          # 缺了就是 import 时那句不说名字的 "DLL load failed"（实测踩到）。
          Get-ChildItem "$extract\3rdparty-vc14-64" -Recurse -Filter *.dll |
            Where-Object { $_.DirectoryName -match '\\bin(\\|$)' } |
            Copy-Item -Destination "$root\bin" -Force
          "OCC_ROOT=$root" >> $env:GITHUB_ENV
          # 运行期也要找得到 TK*.dll：包装层按 PATH 逐目录 os.add_dll_directory。
          "$root\bin" >> $env:GITHUB_PATH

      - name: Download protoc
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\protoc.zip"
          $root = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest $env:PROTOC_ARCHIVE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:PROTOC_ARCHIVE_SHA256) {
            throw 'protoc archive checksum mismatch'
          }
          Expand-Archive $archive $root
          "PROTOC=$root\bin\protoc.exe" >> $env:GITHUB_ENV

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-python-bindings-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-python-bindings-${{ hashFiles('Cargo.lock') }}-
            cargo-python-bindings-

      - name: Install maturin and pytest
        shell: pwsh
        run: python -m pip install --upgrade "maturin>=1.7,<2" "pytest>=8"

      - name: Build abi3 wheel
        shell: pwsh
        working-directory: python
        run: maturin build --locked --out "$env:CARGO_TARGET_DIR\wheels"

      # 键里带 run_id：失败轮也把编译进度存下来，重试从断点继续。
      - name: Save cargo cache
        if: always() && steps.cargo-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-python-bindings-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:CARGO_TARGET_DIR\wheels\*.whl" | Select-Object -First 1
          if (-not $wheel) { throw 'maturin 没有产出 wheel' }
          python -m pip install --force-reinstall $wheel.FullName

      # 先单独试一次 import：DLL 缺失会让整档 60+ 条用例一起变成同一条
      # "DLL load failed"，噪声盖过信号。这一步失败就直接把 OCC bin 的清单打出来，
      # 下一轮不用靠猜。
      - name: Smoke-import the extension
        shell: pwsh
        run: |
          # "DLL load failed" 不说是哪个 DLL，所以逐个点名地试：先确认 OCC bin
          # 在 PATH 上（包装层按 PATH 注册 DLL 目录），再按 pyd 的直接依赖清单
          # （dumpbin 实测的 16 个 TK）逐个裸名加载，第一个失败的就是缺口。
          $probe = @'
          import os, struct, sys, sysconfig


          def pe_imports(path):
              """读 PE 导入表，列出这个模块直接依赖哪些 DLL（不依赖 dumpbin）。"""
              data = open(path, "rb").read()
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              coff = pe + 4
              sections, = struct.unpack_from("<H", data, coff + 2)
              opt_size, = struct.unpack_from("<H", data, coff + 16)
              opt = coff + 20
              magic, = struct.unpack_from("<H", data, opt)
              imp_rva, = struct.unpack_from("<I", data, opt + (112 if magic == 0x20B else 96) + 8)
              table = []
              for i in range(sections):
                  base = opt + opt_size + i * 40
                  vsz, va, _sz, raw = struct.unpack_from("<IIII", data, base + 8)
                  table.append((va, max(vsz, 1), raw))

              def at(rva):
                  for va, vsz, raw in table:
                      if va <= rva < va + vsz:
                          return raw + (rva - va)
                  return None

              names, off = [], at(imp_rva)
              while off is not None:
                  desc = data[off:off + 20]
                  if len(desc) < 20 or not any(desc):
                      break
                  name_rva, = struct.unpack_from("<I", desc, 12)
                  if not name_rva:
                      break
                  start = at(name_rva)
                  names.append(data[start:data.index(b"\x00", start)].decode("ascii"))
                  off += 20
              return names


          # wheel 安装在 purelib 下；本地 `maturin develop` 是 editable，包在源码树里。
          # find_spec 只定位不执行 __init__，所以 import 失败时它依然给得出路径。
          pyd = os.path.join(sysconfig.get_paths()["purelib"], "aios_db", "_aios_db.pyd")
          if not os.path.isfile(pyd):
              import importlib.util
              spec = importlib.util.find_spec("aios_db")
              for root in (spec.submodule_search_locations if spec else []) or []:
                  candidate = os.path.join(root, "_aios_db.pyd")
                  if os.path.isfile(candidate):
                      pyd = candidate
                      break
          print("pyd exists    =", os.path.isfile(pyd), pyd)
          occ_bin = os.path.join(os.environ.get("OCC_ROOT", ""), "bin")
          print("OCC bin       =", occ_bin, os.path.isdir(occ_bin))
          print("occt on PATH  =", [p for p in os.environ.get("PATH", "").split(os.pathsep)
                                    if "occt" in p.lower()])

          # 与 aios_db/__init__.py 的 _add_native_dll_dirs 同款：注册 PATH 上每个目录。
          # 只注册 OCC bin 是不够的——TK*.dll 自己还要三方 DLL，本机上它们散在别处，
          # 那样探针会在能正常 import 的机器上也误报。
          search = []
          for entry in os.environ.get("PATH", "").split(os.pathsep):
              entry = entry.strip().strip('"')
              if entry and os.path.isdir(entry):
                  try:
                      os.add_dll_directory(entry)
                      search.append(entry)
                  except OSError:
                      pass
          search += [os.path.dirname(sys.executable), os.path.join(os.environ.get("SystemRoot", r"C:\Windows"), "System32")]

          def locate(dll):
              for directory in search:
                  candidate = os.path.join(directory, dll)
                  if os.path.isfile(candidate):
                      return candidate
              return None


          if os.path.isfile(pyd):
              # 必须递归：上一轮实测「38 个直接依赖全部就位、import 依然失败」，
              # 说明缺口在传递层（TK*.dll 自己的依赖），只查一层看不见。
              seen, missing, walked = set(), [], 0
              stack = [(pyd, "<pyd>")]
              while stack:
                  current, why = stack.pop()
                  walked += 1
                  try:
                      deps = pe_imports(current)
                  except Exception as error:
                      print("  (无法解析", current, "->", error, ")")
                      continue
                  for dll in deps:
                      key = dll.lower()
                      if key.startswith("api-ms-win") or key in seen:
                          continue  # API set 由系统转发，不落地成文件
                      seen.add(key)
                      found = locate(dll)
                      if found is None:
                          missing.append((dll, os.path.basename(current)))
                      else:
                          stack.append((found, dll))
              print("modules walked:", walked, "| distinct deps:", len(seen))
              print("NOT FOUND     :", missing or "<none>")

          try:
              import aios_db
              print("import ok:", " ".join(sorted(aios_db.__all__)))
          except Exception as error:
              print("import failed:", error)
              sys.exit(1)
          '@
          $probePath = Join-Path $env:RUNNER_TEMP 'dll_probe.py'
          Set-Content -LiteralPath $probePath -Value $probe -Encoding utf8
          Write-Host "OCC bin DLL 数: $((Get-ChildItem "$env:OCC_ROOT\bin\*.dll").Count)"
          python $probePath
          if ($LASTEXITCODE -ne 0) { throw "import aios_db failed ($LASTEXITCODE)" }

      - name: Run offline binding tests
        shell: pwsh
        working-directory: python
        run: python -m pytest -m offline -q

      - name: Upload wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-db-wheel
          path: ${{ github.workspace }}\target\wheels\*.whl
          if-no-files-found: warn
          retention-days: 30
