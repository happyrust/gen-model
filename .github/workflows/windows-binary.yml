name: Windows binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml 把 target-dir 指到仓库外（../target）；CI 里收回工作区内，
  # 缓存与打包路径才能对上。环境变量优先级高于 config 文件。
  CARGO_TARGET_DIR: target
  # 代码用了一批 #![feature(...)]，.cargo/config.toml 还带 -Z threads=8：必须 nightly。
  # 固定到与本地开发一致、已知可编译的版本；要升级只改这一行。
  RUST_TOOLCHAIN: nightly-2026-08-02
  # occt-rs currently targets OCCT 7.x; the rolling runner catalog moved to
  # OCCT 8 and removed compatibility typedefs used by its C++ bridge.
  VCPKG_COMMIT: 1f4491421b15fc95aef0ba1df3410d2626edb62d
  # manifold-sys 的 bindgen 要 libclang。不显式给，.cargo/config.toml 会填进
  # runner 上不存在的 D:\LLVM\bin，clang-sys 见到无效路径直接报错不再探测。
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  # OpenCASCADE 7.9 headers use std::optional/std::variant; cc-rs otherwise
  # inherits MSVC's older default language mode on the hosted runner.
  CXXFLAGS: /std:c++17

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - name: Pin vcpkg catalog
        shell: pwsh
        run: |
          git -C $env:VCPKG_INSTALLATION_ROOT fetch origin $env:VCPKG_COMMIT --depth 1
          git -C $env:VCPKG_INSTALLATION_ROOT checkout --force $env:VCPKG_COMMIT
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-occ-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg-triplets/**') }}
          restore-keys: vcpkg-occ-${{ env.VCPKG_COMMIT }}-

      - name: Install OpenCASCADE
        shell: pwsh
        run: |
          vcpkg install opencascade:x64-windows-release `
            --overlay-triplets="$env:GITHUB_WORKSPACE\.github\vcpkg-triplets"
          "OCC_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-release" >> $env:GITHUB_ENV

      # OCC 一次要编 ~50 分钟，而失败的 job 不会执行 actions/cache 的 post 保存。
      # 装完立刻显式落缓存：后面 cargo 再失败，这 50 分钟也不用重来。
      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\installed
            ~\AppData\Local\vcpkg\archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-release-${{ hashFiles('Cargo.lock') }}-
            cargo-release-

      - name: Build release binary
        run: >-
          cargo build --release --locked --bin aios-database
          --no-default-features
          --features ws,gen_model,manifold,occ,project_hd,http_api

      # 键里带 run_id：失败轮也把编译进度存下来，重试从断点继续。
      - name: Save cargo cache
        if: always() && steps.cargo-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

      - name: Package binary
        shell: pwsh
        run: |
          $out = "dist/aios-database-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/aios-database.exe $out
          Get-ChildItem "$env:OCC_ROOT/bin/*.dll" | Copy-Item -Destination $out
          @"
          commit=$env:GITHUB_SHA
          ref=$env:GITHUB_REF
          built_at=$([DateTime]::UtcNow.ToString('O'))
          target=x86_64-pc-windows-msvc
          "@ | Set-Content "$out/BUILD.txt" -Encoding utf8

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: aios-database-windows-x64
          path: dist/aios-database-windows-x64
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive dist/aios-database-windows-x64 `
            "dist/aios-database-windows-x64-$env:GITHUB_REF_NAME.zip"
          gh release create $env:GITHUB_REF_NAME `
            "dist/aios-database-windows-x64-$env:GITHUB_REF_NAME.zip" `
            --generate-notes --verify-tag
