name: Linux binary

# 目标：在 ubuntu runner 上构出 aios-database 的 x86_64-linux 可执行文件，供 123.57.182.243 部署。
# 与 windows-binary.yml 的差别有三处：一是 path 依赖的五个 vendor 仓要自己克隆到 ../vendor
# （windows 那条从 2026-09-11 起就是因为少了这一步在 34 秒里挂掉的），二是 plant-ui 的
# web/public 要落在同级目录（web_service 用 include_bytes! 嵌它），三是 protoc / libclang
# 换成 linux 版。工具链版本、feature 组合与 windows 那条保持一致。

on:
  # workflow_dispatch 只认默认分支上的 workflow，这条还没并回去；push 触发按被推的那个
  # commit 上的定义跑，所以调这条链的期间靠 push 触发。
  push:
    branches: ['ci/linux-build-*']
  workflow_dispatch:
    inputs:
      vendor_ref:
        description: '五个 vendor 仓统一使用的分支或提交'
        required: false
        default: 'ci/gen-model-linux-20260918'
        type: string
      plant_ui_ref:
        description: 'plant-ui（web_service 内嵌的前端资源）使用的分支或提交'
        required: false
        default: 'ci/gen-model-linux-20260918'
        type: string

permissions:
  contents: read

concurrency:
  group: linux-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml 把 target-dir 指到仓库外（../target）；CI 里收回工作区内，
  # 缓存与打包路径才能对上。环境变量优先级高于 config 文件。
  CARGO_TARGET_DIR: target
  RUST_TOOLCHAIN: nightly-2026-08-02
  PROTOC_ARCHIVE_URL: https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
  VENDOR_REF: ${{ inputs.vendor_ref || 'ci/gen-model-linux-20260918' }}
  PLANT_UI_REF: ${{ inputs.plant_ui_ref || 'ci/gen-model-linux-20260918' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout gen-model
        uses: actions/checkout@v4
        with:
          path: gen-model

      # Cargo.toml 用 path = "../vendor/..." 吃五个仓，其中四个是私有的，GITHUB_TOKEN 够不着。
      - name: Checkout vendor path dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "secret GH_PAT 未设置：e3d-model / e3d-io / e3d-attlib / plant-mbd 都是私有仓，克隆不下来" >&2
            exit 1
          fi
          mkdir -p vendor
          for repo in e3d-model e3d-io e3d-attlib plant-mbd old-aios-core; do
            git clone --quiet --depth 1 --branch "${VENDOR_REF}" \
              "https://x-access-token:${GH_PAT}@github.com/happyrust/${repo}.git" "vendor/${repo}"
            echo "${repo} -> $(git -C "vendor/${repo}" rev-parse --short HEAD)"
          done

      # web_service/handlers.rs 用 include_bytes! 把 plant-ui 的 web/public 整个嵌进二进制，
      # 路径是 ../../../plant-ui/...，即 gen-model 检出目录的同级。只要 web/public 这一棵，
      # 所以走 blob:none + sparse——整仓 240 MB，这样只拉这十个文件。
      - name: Checkout plant-ui web assets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            --branch "${PLANT_UI_REF}" \
            "https://x-access-token:${GH_PAT}@github.com/happyrust/plant-ui.git" plant-ui
          git -C plant-ui sparse-checkout set web/public
          echo "plant-ui -> $(git -C plant-ui rev-parse --short HEAD)"
          for f in index.html config.example.json \
                   pkg/plant_ui_app.js pkg/plant_ui_app.d.ts \
                   pkg/plant_ui_app_bg.wasm pkg/plant_ui_app_bg.wasm.d.ts \
                   assets/fonts/AlibabaPuHuiTi-2-55-Regular.ttf \
                   assets/fonts/AlibabaPuHuiTi-2-65-Medium.ttf \
                   assets/fonts/AlibabaPuHuiTi-2-75-SemiBold.ttf \
                   assets/textures/viewport-placeholder.jpg; do
            [ -f "plant-ui/web/public/$f" ] || { echo "缺 plant-ui/web/public/$f，include_bytes! 会编不过" >&2; exit 1; }
          done
          du -sh plant-ui/web/public

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libssl-dev unzip
          # manifold-sys 的 bindgen 要 libclang；.cargo/config.toml 里填的是 runner 上不存在的
          # D:\LLVM\bin，force = false 所以这里给的环境变量说了算。
          libclang_dir="$(dirname "$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit)")"
          echo "LIBCLANG_PATH=${libclang_dir}" >> "$GITHUB_ENV"
          echo "libclang: ${libclang_dir}"

      - name: Install protoc
        run: |
          set -euo pipefail
          curl -fsSL "$PROTOC_ARCHIVE_URL" -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          chmod +x /tmp/protoc/bin/protoc
          echo "PROTOC=/tmp/protoc/bin/protoc" >> "$GITHUB_ENV"
          /tmp/protoc/bin/protoc --version

      - name: Install Rust nightly (pinned)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gen-model/target
          key: cargo-linux-release-${{ hashFiles('gen-model/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-linux-release-${{ hashFiles('gen-model/Cargo.lock') }}-
            cargo-linux-release-

      - name: Build release binary
        working-directory: gen-model
        env:
          # rustix 0.37 的 linux_raw 后端用 rustc_layout_scalar_valid_range_* 这类内部属性，
          # 在这条 nightly 上直接「cannot find attribute」；官方逃生口是改走 libc 后端。
          # windows 侧走的是另一套后端，所以那条 workflow 撞不上。
          # RUSTFLAGS 一旦给了就整体顶掉 .cargo/config.toml 的 build.rustflags，-Z threads=8 要带回来。
          RUSTFLAGS: "-Z threads=8 --cfg rustix_use_libc"
        run: >-
          cargo build --release --bin aios-database
          --no-default-features
          --features ws,gen_model,manifold,project_hd,http_api

      # 键里带 run_id：失败轮也把编译进度存下来，重试从断点继续。
      - name: Save cargo cache
        if: always() && steps.cargo-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gen-model/target
          key: cargo-linux-release-${{ hashFiles('gen-model/Cargo.lock') }}-${{ github.run_id }}

      - name: Package binary
        run: |
          set -euo pipefail
          out=dist/aios-database-linux-x64
          mkdir -p "$out"
          cp gen-model/target/release/aios-database "$out/"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "vendor_ref=${VENDOR_REF}"
            echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "target=x86_64-unknown-linux-gnu"
          } > "$out/BUILD.txt"
          ls -la "$out"

      - name: Assemble direct deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.REVIEW_JWT_SECRET }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch deploy/backend-20260918 "https://x-access-token:${GH_TOKEN}@github.com/happyrust/gen-model.git" deploysrc
          (cd deploysrc && python3 deploy/linux/render_dboption.py)
          cp deploysrc/deploy/linux/install_backend.sh dist/aios-database-linux-x64/install_backend.sh
          cp deploysrc/bundle/DbOption.toml dist/aios-database-linux-x64/DbOption.toml
          chmod +x dist/aios-database-linux-x64/install_backend.sh
          mkdir -p dist/aios-database-linux-x64/resource
          cp -r gen-model/resource/surreal dist/aios-database-linux-x64/resource/
          mkdir -p surrealbin
          gh run download 361126901 --repo happyrust/gen-model --name surreal-linux-x64-fork --dir surrealbin
          cp surrealbin/surreal dist/aios-database-linux-x64/surreal
          chmod +x dist/aios-database-linux-x64/surreal

      - name: Direct deploy to Ubuntu
        env:
          REMOTE_HOST: '123.57.182.243'
          REMOTE_USER: 'root'
          REMOTE_PASS: ${{ secrets.DEPLOY_REMOTE_PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync
          test -n "$REMOTE_PASS"
          opts='-o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15'
          remote_dir="/tmp/aios-deploy-${GITHUB_RUN_ID}"
          sshpass -p "$REMOTE_PASS" ssh $opts "$REMOTE_USER@$REMOTE_HOST" "mkdir -p '$remote_dir'"
          sshpass -p "$REMOTE_PASS" rsync -az -e "ssh $opts" dist/aios-database-linux-x64/ "$REMOTE_USER@$REMOTE_HOST:$remote_dir/"
          sshpass -p "$REMOTE_PASS" ssh $opts "$REMOTE_USER@$REMOTE_HOST" "INSTALL_DIR=/opt/aios-database DATA_DIR=/var/lib/aios-database SURREAL_BIND=127.0.0.1:8009 SURREAL_DATA_DIR=/var/lib/surrealdb/ams-8009 HTTP_PORT=8022 PUBLIC_HOST=$REMOTE_HOST REVIEW_SPLIT_PREFIXES='api/review api/auth' SKIP_NGINX=0 bash '$remote_dir/install_backend.sh'"
          code="$(curl -sS -o /tmp/review-health -w '%{http_code}' --max-time 30 "http://$REMOTE_HOST/api/review/health" || true)"
          cat /tmp/review-health
          test "$code" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "http://$REMOTE_HOST/api/v1/health" || true)" = 200
