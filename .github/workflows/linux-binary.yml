name: Linux binary

# 目标：在 ubuntu runner 上构出 aios-database 的 x86_64-linux 可执行文件，供 123.57.182.243 部署。
# 与 windows-binary.yml 的差别只有两处：一是 path 依赖的五个 vendor 仓要自己克隆到 ../vendor
# （windows 那条从 2026-09-11 起就是因为少了这一步在 34 秒里挂掉的），二是 protoc / libclang
# 换成 linux 版。工具链版本、feature 组合与 windows 那条保持一致。

on:
  workflow_dispatch:
    inputs:
      vendor_ref:
        description: '五个 vendor 仓统一使用的分支或提交'
        required: false
        default: 'ci/gen-model-linux-20260918'
        type: string

permissions:
  contents: read

concurrency:
  group: linux-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml 把 target-dir 指到仓库外（../target）；CI 里收回工作区内，
  # 缓存与打包路径才能对上。环境变量优先级高于 config 文件。
  CARGO_TARGET_DIR: target
  RUST_TOOLCHAIN: nightly-2026-08-02
  PROTOC_ARCHIVE_URL: https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
  VENDOR_REF: ${{ inputs.vendor_ref || 'ci/gen-model-linux-20260918' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout gen-model
        uses: actions/checkout@v4
        with:
          path: gen-model

      # Cargo.toml 用 path = "../vendor/..." 吃五个仓，其中四个是私有的，GITHUB_TOKEN 够不着。
      - name: Checkout vendor path dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "secret GH_PAT 未设置：e3d-model / e3d-io / e3d-attlib / plant-mbd 都是私有仓，克隆不下来" >&2
            exit 1
          fi
          mkdir -p vendor
          for repo in e3d-model e3d-io e3d-attlib plant-mbd old-aios-core; do
            git clone --quiet --depth 1 --branch "${VENDOR_REF}" \
              "https://x-access-token:${GH_PAT}@github.com/happyrust/${repo}.git" "vendor/${repo}"
            echo "${repo} -> $(git -C "vendor/${repo}" rev-parse --short HEAD)"
          done

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libssl-dev unzip
          # manifold-sys 的 bindgen 要 libclang；.cargo/config.toml 里填的是 runner 上不存在的
          # D:\LLVM\bin，force = false 所以这里给的环境变量说了算。
          libclang_dir="$(dirname "$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit)")"
          echo "LIBCLANG_PATH=${libclang_dir}" >> "$GITHUB_ENV"
          echo "libclang: ${libclang_dir}"

      - name: Install protoc
        run: |
          set -euo pipefail
          curl -fsSL "$PROTOC_ARCHIVE_URL" -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          chmod +x /tmp/protoc/bin/protoc
          echo "PROTOC=/tmp/protoc/bin/protoc" >> "$GITHUB_ENV"
          /tmp/protoc/bin/protoc --version

      - name: Install Rust nightly (pinned)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gen-model/target
          key: cargo-linux-release-${{ hashFiles('gen-model/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-linux-release-${{ hashFiles('gen-model/Cargo.lock') }}-
            cargo-linux-release-

      - name: Build release binary
        working-directory: gen-model
        run: >-
          cargo build --release --locked --bin aios-database
          --no-default-features
          --features ws,gen_model,manifold,project_hd,http_api

      # 键里带 run_id：失败轮也把编译进度存下来，重试从断点继续。
      - name: Save cargo cache
        if: always() && steps.cargo-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gen-model/target
          key: cargo-linux-release-${{ hashFiles('gen-model/Cargo.lock') }}-${{ github.run_id }}

      - name: Package binary
        run: |
          set -euo pipefail
          out=dist/aios-database-linux-x64
          mkdir -p "$out"
          cp gen-model/target/release/aios-database "$out/"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "vendor_ref=${VENDOR_REF}"
            echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "target=x86_64-unknown-linux-gnu"
          } > "$out/BUILD.txt"
          ls -la "$out"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: aios-database-linux-x64
          path: dist/aios-database-linux-x64
          if-no-files-found: error
          retention-days: 30
