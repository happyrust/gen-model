[net]
git-fetch-with-cli = true

# manifold-sys 的 bindgen 需要 libclang，缺失时 build script 直接 panic
[env]
LIBCLANG_PATH = { value = "D:\\LLVM\\bin", force = false }

# [target.x86_64-pc-windows-msvc]
# linker = "rust-lld.exe"
# rustdocflags = ["-Clinker=rust-lld.exe"]

#[unstable]
#codegen-backend = true
#
#[profile.dev]
#codegen-backend = "cranelift"
#
#[profile.dev.package."*"]
#codegen-backend = "cranelift"

[build]
target-dir = "../target"
rustflags = ["-Z", "threads=8"]
# 本仓库 19 个 bin 目标 × 前端 8 线程，默认 -j（=逻辑核数）会耗尽系统句柄/提交内存，
# 触发 "could not create 8 threads (os error 1450)" 并留下半成品 rlib（表现为 std/Vec 找不到）。
jobs = 8

# target.<triple>.rustflags 会整体顶掉 build.rustflags，所以 -Z threads=8 必须在这里重复一次。
# /DEBUG:NONE 让 link.exe 不产出 PDB（rustc 自带的 /DEBUG 在前，链接器取最后一个）。
[target.x86_64-pc-windows-msvc]
rustflags = ["-Z", "threads=8", "-C", "link-arg=/DEBUG:NONE"]

